# modules/_module_registry.yml
# Central Module Registry - THE CONTROL CENTER
# Change 'enabled: false' to disable any module
# =============================================

modules:
  # API Authentication Modules (Load First)
  bigquery_auth:
    enabled: true
    priority: 1
    description: "BigQuery authentication and configuration"
  
  claude_api_config:
    enabled: true
    priority: 2
    description: "Claude API credentials management"
  
  # Core Feature Modules
  generate_summary:
    enabled: true
    priority: 10
    description: "AI-powered book summary generation"
  
  bulk_import:
    enabled: true
    priority: 11
    description: "Parse and upload summaries in bulk"
  
  add_single:
    enabled: true
    priority: 12
    description: "Add individual book summary entries"
  
  browse_data:
    enabled: true
    priority: 13
    description: "Browse and download all summaries"
  
  visualizations:
    enabled: true
    priority: 14
    description: "Rich data visualizations with charts"
  
  about:
    enabled: true
    priority: 99
    description: "Application information and schema"

# Global Settings
settings:
  auto_install: false              # Don't auto-install packages
  check_versions: true
  verbose: true                    # Show loading messages
  dev_mode: false

# Application Metadata
app:
  name: "Book Summary Complete Suite"
  version: "3.0.0"
  description: "AI-powered book summary generation with cloud database storage"
  author: "Your Team"
  table: "atera-2.Wonderfulp_March.book_summaries_test3"
