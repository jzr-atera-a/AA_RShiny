<!DOCTYPE html>
<html>
<head>
    <title>Quest 3 Left Controller Tracking</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            font-family: 'Courier New', monospace; 
            background: #000; 
            color: #0f0; 
        }
        
        #info {
            position: absolute; 
            top: 10px; 
            left: 10px;
            width: 450px;
            background: rgba(0, 0, 0, 0.95); 
            padding: 20px; 
            font-size: 14px;
            z-index: 100;
            border: 2px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        
        #info h2 {
            margin: 0 0 15px 0;
            color: #00ff00;
            text-align: center;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 5px;
            background: rgba(0, 100, 0, 0.2);
            border-radius: 3px;
        }
        
        .label {
            color: #00dd00;
            font-weight: bold;
            min-width: 120px;
        }
        
        .value {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            text-align: right;
            flex: 1;
        }
        
        .detected { color: #00ff00; }
        .lost { color: #ff0000; }
        
        hr {
            border: none;
            border-top: 1px solid #00ff00;
            margin: 15px 0;
        }
        
        .instruction {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        #visualization {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🎮 Left Controller Tracker</h2>
        
        <div class="data-row">
            <span class="label">Status:</span>
            <span id="status" class="value lost">NOT STARTED</span>
        </div>
        
        <hr>
        
        <div class="data-row">
            <span class="label">Position X:</span>
            <span id="posX" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Position Y:</span>
            <span id="posY" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Position Z:</span>
            <span id="posZ" class="value">-</span>
        </div>
        
        <hr>
        
        <div class="data-row">
            <span class="label">Rotation X:</span>
            <span id="rotX" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Rotation Y:</span>
            <span id="rotY" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Rotation Z:</span>
            <span id="rotZ" class="value">-</span>
        </div>
        
        <hr>
        
        <div class="data-row">
            <span class="label">Distance:</span>
            <span id="distance" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Heading:</span>
            <span id="heading" class="value">-</span>
        </div>
        
        <hr>
        
        <div class="data-row">
            <span class="label">WS Sent:</span>
            <span id="wsSent" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">WS Count:</span>
            <span id="wsCount" class="value">0</span>
        </div>
        
        <hr>
        
        <div class="instruction">
            Move your left controller to see tracking data
        </div>
    </div>

    <div id="debugLog" style="position: absolute; top: 10px; right: 10px; width: 400px; 
        background: rgba(0, 0, 0, 0.95); padding: 20px; font-size: 12px; z-index: 100;
        border: 2px solid #ff0000; border-radius: 10px; color: #ff0000; 
        font-family: 'Courier New', monospace; max-height: 600px; overflow-y: auto;">
        <h3 style="margin: 0 0 10px 0; color: #ff0000;">DEBUG LOG</h3>
        <div id="logContent"></div>
    </div>

    <canvas id="visualization"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let scene, camera, renderer;
        let leftControllerMarker, trailLine;
        let trailPoints = [];
        let xrSession = null;
        let referenceSpace = null;
        let visualizationCanvas, visualizationCtx;

        // WebSocket for sending data to server
        let ws = null;
        let lastWebSocketSend = 0;
        let wsSendCount = 0;  // Track how many messages sent
        const WS_SEND_INTERVAL = 200;  // Send every 200ms (0.2s)
        const JETSON_IP = '192.168.100.10';
        const WS_PORT = 8443;
        const WS_SERVER = `wss://${JETSON_IP}:${WS_PORT}`;
        
        // Store latest controller data for WebSocket
        let latestControllerData = null;
        let firstDataStored = false;
        let logLines = [];
        
        function addLog(msg) {
            const timestamp = new Date().toLocaleTimeString();
            logLines.push(`[${timestamp}] ${msg}`);
            if (logLines.length > 50) logLines.shift();  // Keep last 50
            document.getElementById('logContent').innerHTML = logLines.join('<br>');
        }
        
        console.log('📍 WebSocket URL:', WS_SERVER);

        function init() {
            console.log('🚀 Initializing scene...');
            
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            
            // Lighting
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            scene.add(light);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Visualization canvas setup
            visualizationCanvas = document.getElementById('visualization');
            visualizationCtx = visualizationCanvas.getContext('2d');
            
            // Create visual marker for controller position
            createControllerMarker();
            
            // Create AR button
            const button = ARButton.createButton(renderer, {
                requiredFeatures: ['local-floor'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            document.body.appendChild(button);

            // Session events
            renderer.xr.addEventListener('sessionstart', onSessionStart);
            renderer.xr.addEventListener('sessionend', onSessionEnd);
            
            // Start animation loop
            renderer.setAnimationLoop(animate);

            console.log('✅ Scene initialized');
            console.log('🔌 Connecting to WebSocket...');
            
            // Try to connect to WebSocket server (optional - for data logging)
            connectWebSocket();
        }

        function createControllerMarker() {
            // Create a visual marker that shows where the controller is
            const geometry = new THREE.SphereGeometry(0.03, 16, 16);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xff00ff,
                transparent: true,
                opacity: 0.8
            });
            leftControllerMarker = new THREE.Mesh(geometry, material);
            
            // Add a directional indicator (cone pointing forward)
            const coneGeometry = new THREE.ConeGeometry(0.02, 0.08, 8);
            coneGeometry.rotateX(Math.PI / 2); // Point along Z axis
            const coneMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cone = new THREE.Mesh(coneGeometry, coneMaterial);
            cone.position.z = 0.05;
            leftControllerMarker.add(cone);
            
            scene.add(leftControllerMarker);
            leftControllerMarker.visible = false;

            // Create trail line
            const lineGeometry = new THREE.BufferGeometry();
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ffff,
                transparent: true,
                opacity: 0.6
            });
            trailLine = new THREE.Line(lineGeometry, lineMaterial);
            scene.add(trailLine);
        }

        let wsInterval = null;

        function onSessionStart() {
            xrSession = renderer.xr.getSession();
            referenceSpace = renderer.xr.getReferenceSpace();
            
            addLog('✓ AR SESSION STARTED');
            addLog('WebSocket: ' + (ws ? 'CONNECTED' : 'NULL'));
            
            console.log('✅ AR SESSION STARTED');
            console.log('WebSocket status:', ws ? ws.readyState : 'null');
            
            document.getElementById('status').textContent = '✓ AR SESSION ACTIVE';
            document.getElementById('status').className = 'value detected';
            
            // Start WebSocket send interval (every 0.2s)
            wsInterval = setInterval(() => {
                if (latestControllerData && ws && ws.readyState === WebSocket.OPEN) {
                    // Access properties directly, don't destructure!
                    sendToWebSocket(
                        latestControllerData.pos, 
                        latestControllerData.euler, 
                        latestControllerData.distance, 
                        latestControllerData.heading
                    );
                    wsSendCount++;
                    
                    // Update visible display
                    document.getElementById('wsSent').textContent = 
                        `X:${(latestControllerData.pos.x*100).toFixed(1)} Z:${(latestControllerData.pos.z*100).toFixed(1)} H:${latestControllerData.heading.toFixed(1)}°`;
                    document.getElementById('wsCount').textContent = wsSendCount.toString();
                    
                    // Log occasionally
                    if (wsSendCount % 25 === 0) {  // Every 5 seconds
                        addLog(`WS #${wsSendCount}: X=${(latestControllerData.pos.x*100).toFixed(1)} H=${latestControllerData.heading.toFixed(1)}°`);
                    }
                } else {
                    if (wsSendCount % 10 === 0) {  // Every 2 seconds
                        addLog(`CANNOT SEND: data=${!!latestControllerData} ws=${ws ? ws.readyState : 'null'}`);
                    }
                }
            }, 200);
            
            addLog('✓ WS interval started (every 0.2s)');
            console.log('✓ AR session started - tracking left controller + WebSocket sender active');
        }

        function onSessionEnd() {
            xrSession = null;
            referenceSpace = null;
            
            // Stop WebSocket send interval
            if (wsInterval) {
                clearInterval(wsInterval);
                wsInterval = null;
            }
            
            document.getElementById('status').textContent = 'SESSION ENDED';
            document.getElementById('status').className = 'value lost';
            
            // Reset display
            resetDisplay();
        }

        function resetDisplay() {
            document.getElementById('posX').textContent = '-';
            document.getElementById('posY').textContent = '-';
            document.getElementById('posZ').textContent = '-';
            document.getElementById('rotX').textContent = '-';
            document.getElementById('rotY').textContent = '-';
            document.getElementById('rotZ').textContent = '-';
            document.getElementById('distance').textContent = '-';
            document.getElementById('heading').textContent = '-';
            
            leftControllerMarker.visible = false;
            trailPoints = [];
        }

        function animate(time, frame) {
            if (frame && referenceSpace) {
                // Get viewer pose
                const viewerPose = frame.getViewerPose(referenceSpace);
                
                if (viewerPose) {
                    // Track all input sources (controllers)
                    let leftControllerFound = false;
                    
                    for (const source of xrSession.inputSources) {
                        // Check if this is the left controller
                        if (source.handedness === 'left' && source.gripSpace) {
                            leftControllerFound = true;
                            
                            // Get controller pose
                            const gripPose = frame.getPose(source.gripSpace, referenceSpace);
                            
                            if (gripPose) {
                                const pos = gripPose.transform.position;
                                const ori = gripPose.transform.orientation;
                                
                                // Update visual marker
                                leftControllerMarker.position.set(pos.x, pos.y, pos.z);
                                leftControllerMarker.quaternion.set(ori.x, ori.y, ori.z, ori.w);
                                leftControllerMarker.visible = true;
                                
                                // Add to trail
                                addToTrail(pos);
                                
                                // Convert quaternion to Euler angles
                                const euler = new THREE.Euler();
                                const quat = new THREE.Quaternion(ori.x, ori.y, ori.z, ori.w);
                                euler.setFromQuaternion(quat, 'XYZ');
                                
                                // Calculate distance from origin
                                const distance = Math.sqrt(pos.x * pos.x + pos.y * pos.y + pos.z * pos.z);
                                
                                // Calculate heading (rotation around Y axis)
                                const heading = Math.atan2(pos.x, pos.z) * 180 / Math.PI;
                                
                                // Store latest data for WebSocket (CLONE values, don't store references!)
                                latestControllerData = { 
                                    pos: { x: pos.x, y: pos.y, z: pos.z },
                                    euler: { x: euler.x, y: euler.y, z: euler.z },
                                    distance: distance,
                                    heading: heading 
                                };
                                
                                // Log first update ONCE
                                if (!firstDataStored) {
                                    firstDataStored = true;
                                    addLog(`✓ First controller data stored: X=${(pos.x*100).toFixed(1)}`);
                                }
                                
                                // Update display
                                updateDisplay(pos, euler, distance, heading);
                                
                                // Update visualization
                                updateVisualization(pos, euler);
                            }
                        }
                    }
                    
                    if (!leftControllerFound) {
                        document.getElementById('status').textContent = '⚠ LEFT CONTROLLER NOT FOUND';
                        document.getElementById('status').className = 'value lost';
                        leftControllerMarker.visible = false;
                    } else {
                        document.getElementById('status').textContent = '✓ TRACKING LEFT CONTROLLER';
                        document.getElementById('status').className = 'value detected';
                    }
                }
            }
            
            renderer.render(scene, camera);
        }

        function addToTrail(pos) {
            trailPoints.push(new THREE.Vector3(pos.x, pos.y, pos.z));
            
            // Keep only last 100 points
            if (trailPoints.length > 100) {
                trailPoints.shift();
            }
            
            // Update trail line geometry
            if (trailPoints.length > 1) {
                trailLine.geometry.setFromPoints(trailPoints);
            }
        }

        function updateDisplay(pos, euler, distance, heading) {
            // Position (in meters and centimeters)
            document.getElementById('posX').textContent = `${pos.x.toFixed(3)}m (${(pos.x * 100).toFixed(1)}cm)`;
            document.getElementById('posY').textContent = `${pos.y.toFixed(3)}m (${(pos.y * 100).toFixed(1)}cm)`;
            document.getElementById('posZ').textContent = `${pos.z.toFixed(3)}m (${(pos.z * 100).toFixed(1)}cm)`;
            
            // Rotation (in degrees)
            document.getElementById('rotX').textContent = `${(euler.x * 180 / Math.PI).toFixed(1)}°`;
            document.getElementById('rotY').textContent = `${(euler.y * 180 / Math.PI).toFixed(1)}°`;
            document.getElementById('rotZ').textContent = `${(euler.z * 180 / Math.PI).toFixed(1)}°`;
            
            // Distance and heading
            document.getElementById('distance').textContent = `${distance.toFixed(3)}m (${(distance * 100).toFixed(1)}cm)`;
            document.getElementById('heading').textContent = `${heading.toFixed(1)}°`;
        }

        function updateVisualization(pos, euler) {
            const canvas = visualizationCanvas;
            const ctx = visualizationCtx;
            const w = canvas.width;
            const h = canvas.height;
            
            // Clear
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
            ctx.fillRect(0, 0, w, h);
            
            // Draw grid
            ctx.strokeStyle = '#003300';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = i * w / 10;
                const y = i * h / 10;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            
            // Draw center
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(w/2, h/2, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw controller position (top-down view: X-Z plane)
            const scale = 40; // pixels per meter
            const cx = w/2 + pos.x * scale;
            const cz = h/2 - pos.z * scale; // Flip Z for screen coordinates
            
            if (cx >= 0 && cx <= w && cz >= 0 && cz <= h) {
                // Draw position
                ctx.fillStyle = '#ff00ff';
                ctx.beginPath();
                ctx.arc(cx, cz, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw direction indicator
                const dirLength = 20;
                const heading = euler.y; // Y rotation for heading
                const dx = Math.sin(heading) * dirLength;
                const dy = -Math.cos(heading) * dirLength;
                
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cz);
                ctx.lineTo(cx + dx, cz + dy);
                ctx.stroke();
            }
            
            // Draw labels
            ctx.fillStyle = '#00ff00';
            ctx.font = '10px monospace';
            ctx.fillText('Top View (X-Z)', 5, 15);
            ctx.fillText('Y: ' + (pos.y * 100).toFixed(0) + 'cm', 5, h - 5);
        }

        function connectWebSocket() {
            console.log('🔌 ATTEMPTING WebSocket connection to:', WS_SERVER);
            
            try {
                ws = new WebSocket(WS_SERVER);
                
                ws.onopen = () => {
                    console.log('✅ WebSocket CONNECTED!');
                    console.log('✅ Ready to send data');
                };
                
                ws.onerror = (error) => {
                    console.error('❌ WebSocket ERROR:', error);
                    console.error('Server:', WS_SERVER);
                    ws = null;
                };
                
                ws.onclose = () => {
                    console.warn('⚠ WebSocket CLOSED');
                    ws = null;
                };
            } catch (err) {
                console.error('❌ WebSocket creation failed:', err);
                ws = null;
            }
        }

        function sendToWebSocket(pos, euler, distance, heading) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            
            // Send in format expected by trajectory_websocket_server.py
            const data = {
                command: 'ROBOT_POSITION',
                data: {
                    x_cm: pos.x * 100,  // Convert to cm
                    z_cm: pos.z * 100,  // Convert to cm
                    heading_deg: heading,
                    distance_from_center_cm: distance * 100,
                    timestamp: Date.now() / 1000
                }
            };
            
            try {
                ws.send(JSON.stringify(data));
            } catch (error) {
                console.error('❌ Failed to send data:', error);
            }
        }

        // Initialize
        init();
    </script>
</body>
</html>
