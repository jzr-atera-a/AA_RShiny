<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Quest 3 - Trajectory Drawing</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <style>
            body {
                margin: 0;
                font-family: monospace;
                background-color: #000;
                color: #fff;
            }
            #info {
                position: absolute;
                top: 10px;
                width: 100%;
                text-align: center;
                z-index: 100;
                display: block;
                background: rgba(0,0,0,0.8);
                padding: 10px;
            }
            .status-good { color: #0f0; }
            .status-bad { color: #f00; }
            .status-warning { color: #ff0; }
        </style>
    </head>
    <body>

        <div id="info">
            <strong>Quest 3 Trajectory Drawing</strong><br/>
            Connected: <span id="conn-status" class="status-bad">NO</span> | 
            Floor: <span id="floor-status" class="status-warning">Detecting...</span><br/>
            <small>Point RIGHT controller at floor + hold TRIGGER to draw path</small><br/>
            Points: <span id="point-count">0</span> | 
            Distance: <span id="path-distance">0.00</span>m
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from 'three';
            import { ARButton } from 'three/addons/webxr/ARButton.js';

            // ======================================================================
            // CONFIGURATION
            // ======================================================================
            
            const JETSON_IP = '192.168.100.10';  // Update with your Jetson Nano IP
            const WS_PORT = 8443;                // WebSocket server port
            
            const TRAJECTORY_COLOR = 0x00ff00;   // Green trajectory line
            const TRAJECTORY_WIDTH = 0.02;       // Line width in meters (2cm)
            const MIN_POINT_DISTANCE = 0.05;     // Minimum distance between points (5cm)
            const FLOOR_Y_TOLERANCE = 0.1;       // Tolerance for floor detection (10cm)
            
            // ======================================================================
            // GLOBAL STATE
            // ======================================================================
            
            let websocket = null;
            let wsConnected = false;
            let commandCount = 0;
            
            let floorDetected = false;
            let floorY = 0;  // Y-coordinate of detected floor
            
            let trajectoryPoints = [];  // Array of Vector3 points
            let trajectoryLine = null;  // THREE.Line object
            let isDrawing = false;
            let lastAddedPoint = null;
            let totalDistance = 0;
            
            // ======================================================================
            // WEBSOCKET CONNECTION
            // ======================================================================
            
            function connectToServer() {
                const wsUrl = `wss://${JETSON_IP}:${WS_PORT}`;
                
                console.log('Connecting to:', wsUrl);
                
                try {
                    websocket = new WebSocket(wsUrl);
                    
                    websocket.onopen = () => {
                        console.log('✓ WebSocket connected');
                        wsConnected = true;
                        document.getElementById('conn-status').textContent = 'YES';
                        document.getElementById('conn-status').className = 'status-good';
                    };
                    
                    websocket.onerror = (error) => {
                        console.error('✗ WebSocket error:', error);
                        document.getElementById('conn-status').textContent = 'ERROR';
                        document.getElementById('conn-status').className = 'status-bad';
                    };
                    
                    websocket.onclose = () => {
                        wsConnected = false;
                        document.getElementById('conn-status').textContent = 'NO';
                        document.getElementById('conn-status').className = 'status-bad';
                        console.log('✗ Disconnected, reconnecting in 2s...');
                        setTimeout(connectToServer, 2000);
                    };
                    
                    websocket.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            // Handle server messages if needed
                        } catch (e) {
                            console.error('Parse error:', e);
                        }
                    };
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                }
            }

            function sendTrajectoryData() {
                if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
                
                const data = {
                    timestamp: Date.now(),
                    trajectory: {
                        points: trajectoryPoints.map(p => ({x: p.x, y: p.y, z: p.z})),
                        totalDistance: totalDistance,
                        floorY: floorY
                    }
                };
                
                try {
                    websocket.send(JSON.stringify(data));
                } catch (error) {
                    console.error('Failed to send trajectory:', error);
                }
            }

            // ======================================================================
            // FLOOR DETECTION
            // ======================================================================
            
            function detectFloor(frame, referenceSpace) {
                if (floorDetected) return;
                
                // Try to get detected planes from WebXR
                if (frame.detectedPlanes) {
                    for (const plane of frame.detectedPlanes) {
                        const pose = frame.getPose(plane.planeSpace, referenceSpace);
                        if (!pose) continue;
                        
                        // Check if plane is horizontal (floor-like)
                        const orientation = pose.transform.orientation;
                        const normal = new THREE.Vector3(0, 1, 0);
                        normal.applyQuaternion(new THREE.Quaternion(
                            orientation.x, 
                            orientation.y, 
                            orientation.z, 
                            orientation.w
                        ));
                        
                        // If plane is mostly horizontal (normal pointing up)
                        if (normal.y > 0.9) {
                            floorY = pose.transform.position.y;
                            floorDetected = true;
                            document.getElementById('floor-status').textContent = 'Detected!';
                            document.getElementById('floor-status').className = 'status-good';
                            console.log('Floor detected at Y:', floorY);
                            
                            // Add visual indicator for floor
                            addFloorGrid();
                            break;
                        }
                    }
                }
            }

            function addFloorGrid() {
                // Create a visual grid on the floor
                const gridSize = 5;  // 5 meters
                const divisions = 20;
                
                const gridHelper = new THREE.GridHelper(gridSize, divisions, 0x444444, 0x222222);
                gridHelper.position.y = floorY;
                scene.add(gridHelper);
            }

            // ======================================================================
            // RAYCASTING (Point controller at floor)
            // ======================================================================
            
            function getFloorIntersection(controller) {
                if (!floorDetected) return null;
                
                // Create a ray from controller position and direction
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity().extractRotation(controller.matrixWorld);
                
                const raycaster = new THREE.Raycaster();
                raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                
                // Calculate intersection with floor plane
                const floorNormal = new THREE.Vector3(0, 1, 0);
                const floorPoint = new THREE.Vector3(0, floorY, 0);
                const planeConstant = -floorNormal.dot(floorPoint);
                
                const t = -(raycaster.ray.origin.dot(floorNormal) + planeConstant) / 
                          raycaster.ray.direction.dot(floorNormal);
                
                if (t > 0) {
                    const intersection = new THREE.Vector3();
                    intersection.copy(raycaster.ray.direction).multiplyScalar(t).add(raycaster.ray.origin);
                    
                    // Check if intersection is close to floor
                    if (Math.abs(intersection.y - floorY) < FLOOR_Y_TOLERANCE) {
                        return intersection;
                    }
                }
                
                return null;
            }

            // ======================================================================
            // TRAJECTORY DRAWING
            // ======================================================================
            
            function addTrajectoryPoint(point) {
                // Check minimum distance from last point
                if (lastAddedPoint) {
                    const distance = point.distanceTo(lastAddedPoint);
                    if (distance < MIN_POINT_DISTANCE) {
                        return; // Too close to last point
                    }
                    totalDistance += distance;
                }
                
                // Add point to trajectory
                trajectoryPoints.push(point.clone());
                lastAddedPoint = point.clone();
                
                // Update display
                document.getElementById('point-count').textContent = trajectoryPoints.length;
                document.getElementById('path-distance').textContent = totalDistance.toFixed(2);
                
                // Update or create trajectory line
                updateTrajectoryLine();
                
                // Send to server
                sendTrajectoryData();
            }

            function updateTrajectoryLine() {
                // Remove old line if exists
                if (trajectoryLine) {
                    scene.remove(trajectoryLine);
                    trajectoryLine.geometry.dispose();
                    trajectoryLine.material.dispose();
                }
                
                if (trajectoryPoints.length < 2) return;
                
                // Create smooth curve through points
                const curve = new THREE.CatmullRomCurve3(trajectoryPoints);
                const points = curve.getPoints(trajectoryPoints.length * 10);
                
                // Create tube geometry for visible line
                const tubeGeometry = new THREE.TubeGeometry(
                    curve,
                    trajectoryPoints.length * 10,
                    TRAJECTORY_WIDTH,
                    8,
                    false
                );
                
                const material = new THREE.MeshBasicMaterial({ 
                    color: TRAJECTORY_COLOR,
                    transparent: true,
                    opacity: 0.8
                });
                
                trajectoryLine = new THREE.Mesh(tubeGeometry, material);
                scene.add(trajectoryLine);
            }

            function clearTrajectory() {
                trajectoryPoints = [];
                lastAddedPoint = null;
                totalDistance = 0;
                
                if (trajectoryLine) {
                    scene.remove(trajectoryLine);
                    trajectoryLine.geometry.dispose();
                    trajectoryLine.material.dispose();
                    trajectoryLine = null;
                }
                
                document.getElementById('point-count').textContent = '0';
                document.getElementById('path-distance').textContent = '0.00';
                
                sendTrajectoryData();
            }

            // ======================================================================
            // CONTROLLER INPUT HANDLING
            // ======================================================================
            
            function handleControllerInput(controller, gamepad, controllerIndex) {
                if (!floorDetected) return;
                if (controllerIndex !== 1) return; // Only RIGHT controller (index 1)
                
                const triggerPressed = gamepad.buttons[0] && gamepad.buttons[0].pressed;
                const gripPressed = gamepad.buttons[1] && gamepad.buttons[1].pressed;
                
                // TRIGGER = Draw trajectory
                if (triggerPressed) {
                    const floorPoint = getFloorIntersection(controller);
                    if (floorPoint) {
                        if (!isDrawing) {
                            isDrawing = true;
                            console.log('Started drawing trajectory');
                        }
                        addTrajectoryPoint(floorPoint);
                    }
                } else {
                    if (isDrawing) {
                        isDrawing = false;
                        console.log('Stopped drawing trajectory');
                    }
                }
                
                // GRIP = Clear trajectory
                if (gripPressed) {
                    clearTrajectory();
                    console.log('Trajectory cleared');
                }
            }

            // ======================================================================
            // THREE.JS SCENE SETUP
            // ======================================================================
            
            let camera, scene, renderer;
            let controller1, controller2;

            function init() {
                const container = document.createElement('div');
                document.body.appendChild(container);

                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(
                    70,
                    window.innerWidth / window.innerHeight,
                    0.01,
                    20
                );

                // Add lighting
                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
                light.position.set(0.5, 1, 0.25);
                scene.add(light);

                // Setup renderer
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setAnimationLoop(animate);
                renderer.xr.enabled = true;
                container.appendChild(renderer.domElement);

                // Add AR button
                const arButton = ARButton.createButton(renderer, {
                    requiredFeatures: ['hit-test', 'plane-detection']
                });
                document.body.appendChild(arButton);

                // Setup controllers
                controller1 = renderer.xr.getController(1);  // RIGHT controller
                scene.add(controller1);

                controller2 = renderer.xr.getController(0);  // LEFT controller
                scene.add(controller2);
                
                // Add visual ray indicator for RIGHT controller
                const rayGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, -5)
                ]);
                const rayMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.5
                });
                const rayLine = new THREE.Line(rayGeometry, rayMaterial);
                controller1.add(rayLine);

                // Window resize handler
                window.addEventListener('resize', onWindowResize);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerWidth;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // ======================================================================
            // ANIMATION LOOP
            // ======================================================================
            
            function animate() {
                const session = renderer.xr.getSession();
                
                if (session) {
                    const frame = renderer.xr.getFrame();
                    const referenceSpace = renderer.xr.getReferenceSpace();
                    
                    // Detect floor
                    if (frame && referenceSpace) {
                        detectFloor(frame, referenceSpace);
                    }
                    
                    // Handle controller input
                    const inputSources = session.inputSources;
                    inputSources.forEach((source, index) => {
                        const gamepad = source.gamepad;
                        if (!gamepad) return;
                        
                        const controller = index === 1 ? controller1 : controller2;
                        handleControllerInput(controller, gamepad, index);
                    });
                }
                
                renderer.render(scene, camera);
            }

            // ======================================================================
            // INITIALIZATION
            // ======================================================================
            
            init();
            connectToServer();

            console.log('Quest 3 Trajectory Drawing initialized');
            console.log('Instructions:');
            console.log('- Point RIGHT controller at floor');
            console.log('- Hold TRIGGER to draw trajectory');
            console.log('- Press GRIP to clear trajectory');
        </script>
    </body>
</html>
