<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Quest 3 Controller Tracking</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <style>
            body {
                margin: 0;
                font-family: monospace;
            }
            #info {
                position: absolute;
                top: 0;
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                text-align: center;
                color: #fff;
                background: rgba(0, 0, 0, 0.7);
                font-size: 14px;
                z-index: 1;
            }
            .status-good { color: #0f0; }
            .status-bad { color: #f00; }
            button {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 15px 30px;
                font-size: 16px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                z-index: 2;
            }
            button:hover {
                background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            }
        </style>
    </head>
    <body>
        <div id="info">
            Quest 3 Controller Tracking | 
            Connected: <span id="conn-status" class="status-bad">NO</span> | 
            Commands: <span id="cmd-count">0</span> | 
            Rate: <span id="rate">0</span>/s
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from 'three';

            // ==================================================================
            // CONFIGURATION
            // ==================================================================
            
            const SHINY_IP = '192.168.100.2';  // Your computer's IP
            const WS_PORT = 8443;               // Python WSS server port
            
            // ==================================================================
            // WEBSOCKET CONNECTION
            // ==================================================================
            
            let ws = null;
            let wsConnected = false;
            let commandCount = 0;
            let lastRateUpdate = Date.now();
            let commandsSinceLastRate = 0;

            function connectToWebSocket() {
                const wsUrl = `wss://${SHINY_IP}:${WS_PORT}`;
                
                console.log(`Connecting to WebSocket: ${wsUrl}`);
                
                try {
                    ws = new WebSocket(wsUrl);
                    
                    ws.onopen = () => {
                        console.log('✓ WebSocket connected!');
                        wsConnected = true;
                        document.getElementById('conn-status').textContent = 'YES';
                        document.getElementById('conn-status').className = 'status-good';
                    };
                    
                    ws.onerror = (error) => {
                        console.error('✗ WebSocket error:', error);
                        wsConnected = false;
                        document.getElementById('conn-status').textContent = 'ERROR';
                        document.getElementById('conn-status').className = 'status-bad';
                    };
                    
                    ws.onclose = () => {
                        console.log('✗ WebSocket closed');
                        wsConnected = false;
                        document.getElementById('conn-status').textContent = 'NO';
                        document.getElementById('conn-status').className = 'status-bad';
                        
                        // Try to reconnect after 2 seconds
                        setTimeout(connectToWebSocket, 2000);
                    };
                    
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                }
            }

            function sendControllerData() {
                if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) {
                    return;
                }

                try {
                    // Get XR session input sources for button/joystick data
                    const session = renderer.xr.getSession();
                    const inputSources = session ? session.inputSources : [];
                    
                    // Build controller data with positions and rotations
                    const data = {
                        timestamp: Date.now(),
                        controller1: {
                            position: {
                                x: controller1.position.x,
                                y: controller1.position.y,
                                z: controller1.position.z
                            },
                            rotation: {
                                x: controller1.rotation.x,
                                y: controller1.rotation.y,
                                z: controller1.rotation.z
                            }
                        },
                        controller2: {
                            position: {
                                x: controller2.position.x,
                                y: controller2.position.y,
                                z: controller2.position.z
                            },
                            rotation: {
                                x: controller2.rotation.x,
                                y: controller2.rotation.y,
                                z: controller2.rotation.z
                            }
                        }
                    };
                    
                    // Add gamepad data (buttons and joysticks) if available
                    // Note: inputSources[0] = LEFT, inputSources[1] = RIGHT
                    inputSources.forEach((source, index) => {
                        if (source.gamepad) {
                            const gamepad = source.gamepad;
                            // Map correctly: index 0 = LEFT (controller2), index 1 = RIGHT (controller1)
                            const controllerKey = index === 1 ? 'controller1' : 'controller2';
                            
                            // Joystick axes (thumbstick)
                            data[controllerKey].joystick = {
                                x: gamepad.axes[2] || 0,  // Thumbstick X
                                y: gamepad.axes[3] || 0   // Thumbstick Y
                            };
                            
                            // Buttons
                            data[controllerKey].buttons = {
                                trigger: gamepad.buttons[0] ? gamepad.buttons[0].value : 0,
                                grip: gamepad.buttons[1] ? gamepad.buttons[1].value : 0,
                                thumbstick: gamepad.buttons[3] ? gamepad.buttons[3].pressed : false,
                                a_x: gamepad.buttons[4] ? gamepad.buttons[4].pressed : false,
                                b_y: gamepad.buttons[5] ? gamepad.buttons[5].pressed : false
                            };
                        }
                    });

                    ws.send(JSON.stringify(data));
                    
                    commandCount++;
                    commandsSinceLastRate++;
                    document.getElementById('cmd-count').textContent = commandCount;
                    
                    // Update rate every second
                    const now = Date.now();
                    if (now - lastRateUpdate >= 1000) {
                        const rate = commandsSinceLastRate / ((now - lastRateUpdate) / 1000);
                        document.getElementById('rate').textContent = rate.toFixed(1);
                        commandsSinceLastRate = 0;
                        lastRateUpdate = now;
                    }
                    
                } catch (error) {
                    console.error('Error sending data:', error);
                }
            }

            // Connect to WebSocket immediately
            connectToWebSocket();

            // ==================================================================
            // THREE.JS SETUP (from working cones.html)
            // ==================================================================

            let camera, scene, renderer;
            let controller1, controller2;

            init();

            function init() {
                const container = document.createElement('div');
                document.body.appendChild(container);

                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
                light.position.set(0.5, 1, 0.25);
                scene.add(light);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setAnimationLoop(animate);
                renderer.xr.enabled = true;
                container.appendChild(renderer.domElement);

                // Custom AR button
                const arButton = document.createElement('button');
                arButton.textContent = 'START AR';
                arButton.style.position = 'absolute';
                arButton.style.bottom = '20px';
                arButton.style.left = '50%';
                arButton.style.transform = 'translateX(-50%)';
                arButton.onclick = async () => {
                    try {
                        const session = await navigator.xr.requestSession('immersive-ar', { 
                            optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers'] 
                        });
                        await renderer.xr.setSession(session);
                    } catch (error) {
                        alert('AR Error: ' + error.message);
                    }
                };
                document.body.appendChild(arButton);

                // Cone geometry for placement
                const geometry = new THREE.CylinderGeometry(0, 0.05, 0.2, 32).rotateX(Math.PI / 2);

                function onSelect() {
                    const material = new THREE.MeshPhongMaterial({ color: 0xffffff * Math.random() });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(0, 0, -0.3).applyMatrix4(controller1.matrixWorld);
                    mesh.quaternion.setFromRotationMatrix(controller1.matrixWorld);
                    scene.add(mesh);
                }

                // Controllers - SWAPPED because Quest reports them reversed
                // getController(0) = LEFT hand
                // getController(1) = RIGHT hand
                controller1 = renderer.xr.getController(1);  // RIGHT controller
                controller1.addEventListener('select', onSelect);
                scene.add(controller1);

                // Left controller
                controller2 = renderer.xr.getController(0);  // LEFT controller
                controller2.addEventListener('select', onSelect);
                scene.add(controller2);

                window.addEventListener('resize', onWindowResize);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // ==================================================================
            // ANIMATION LOOP - Send data continuously
            // ==================================================================
            
            let lastSendTime = 0;
            const SEND_INTERVAL = 50; // Send every 50ms (20Hz)

            function animate() {
                // Send controller data at 20Hz when in AR
                if (renderer.xr.isPresenting) {
                    const now = Date.now();
                    if (now - lastSendTime >= SEND_INTERVAL) {
                        sendControllerData();
                        lastSendTime = now;
                    }
                }
                
                renderer.render(scene, camera);
            }

        </script>
    </body>
</html>
