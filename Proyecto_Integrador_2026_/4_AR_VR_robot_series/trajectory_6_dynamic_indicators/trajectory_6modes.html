                ctx.lineTo(W-20, 55); 
                ctx.stroke();
                
                const chartY = 80;
                const chartH = (H - chartY - 40) / 3;
                
                // Chart 1: Battery Level vs Range
                drawBatteryRangeChart(ctx, 30, chartY, W - 60, chartH - 20);
                
                // Chart 2: Charging Session History
                drawChargingHistoryChart(ctx, 30, chartY + chartH, W - 60, chartH - 20);
                
                // Chart 3: Cost Analysis
                drawCostAnalysisChart(ctx, 30, chartY + chartH * 2, W - 60, chartH - 20);
            }

            function drawBatteryRangeChart(ctx, x, y, w, h) {
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Battery Level vs Predicted Range', x, y + 24);
                
                // Chart area
                const chartX = x + 10;
                const chartY = y + 40;
                const chartW = w - 20;
                const chartH = h - 50;
                
                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 5; i++) {
                    const yPos = chartY + (i / 5) * chartH;
                    ctx.beginPath();
                    ctx.moveTo(chartX, yPos);
                    ctx.lineTo(chartX + chartW, yPos);
                    ctx.stroke();
                }
                
                // Generate battery curve (historical + prediction)
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 3;
                ctx.beginPath();
                const points = 50;
                for (let i = 0; i <= points; i++) {
                    const t = i / points;
                    const battery = 100 - t * 85; // 100% down to 15%
                    const range = battery * 3.5; // ~350km at 100%
                    const px = chartX + t * chartW;
                    const py = chartY + chartH - (range / 350) * chartH;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                
                // Prediction zone (dashed)
                ctx.strokeStyle = '#ffaa00';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                const predStart = 0.7;
                for (let i = 0; i <= 15; i++) {
                    const t = predStart + (i / 15) * (1 - predStart);
                    const battery = 100 - t * 85;
                    const range = battery * 3.5 + Math.sin(i) * 15;
                    const px = chartX + t * chartW;
                    const py = chartY + chartH - (range / 350) * chartH;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Y-axis labels
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'right';
                for (let i = 0; i <= 5; i++) {
                    const range = (i / 5) * 350;
                    const yPos = chartY + chartH - (i / 5) * chartH;
                    ctx.fillText(`${range.toFixed(0)}km`, chartX - 5, yPos + 5);
                }
            }

            function drawChargingHistoryChart(ctx, x, y, w, h) {
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Last 10 Charging Sessions', x, y + 24);
                
                const chartX = x + 10;
                const chartY = y + 40;
                const chartW = w - 20;
                const chartH = h - 50;
                
                // Bars for last 10 sessions
                const numBars = 10;
                const barW = chartW / (numBars + 1);
                
                for (let i = 0; i < numBars; i++) {
                    const energy = 20 + Math.random() * 60; // 20-80 kWh
                    const barH = (energy / 80) * chartH;
                    const barX = chartX + (i + 0.5) * barW;
                    const barY = chartY + chartH - barH;
                    
                    // Gradient bar
                    const gradient = ctx.createLinearGradient(barX, barY, barX, barY + barH);
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#008855');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(barX, barY, barW * 0.7, barH);
                    
                    // Value label
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${energy.toFixed(0)}`, barX + barW * 0.35, barY - 5);
                }
                
                // Y-axis label
                ctx.save();
                ctx.translate(chartX - 30, chartY + chartH/2);
                ctx.rotate(-Math.PI/2);
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Energy (kWh)', 0, 0);
                ctx.restore();
            }

            function drawCostAnalysisChart(ctx, x, y, w, h) {
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Monthly Cost Breakdown', x, y + 24);
                
                const centerX = x + w / 3;
                const centerY = y + h / 2 + 20;
                const radius = Math.min(w, h) / 3;
                
                // Pie chart data
                const costs = [
                    { label: 'Charging', value: 120, color: '#00ff88' },
                    { label: 'Network Fee', value: 25, color: '#ffaa00' },
                    { label: 'Peak Hours', value: 45, color: '#ff6600' },
                    { label: 'Parking', value: 30, color: '#00ccff' }
                ];
                const total = costs.reduce((sum, c) => sum + c.value, 0);
                
                // Draw pie
                let startAngle = -Math.PI / 2;
                costs.forEach((cost, i) => {
                    const sliceAngle = (cost.value / total) * Math.PI * 2;
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                    ctx.closePath();
                    ctx.fillStyle = cost.color;
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    startAngle += sliceAngle;
                });
                
                // Legend
                const legendX = x + w * 0.6;
                const legendY = y + 60;
                ctx.textAlign = 'left';
                costs.forEach((cost, i) => {
                    const ly = legendY + i * 35;
                    
                    // Color box
                    ctx.fillStyle = cost.color;
                    ctx.fillRect(legendX, ly - 12, 20, 20);
                    
                    // Label
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '18px Arial';
                    ctx.fillText(`${cost.label}: £${cost.value}`, legendX + 30, ly + 5);
                });
                
                // Total
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(`Total: £${total}/month`, legendX, legendY + costs.length * 35 + 20);
            }

            function update2DChargerPanel() {
                if (!charger2DPanel || !isChargerModeActive) return;
                
                // Redraw with latest data
                const ctx = charger2DPanel.userData.ctx;
                const canvas = charger2DPanel.userData.canvas;
                draw2DChargerCharts(ctx, canvas.width, canvas.height);
                charger2DPanel.material.map.needsUpdate = true;
            }

            // ─── MAIN ANIMATION LOOP ──────────────────────────────────────────────────────
            function animate(timestamp, frame) {
                if (!frame) return;

                const session = renderer.xr.getSession();
                if (!session) return;

                // Get reference space
                if (!refSpace) {
                    refSpace = renderer.xr.getReferenceSpace();
                }
                if (!refSpace) return;

                // Floor detection
                if (!floorDetected) detectFloor(frame, refSpace);

                // Hit test setup (for Mode 5)
                if (!hitTestSourceRequested && floorDetected) {
                    session.requestReferenceSpace('viewer').then(vs => {
                        session.requestHitTestSource({ space: vs }).then(src => {
                            hitTestSource = src;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                // Update reticle (Mode 5)
                if (hitTestSource && anchorTrackingActive) {
                    const hitResults = frame.getHitTestResults(hitTestSource);
                    if (hitResults.length > 0) {
                        const hit = hitResults[0];
                        const pose = hit.getPose(refSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                } else if (!anchorTrackingActive) {
                    reticle.visible = false;
                }

                // Process controller inputs
                if (floorDetected && session.inputSources) {
                    session.inputSources.forEach((source) => {
                        const gamepad = source.gamepad;
                        if (!gamepad) return;

                        if (source.handedness === 'left') {
                            const leftTrigger = gamepad.buttons[0]?.pressed || false;
                            const xButton    = gamepad.buttons[4]?.pressed || false;
                            const axes = gamepad.axes;

                            // Panel click on trigger press
                            if (leftTrigger && !lastLeftTriggerPanel && controller0) {
                                checkControlPanelInteraction(controller0);
                            }
                            lastLeftTriggerPanel = leftTrigger;

                            // Mode 6: 3D Graph controls
                            if (controlMode === 6 && isChargerModeActive) {
                                // Left joystick (axes[2], axes[3]) - Rotate 3D graph
                                if (axes && axes.length >= 4) {
                                    const joyX = axes[2]; // Horizontal
                                    const joyY = axes[3]; // Vertical
                                    
                                    // Rotate graph with joystick
                                    if (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1) {
                                        charger3DRotation.y += joyX * 0.02;  // Yaw
                                        charger3DRotation.x += joyY * 0.02;  // Pitch
                                        // Clamp pitch to prevent flipping
                                        charger3DRotation.x = Math.max(-0.8, Math.min(0.8, charger3DRotation.x));
                                    }
                                }
                                
                                // Left trigger (squeeze) - Zoom
                                if (leftTrigger) {
                                    charger3DZoom = Math.min(2.0, charger3DZoom + 0.02); // Zoom in
                                } else if (gamepad.buttons[1]?.pressed) { // Left grip
                                    charger3DZoom = Math.max(0.5, charger3DZoom - 0.02); // Zoom out
                                }
                                
                                // X button - Reset view
                                if (xButton && !lastXButton) {
                                    charger3DRotation = { x: 0, y: 0 };
                                    charger3DZoom = 1.0;
                                    debugLog('Mode 6: 3D graph view reset', 'INFO');
                                }
                                
                                update3DChargerGraph();
                            }

                            // X button stops Mode 4 tracking
                            if (xButton && !lastXButton && isTrackingRobot) {
                                stopRobotTracking();
                            }
                            lastXButton = xButton;
                        }

                        if (source.handedness === 'right') {
                            const trigger    = gamepad.buttons[0]?.pressed || false;
                            const grip       = gamepad.buttons[1]?.pressed || false;
                            const thumbstick = gamepad.buttons[3]?.pressed || false;
                            const aButton    = gamepad.buttons[4]?.pressed || false;

                            if (controlMode === 2) {
                                // Draw trajectory
                                if (trigger && !isApproved && !isSent) {
                                    if (!isDrawing) isDrawing = true;
                                    // Find intersect point on floor plane
                                    if (controller1) {
                                        const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -floorY);
                                        const ray = new THREE.Raycaster();
                                        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller1.quaternion);
                                        ray.set(controller1.position, dir);
                                        const target = new THREE.Vector3();
                                        ray.ray.intersectPlane(floorPlane, target);
                                        if (target.lengthSq() > 0) addPoint(target);
                                    }
                                } else {
                                    isDrawing = false;
                                }
                                if (grip && !lastGrip && !isApproved) approve();
                                lastGrip = grip;
                                if (thumbstick && !lastThumbstick && !isApproved) deleteLast();
                                lastThumbstick = thumbstick;
                                if (aButton && !lastAButton && isApproved && !isSent) sendTrajectory();
                                lastAButton = aButton;
                            }

                            if (controlMode === 5) {
                                // Place anchor on right trigger press
                                if (trigger && !lastRightTrigger && anchorTrackingActive) {
                                    placeAnchorAtReticle();
                                }
                                lastRightTrigger = trigger;
                            }

                            if (controlMode === 6) {
                                // Select charger on right trigger press
                                if (trigger && !lastRightTrigger && controller1) {
                                    checkChargerSelection(controller1);
                                }
                                lastRightTrigger = trigger;
                            }
                        }

                        // Mode 4: Track left controller with Kalman
                        if (source.handedness === 'left' && isTrackingRobot && source.gripSpace) {
                            const gripPose = frame.getPose(source.gripSpace, refSpace);
                            if (gripPose) {
                                const pos = gripPose.transform.position;
                                const ori = gripPose.transform.orientation;

                                // Extract raw controller position (including Y for triangle marker)
                                const rawY = pos.y;
                                
                                // Heading from quaternion (yaw only)
                                const qx = ori.x, qy = ori.y, qz = ori.z, qw = ori.w;
                                const rawHeading = Math.atan2(2*(qw*qy + qx*qz), 1 - 2*(qy*qy + qz*qz));
                                const rawDeg = (rawHeading * 180 / Math.PI + 360) % 360;

                                // Kalman filter for SMOOTH robot tracking
                                const fx = kfX.update(pos.x);
                                const fz = kfZ.update(pos.z);
                                const filtHeading = kfH.update(rawDeg);

                                // Update triangle marker - SMOOTH filtered position at actual controller height
                                if (triangleMarker) {
                                    triangleMarker.position.set(fx, rawY, fz);  // Uses filtered XZ, raw Y (hand height)
                                    triangleMarker.rotation.y = filtHeading * Math.PI / 180;  // Filtered heading
                                }
                                
                                // Update green cone icon - filtered position, above robot
                                if (robotIcon) {
                                    robotIcon.position.set(fx, floorY + 0.20, fz);
                                    robotIcon.rotation.y = filtHeading * Math.PI / 180;
                                }
                                
                                // Update PROCEDURAL ROBOT - Kalman-filtered smooth tracking on floor
                                if (mode0Robot) {
                                    const wheelOffset = 0.04; // Keeps wheels on map
                                    mode0Robot.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    // Add 90° (π/2) to align controller forward axis with robot's front-to-back axis
                                    mode0Robot.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                }

                                const dist_cm = Math.sqrt((fx - userX)**2 + (fz - userZ)**2) / MAP_SIZE * 200;
                                updateRobotChart(performance.now() / 1000, dist_cm, filtHeading);
                            }
                        }
                    });
                }

                // Rotate chart axes slowly for visibility
                if (chart3DAxes) chart3DAxes.rotation.y += 0.002;

                // Animate charger markers (Mode 6)
                if (isChargerModeActive) {
                    animateChargerMarkers(timestamp);
                }

                renderer.render(scene, camera);
            }

            init();
        </script>
    </body>
</html>
