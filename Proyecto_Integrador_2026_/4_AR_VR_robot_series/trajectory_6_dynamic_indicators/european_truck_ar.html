// ══════════════════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════════════════
const TRUCK_CONFIG = {
  length: 1.50,
  height: 0.84,
  width:  0.65,
  scale:  1.0,   // runtime adjustable
};

// ══════════════════════════════════════════════════════════════════════════════
// GLOBALS
// ══════════════════════════════════════════════════════════════════════════════
let scene, camera, renderer;
let truckGroup  = null;
let floorY      = null;
let floorDetected = false;
let hitTestSource = null;
let hitTestSourceRequested = false;
let arStarted   = false;
let truckPlaced = false;

// Gesture state
let prevPinchDist  = null;
let prevTouchAngle = null;
let currentScale   = 1.0;
let currentRotY    = 0.0;

// ══════════════════════════════════════════════════════════════════════════════
// BASE64 → ArrayBuffer helper
// ══════════════════════════════════════════════════════════════════════════════
function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

// ══════════════════════════════════════════════════════════════════════════════
// LOAD TRUCK FROM EMBEDDED GLB
// ══════════════════════════════════════════════════════════════════════════════
function loadTruck() {
  return new Promise((resolve) => {
    document.getElementById('s-model').textContent = 'parsing…';

    const arrayBuffer = b64ToArrayBuffer(TRUCK_GLB_B64);
    const loader = new GLTFLoader();

    loader.parse(arrayBuffer, '', (gltf) => {
      const model = gltf.scene;

      // Apply real-world materials over vertex colours
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow    = true;
          child.receiveShadow = true;

          // Detect cab vs trailer by world-space X position
          const worldPos = new THREE.Vector3();
          child.getWorldPosition(worldPos);

          const cabMat = new THREE.MeshStandardMaterial({
            color: 0xC85020,    // deep orange cab
            roughness: 0.35,
            metalness: 0.20,
          });
          const trailerMat = new THREE.MeshStandardMaterial({
            color: 0xD0D0D8,    // silver grey trailer
            roughness: 0.40,
            metalness: 0.30,
          });
          const undercarriageMat = new THREE.MeshStandardMaterial({
            color: 0x1A1A1A,
            roughness: 0.80,
            metalness: 0.10,
          });

          // Apply based on vertex positions
          const pos = child.geometry.attributes.position;
          const colors = child.geometry.attributes.color;
          if (colors) {
            // Use existing vertex colours as hint
            const r = colors.getX(0);
            if (r > 0.6) {          // orange ≈ r>0.6, g<0.4
              child.material = cabMat;
            } else if (r > 0.7) {   // grey ≈ r≈g≈b ≈ 0.8
              child.material = trailerMat;
            } else {
              child.material = trailerMat;
            }
          } else {
            child.material = trailerMat;
          }
        }
      });

      // Wrap in a group for placement + gesture control
      truckGroup = new THREE.Group();
      truckGroup.name = 'TruckRoot';
      truckGroup.add(model);
      truckGroup.visible = false;
      scene.add(truckGroup);

      document.getElementById('s-model').textContent = 'ready ✓';
      document.getElementById('s-model').className   = 'ok';
      console.log('✓ Truck GLB loaded from embedded base64');
      resolve(truckGroup);

    }, (err) => {
      console.error('GLB parse error:', err);
      document.getElementById('s-model').textContent = 'ERROR';
      document.getElementById('s-model').className   = 'bad';
      // Fallback: build a box placeholder
      truckGroup = buildFallbackTruck();
      scene.add(truckGroup);
      resolve(truckGroup);
    });
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// FALLBACK — simple box truck if GLB fails
// ══════════════════════════════════════════════════════════════════════════════
function buildFallbackTruck() {
  const g = new THREE.Group();
  const cab = new THREE.Mesh(
    new THREE.BoxGeometry(0.40, 0.70, 0.60),
    new THREE.MeshStandardMaterial({ color: 0xC85020, roughness: 0.4 })
  );
  cab.position.set(-0.55, 0.35, 0);
  const trailer = new THREE.Mesh(
    new THREE.BoxGeometry(1.00, 0.65, 0.60),
    new THREE.MeshStandardMaterial({ color: 0xD0D0D8, roughness: 0.5 })
  );
  trailer.position.set(0.25, 0.32, 0);
  g.add(cab); g.add(trailer);
  g.visible = false;
  return g;
}

// ══════════════════════════════════════════════════════════════════════════════
// PLACE TRUCK ON DETECTED FLOOR
// ══════════════════════════════════════════════════════════════════════════════
function placeTruck(x, y, z) {
  if (!truckGroup) return;

  truckGroup.position.set(x, y, z);
  truckGroup.rotation.y = currentRotY;
  truckGroup.scale.setScalar(currentScale);
  truckGroup.visible = true;
  truckPlaced = true;

  document.getElementById('s-floor').textContent = `Y=${y.toFixed(2)}m ✓`;
  document.getElementById('s-floor').className   = 'ok';
  document.getElementById('scale-hint').style.display = 'block';
  console.log('✓ Truck placed at', x.toFixed(3), y.toFixed(3), z.toFixed(3));
}

// ══════════════════════════════════════════════════════════════════════════════
// SHADOW DISC
// ══════════════════════════════════════════════════════════════════════════════
function addShadowDisc() {
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(1.2, 48),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = 0.001;
  truckGroup.add(disc);
}

// ══════════════════════════════════════════════════════════════════════════════
// INIT SCENE
// ══════════════════════════════════════════════════════════════════════════════
function init() {
  scene    = new THREE.Scene();
  camera   = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 100);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled    = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Lighting
  const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
  sun.position.set(4, 8, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xd0e8ff, 0.7);
  fill.position.set(-3, 3, -3);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x606080, 0.8));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x333355, 0.6));

  // AR button (hidden, triggered by our custom button)
  const arBtn = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.body }
  });
  arBtn.style.display = 'none';
  document.body.appendChild(arBtn);

  // Load truck model
  loadTruck().then(addShadowDisc);

  // Gesture listeners
  renderer.domElement.addEventListener('touchstart',  onTouchStart,  { passive: false });
  renderer.domElement.addEventListener('touchmove',   onTouchMove,   { passive: false });
  renderer.domElement.addEventListener('touchend',    onTouchEnd,    { passive: false });

  renderer.setAnimationLoop(render);
  console.log('✓ Scene initialised');
}

// ══════════════════════════════════════════════════════════════════════════════
// GESTURE — tap to place, pinch to scale, two-finger rotate
// ══════════════════════════════════════════════════════════════════════════════
function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 1 && !truckPlaced && floorDetected) {
    // Single tap → place truck
    if (truckGroup && floorY !== null) {
      placeTruck(0, floorY, 0);
    }
  }
  if (e.touches.length === 2) {
    prevPinchDist  = getTouchDist(e.touches);
    prevTouchAngle = getTouchAngle(e.touches);
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 2 && truckGroup && truckPlaced) {
    const dist  = getTouchDist(e.touches);
    const angle = getTouchAngle(e.touches);

    if (prevPinchDist !== null) {
      currentScale *= dist / prevPinchDist;
      currentScale  = Math.max(0.1, Math.min(5.0, currentScale));
      truckGroup.scale.setScalar(currentScale);
    }
    if (prevTouchAngle !== null) {
      currentRotY += angle - prevTouchAngle;
      truckGroup.rotation.y = currentRotY;
    }
    prevPinchDist  = dist;
    prevTouchAngle = angle;
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  if (e.touches.length < 2) {
    prevPinchDist  = null;
    prevTouchAngle = null;
  }
}

function getTouchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

function getTouchAngle(touches) {
  return Math.atan2(
    touches[1].clientY - touches[0].clientY,
    touches[1].clientX - touches[0].clientX
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// XR FLOOR HIT-TEST + RENDER LOOP
// ══════════════════════════════════════════════════════════════════════════════
function onXRSessionStart(session) {
  session.addEventListener('end', onXRSessionEnd);
  document.getElementById('s-ar').textContent = 'Active ✓';
  document.getElementById('s-ar').className   = 'ok';
  document.getElementById('hud-corners').style.display = 'block';
}

function onXRSessionEnd() {
  hitTestSourceRequested = false;
  hitTestSource = null;
  truckPlaced = false;
  document.getElementById('s-ar').textContent   = 'Inactive';
  document.getElementById('s-ar').className     = 'warn';
  document.getElementById('hud-corners').style.display = 'none';
  document.getElementById('scale-hint').style.display  = 'none';
}

function render(timestamp, frame) {
  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    const session  = renderer.xr.getSession();

    // Request hit-test source once
    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(vs => {
        session.requestHitTestSource({ space: vs }).then(src => {
          hitTestSource = src;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    // Floor detection
    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);
        floorY = pose.transform.position.y;
        if (!floorDetected) {
          floorDetected = true;
          document.getElementById('s-floor').textContent = `Y=${floorY.toFixed(2)}m — tap to place`;
          document.getElementById('s-floor').className   = 'ok';
          // Auto-place on first detection
          if (truckGroup && !truckPlaced) {
            placeTruck(0, floorY, -0.8);
          }
        }
      }
    }
  }

  renderer.render(scene, camera);
}

// ══════════════════════════════════════════════════════════════════════════════
// START AR
// ══════════════════════════════════════════════════════════════════════════════
window.startAR = function() {
  const btn = document.getElementById('start-btn');
  btn.disabled   = true;
  btn.textContent = 'STARTING…';
  if (!arStarted) {
    arStarted = true;
    const arButton = document.querySelector('.ar-button');
    if (arButton) {
      arButton.click();
      btn.style.display = 'none';
    }
  }
};

// ══════════════════════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════════════════════
init();

if (navigator.xr) {
  renderer.xr.addEventListener('sessionstart', onXRSessionStart);
  renderer.xr.addEventListener('sessionend',   onXRSessionEnd);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
