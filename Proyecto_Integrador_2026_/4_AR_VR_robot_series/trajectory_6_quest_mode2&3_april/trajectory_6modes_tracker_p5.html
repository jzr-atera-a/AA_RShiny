            function checkMode1LeftPanelClick(uv) {
                if (!mode1LeftPanel) return;
                const buttons = mode1LeftPanel.userData.buttons;
                const uvY = 1.0 - uv.y;
                const y = uvY * 600;
                
                buttons.forEach(btn => {
                    if (y >= btn.y && y <= btn.y + 70) {
                        debugLog(`Mode 1: Button ${btn.action}`, 'INFO');
                        
                        if (btn.action === 'start') {
                            mode1TrackingActive = true;
                            mode1PathData = [];
                            debugLog('Mode 1: Tracking STARTED', 'INFO');
                        } else if (btn.action === 'stop') {
                            mode1TrackingActive = false;
                            debugLog('Mode 1: Tracking STOPPED', 'INFO');
                        } else if (btn.action === 'analyze') {
                            sendMode1AnalysisToServer();
                        }
                    }
                });
            }
            
            function createMode1Grid() {
                if (mode1GridPlane) return;
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 2048, 2048);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                const gridSize = 21;
                const cellSize = 2048 / gridSize;
                
                for (let i = 0; i <= gridSize; i++) {
                    const x = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, 2048);
                    ctx.stroke();
                }
                
                for (let i = 0; i <= gridSize; i++) {
                    const y = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(2048, y);
                    ctx.stroke();
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                const geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
                const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                mode1GridPlane = new THREE.Mesh(geo, mat);
                mode1GridPlane.rotation.x = -Math.PI / 2;
                mode1GridPlane.position.set(userX, floorY + 0.002, userZ);
                scene.add(mode1GridPlane);
            }
            
            function removeMode1Grid() {
                if (mode1GridPlane) {
                    scene.remove(mode1GridPlane);
                    mode1GridPlane = null;
                }
                if (mode1MarkersGroup) {
                    scene.remove(mode1MarkersGroup);
                    mode1MarkersGroup = null;
                }
                mode1Markers = [];
            }
            
            function updateMode1Path(pos, heading, linear, angular) {
                if (!mode1TrackingActive) return;
                
                const gridX = Math.floor((pos.x - (userX - MAP_SIZE/2)) / 0.1);
                const gridZ = Math.floor((pos.z - (userZ - MAP_SIZE/2)) / 0.1);
                
                const dataPoint = {
                    position: pos.clone(),
                    heading: heading,
                    linear: linear,
                    angular: angular,
                    gridX: gridX,
                    gridZ: gridZ,
                    timestamp: performance.now()
                };
                
                mode1PathData.push(dataPoint);
                
                // Update orange line
                if (mode1PathLine) scene.remove(mode1PathLine);
                if (mode1PathData.length >= 2) {
                    const points = mode1PathData.map(d => new THREE.Vector3(d.position.x, floorY + 0.003, d.position.z));
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    mode1PathLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xff8800, linewidth: 3 }));
                    scene.add(mode1PathLine);
                }
                
                // Add markers every 20cm
                if (!mode1MarkersGroup) {
                    mode1MarkersGroup = new THREE.Group();
                    scene.add(mode1MarkersGroup);
                }
                
                let totalDist = 0;
                for (let i = 1; i < mode1PathData.length; i++) {
                    totalDist += mode1PathData[i].position.distanceTo(mode1PathData[i-1].position);
                }
                
                const lastMarkerDist = mode1Markers.length > 0 ? mode1Markers[mode1Markers.length - 1].distance : -1;
                if (mode1Markers.length === 0 || totalDist >= lastMarkerDist + 0.20) {
                    const markerGeo = new THREE.RingGeometry(0.018, 0.020, 32);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0xff8800, side: THREE.DoubleSide });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    marker.rotation.x = -Math.PI / 2;
                    marker.position.set(pos.x, floorY + 0.004, pos.z);
                    mode1MarkersGroup.add(marker);
                    mode1Markers.push({ distance: totalDist, index: mode1Markers.length });
                }
            }
            
            function sendMode1AnalysisToServer() {
                if (mode1PathData.length < 2) {
                    debugLog('Mode 1: Not enough data for analysis', 'ERROR');
                    return;
                }
                
                const analysis = {
                    mode: 1,
                    grid_size: '21x21 (10cm cells)',
                    map_size: MAP_SIZE,
                    total_points: mode1PathData.length,
                    data: mode1PathData.map(d => ({
                        grid_x: d.gridX,
                        grid_z: d.gridZ,
                        world_x: d.position.x.toFixed(3),
                        world_z: d.position.z.toFixed(3),
                        heading_deg: (d.heading * 180 / Math.PI).toFixed(1),
                        motor_linear: d.linear.toFixed(3),
                        motor_angular: d.angular.toFixed(3),
                        timestamp: d.timestamp.toFixed(0)
                    })),
                    markers: mode1Markers.length
                };
                
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        command: 'SAVE_MODE1_ANALYSIS',
                        analysis: analysis,
                        filename: `mode1_analysis_${Date.now()}.txt`
                    }));
                    debugLog('Mode 1: Analysis sent to server', 'INFO');
                } else {
                    debugLog('Mode 1: WebSocket not connected', 'ERROR');
                }
            }

            // ─── MODE 1: MANUAL CONTROL ──────────────────────────────────────────────────
            function startManualControl() {
                if (isManualControlActive) return;
                isManualControlActive = true;
                mode1LeftTracking = true;  // ENABLED for ground test with tracking
                mode1TrackingActive = true;  // AUTO-ENABLE path drawing
                mode1PathData = [];  // Clear previous path data
                
                debugLog('Mode 1: Manual control started (left tracking + path drawing ENABLED)', 'INFO');
                
                // Create left controller marker (small green sphere at controller position)
                const geo = new THREE.SphereGeometry(0.05, 16, 16);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                mode1LeftMarker = new THREE.Mesh(geo, mat);
                scene.add(mode1LeftMarker);
                
                // Start sending commands at 2Hz (reduced from 5Hz for stability)
                manualControlInterval = setInterval(() => {
                    sendManualControlCommand();
                }, 500); // 2Hz = 500ms (was 200ms = 5Hz)
                
                document.getElementById('tracking-status').textContent = 'MANUAL';
                document.getElementById('tracking-status').className = 'status-tracking';
            }

            function stopManualControl() {
                isManualControlActive = false;
                mode1LeftTracking = false;
                mode1TrackingActive = false;  // Disable path drawing
                
                // Stop motors immediately
                sendStopCommand();
                
                // Clear interval
                if (manualControlInterval) {
                    clearInterval(manualControlInterval);
                    manualControlInterval = null;
                }
                
                // Remove marker
                if (mode1LeftMarker) {
                    scene.remove(mode1LeftMarker);
                    mode1LeftMarker = null;
                }
                
                // Clear path line and markers
                if (mode1PathLine) {
                    scene.remove(mode1PathLine);
                    mode1PathLine = null;
                }
                if (mode1MarkersGroup) {
                    scene.remove(mode1MarkersGroup);
                    mode1MarkersGroup = null;
                }
                mode1Markers = [];
                
                document.getElementById('tracking-status').textContent = 'OFF';
                document.getElementById('tracking-status').className = 'status-bad';
                
                debugLog('Mode 1: Manual control stopped', 'INFO');
            }

            function sendManualControlCommand() {
                if (!isManualControlActive || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                
                // Calculate base motor speed from joystick
                const baseSpeed = Math.round(lastMotorSpeed);
                const servo1Angle = Math.round(lastServo1);
                const servo2Angle = Math.round(lastServo2);
                
                // DIFFERENTIAL DRIVE LOGIC - Ackermann Geometry Based
                let motor1Speed = baseSpeed;  // M1 = RIGHT motor
                let motor2Speed = baseSpeed;  // M2 = LEFT motor
                
                // Vehicle geometry (cm)
                const WHEELBASE = 34;      // Front to rear wheel distance
                const TRACK_WIDTH = 29;    // Left to right wheel center distance
                
                // Trigger thresholds
                const SPEED_THRESHOLD = 55;        // Apply differential only above 55%
                const MIN_STEERING_ANGLE = 10;     // Minimum 10° turn to trigger
                
                // Servo to steering angle mapping (linear approximation)
                // Servo 90° = 0° steering
                // Servo 130° = 30° left (inner wheel angle)
                // Servo 50° = 30° right (inner wheel angle)
                const servoToAngle = (servo) => {
                    // Map servo range to steering angle
                    // 90 → 0°, 130 → 30°, 50 → -30°
                    return (servo - 90) * (30 / 40);  // 40° servo range = 30° wheel angle
                };
                
                const steeringAngle = servoToAngle(servo2Angle);  // Positive = left, negative = right
                
                if (baseSpeed >= SPEED_THRESHOLD && Math.abs(steeringAngle) >= MIN_STEERING_ANGLE) {
                    // Calculate turn radius from Ackermann geometry
                    const innerAngleDeg = Math.abs(steeringAngle);
                    const innerAngleRad = innerAngleDeg * Math.PI / 180;
                    
                    // Turn radius from vehicle center
                    const turnRadius = WHEELBASE / Math.tan(innerAngleRad);
                    
                    // Inner and outer wheel radii
                    const innerRadius = turnRadius - (TRACK_WIDTH / 2);
                    const outerRadius = turnRadius + (TRACK_WIDTH / 2);
                    
                    // Speed ratio (outer/inner)
                    const speedRatio = outerRadius / innerRadius;
                    
                    // Calculate differential percentage using selected mode
                    // differentialMode: 0.25 = 25%, 0.50 = 50%, 0.75 = 75%
                    const fullDifferential = ((speedRatio - 1) / 2) * 100;  // Convert to percentage
                    const differentialMode = window.differentialMode || 0.25;  // Default 0.25
                    const differential = fullDifferential * differentialMode;
                    
                    if (steeringAngle > 0) {
                        // TURNING LEFT (servo > 90): M1 outer (faster), M2 inner (slower)
                        motor1Speed = baseSpeed + differential;
                        motor2Speed = baseSpeed - differential;
                    } else {
                        // TURNING RIGHT (servo < 90): M1 inner (slower), M2 outer (faster)
                        motor1Speed = baseSpeed - differential;
                        motor2Speed = baseSpeed + differential;
                    }
                    
                    // Clamp to valid ranges (0 or 50-80)
                    motor1Speed = Math.round(Math.max(0, Math.min(80, motor1Speed)));
                    motor2Speed = Math.round(Math.max(0, Math.min(80, motor2Speed)));
                    
                    // Ensure motors stay in valid range (0 or 50-80)
                    if (motor1Speed > 0 && motor1Speed < 50) motor1Speed = 50;
                    if (motor2Speed > 0 && motor2Speed < 50) motor2Speed = 50;
                    
                    // If one motor gets clamped, adjust the other to maintain ratio
                    if (motor1Speed === 50 && baseSpeed - differential < 50) {
                        // Inner motor hit minimum, reduce outer proportionally
                        const actualDifferential = baseSpeed - 50;
                        if (steeringAngle > 0) {
                            motor2Speed = 50;
                            motor1Speed = Math.min(80, 50 + actualDifferential * 2);
                        } else {
                            motor1Speed = 50;
                            motor2Speed = Math.min(80, 50 + actualDifferential * 2);
                        }
                    }
                }
                
                // Get left controller position and orientation (if tracking enabled)
                let leftX_cm = 0, leftY_cm = 0, leftZ_cm = 0;
                let controllerHeading_deg = 0, travelHeading_deg = 0, finalHeading_deg = 0;
                
                if (mode1LeftMarker && mode1LeftTracking) {
                    // Read filtered position from marker (already filtered by Kalman in animation loop)
                    const leftX = mode1LeftMarker.position.x;
                    const leftY = mode1LeftMarker.position.y;
                    const leftZ = mode1LeftMarker.position.z;
                    const leftHeading_rad = mode1LeftMarker.rotation.y;
                    
                    // Convert to cm relative to map center
                    leftX_cm = ((leftX - userX) / MAP_SIZE * 200);
                    leftZ_cm = ((leftZ - userZ) / MAP_SIZE * 200);
                    leftY_cm = (leftY - floorY) * 100; // cm above floor
                    
                    // Get all three headings for analysis
                    controllerHeading_deg = window.mode1ControllerHeading || 0;
                    travelHeading_deg = window.mode1TravelHeading || controllerHeading_deg;
                    finalHeading_deg = window.mode1FinalHeading || 0;
                }
                
                // Send COMBINED command with differential speeds AND position data
                const timestamp = performance.now() / 1000;
                websocket.send(`TRACK:${timestamp.toFixed(3)}:${leftX_cm.toFixed(1)}:${leftY_cm.toFixed(1)}:${leftZ_cm.toFixed(1)}:${controllerHeading_deg.toFixed(1)}:${travelHeading_deg.toFixed(1)}:${finalHeading_deg.toFixed(1)}:M1:${motor1Speed}:M2:${motor2Speed}:S1:${servo1Angle}:S2:${servo2Angle}`);
                
                // STORE Mode 1 position/heading for Mode 2 option (if robot is moving)
                if (baseSpeed > 0 && mode0Robot && mode0Robot.visible) {
                    mode1LastPosition = {
                        x: mode0Robot.position.x,
                        y: mode0Robot.position.y,
                        z: mode0Robot.position.z
                    };
                    mode1LastHeading = mode0Robot.rotation.y;  // radians
                    mode1WasUsed = true;  // Enable Mode 1 option in Mode 2 UI
                }
                
                // Debug log occasionally (every 5 seconds) - show steering angle and differential
                if (Math.random() < 0.1) {
                    const diff = Math.abs(motor1Speed - motor2Speed);
                    if (mode1LeftTracking) {
                        debugLog(`Mode 1: Pos(${leftX_cm.toFixed(0)},${leftZ_cm.toFixed(0)}) TrvHd:${travelHeading_deg.toFixed(0)}° M1:${motor1Speed} M2:${motor2Speed}`, 'INFO');
                    } else {
                        debugLog(`Mode 1: M1:${motor1Speed} M2:${motor2Speed} (Δ${diff}%) Steer:${Math.round(servoToAngle(servo2Angle))}°`, 'INFO');
                    }
                }
            }

            function sendStopCommand() {
                lastJoystickForward = 0;
                lastJoystickTurn = 0;
                lastMotorSpeed = 0;
                lastServo2 = 90;  // Center steering
                lastServo1 = 90;  // Center gripper
                
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send('ALL:M1:0:M2:0:S1:90:S2:90');
                    debugLog('Mode 1: STOP command sent', 'INFO');
                }
            }

            function processJoystickInput(forwardAxis, turnAxis) {
                // Dead zone (15%)
                const DEAD_ZONE = 0.15;
                
                // Apply dead zone
                const forward = Math.abs(forwardAxis) > DEAD_ZONE ? forwardAxis : 0;
                const turn = Math.abs(turnAxis) > DEAD_ZONE ? turnAxis : 0;
                
                lastJoystickForward = forward;
                lastJoystickTurn = turn;
                
                // Map forward to motor speed: 0 or 50-80% (Arduino requirement)
                // ONLY ACCEPT POSITIVE (FORWARD) VALUES - ignore backward joystick
                if (forward > 0) {
                    // Scale: 0.0-1.0 input → 50-80% output
                    lastMotorSpeed = 50 + (forward * 30);  // 50 + (0-30) = 50-80
                } else {
                    lastMotorSpeed = 0;  // Stop (backward ignored, centered = stop)
                }
                
                // Map turn (-1 to +1) to servo2 angle (50° to 130°)
                // MAX STEERING when joystick is 75%+ to either side
                if (turn <= -0.75) {
                    // FULL LEFT
                    lastServo2 = 130;  // MAX left turn
                } else if (turn >= 0.75) {
                    // FULL RIGHT
                    lastServo2 = 50;   // MAX right turn
                } else {
                    // Normal steering mapping
                    // -1 = full left → 130° (LEFT turn)
                    //  0 = straight → 90° (STRAIGHT)
                    // +1 = full right → 50° (RIGHT turn)
                    lastServo2 = 90 - (turn * 40);  // NEGATED to fix inversion
                    lastServo2 = Math.max(50, Math.min(130, lastServo2)); // Clamp to range
                }
            }

            function processGripperButtons(aPressed, bPressed) {
                // A button: open gripper (40°)
                // B button: close gripper (140°)
                
                if (aPressed) {
                    lastServo1 = 40;  // Open
                    debugLog('Gripper: OPEN (40°)', 'INFO');
                } else if (bPressed) {
                    lastServo1 = 140;  // Close
                    debugLog('Gripper: CLOSE (140°)', 'INFO');
                }
            }

            // ─── MODE 2: LEFT PANEL (TRAJECTORY CONTROLS) ────────────────────────────────
            let mode2LeftPanel = null;
            let mode2ControllerPath = [];  // Orange path from left controller
            let mode2ControllerLine = null;
            let mode2TrackingActive = false;
            let mode2GridPlane = null;  // White grid background
            let mode2UserMarkers = [];  // Green markers for user path
            let mode2ControllerMarkers = [];  // Orange markers for controller path
            let mode2UserMarkersGroup = null;  // THREE.Group for user markers
            let mode2SmoothedPathLine = null;  // GREEN smoothed path visualization
            let mode2ControllerMarkersGroup = null;  // THREE.Group for controller markers
            
            // ─── MODE 3: LEFT PANEL (M25 CONTROLS) ───────────────────────────────────────
            let mode3LeftPanel = null;
            let mode3Mode = 'real';  // 'real' or 'virtual'
            let mode3ControllerPath = [];  // Orange path
            let mode3ControllerLine = null;
            let mode3TrackingActive = false;
            let mode3SimulationActive = false;
            let mode3SimulationInterval = null;
            let mode3SimulationProgress = 0;  // 0-1 along M25
            
            // ─── MODE 2: TRAJECTORY ───────────────────────────────────────────────────────
            function addPoint(point) {
                if (isApproved || isSent) return;
                trajectoryPoints.push(point.clone());
                if (trajectoryPoints.length > 1) {
                    const last = trajectoryPoints[trajectoryPoints.length - 2];
                    totalDistance += point.distanceTo(last);
                }
                document.getElementById('point-count').textContent = trajectoryPoints.length;
                document.getElementById('path-distance').textContent = totalDistance.toFixed(2);
                updateTrajectoryLine();
            }

            function updateTrajectoryLine() {
                if (trajectoryLine) { scene.remove(trajectoryLine); trajectoryLine = null; }
                if (trajectoryPoints.length < 2) return;
                
                // Adjust all points to be ABOVE the grid
                const adjustedPoints = trajectoryPoints.map(p => new THREE.Vector3(p.x, floorY + 0.003, p.z));
                
                const geo = new THREE.BufferGeometry().setFromPoints(adjustedPoints);
                trajectoryLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 })); // RED - User drawn path
                scene.add(trajectoryLine);
                
                // No markers on drawn (red) path - markers go on green smoothed path only
            }

            function approve() {
                isApproved = true;
                document.getElementById('trajectory-status').textContent = 'APPROVED';
                document.getElementById('trajectory-status').className = 'status-approved';
                
                // Path locked - waypoints placed on green smoothed path after SMOOTH
            }

            function deleteLast() {
                if (trajectoryPoints.length > 0) {
                    trajectoryPoints.pop();
                    document.getElementById('point-count').textContent = trajectoryPoints.length;
                    updateTrajectoryLine();
                }
            }

            // ─── MODE 2: AUTONOMOUS PATH FOLLOWING ───────────────────────────────────────
            
            // FIX BUG 1: Downsample path to prevent 1200Hz command flooding
            function downsamplePath(points, stepMeters = 0.05) {
                if (points.length === 0) return [];
                
                const result = [points[0]];
                let accumulated = 0;
                
                for (let i = 1; i < points.length; i++) {
                    const dist = points[i].distanceTo(points[i - 1]);
                    accumulated += dist;
                    
                    if (accumulated >= stepMeters) {
                        result.push(points[i]);
                        accumulated = 0;
                    }
                }
                
                // Always include the final point
                const last = points[points.length - 1];
                if (result[result.length - 1] !== last) {
                    result.push(last);
                }
                
                return result;
            }
            
            function sendTrajectory() {
                if (!websocket || !isApproved || trajectoryPoints.length < 5) {
                    debugLog('Mode 2: Cannot send - not ready', 'ERROR');
                    debugLog(`  WebSocket: ${websocket ? 'Connected' : 'Not connected'}`, 'ERROR');
                    debugLog(`  Approved: ${isApproved}`, 'ERROR');
                    debugLog(`  Points: ${trajectoryPoints.length}`, 'ERROR');
                    return;
                }
                
                if (websocket.readyState !== WebSocket.OPEN) {
                    debugLog('Mode 2: WebSocket not open! State: ' + websocket.readyState, 'ERROR');
                    return;
                }
                
                // RACE CONDITION GUARD: mode2LiveX is populated by the XR frame loop only
                // after mode2TrackingActive=true has been set (on APPROVE). If the user presses
                // execute on the very same frame as approve, it may still be undefined.
                // Wait up to 10 frames (167ms) for it to be populated before starting.
                if (window.mode2LiveX === undefined) {
                    debugLog('Mode 2: Waiting for position tracking to initialise...', 'WARN');
                    let retries = 0;
                    const waitForTracking = setInterval(() => {
                        retries++;
                        if (window.mode2LiveX !== undefined) {
                            clearInterval(waitForTracking);
                            debugLog(`Mode 2: Position tracking ready after ${retries} frame(s). Proceeding.`, 'INFO');
                            sendTrajectory();  // retry now that position is available
                        } else if (retries >= 20) {  // ~330ms timeout
                            clearInterval(waitForTracking);
                            debugLog('Mode 2: ABORT - position tracking never became available. Is left controller tracked?', 'ERROR');
                            isSent = false;
                            document.getElementById('trajectory-status').textContent = 'ERROR: NO POSITION';
                        }
                    }, 16);  // ~1 frame at 60fps
                    return;
                }
                
                // FIX BUG 1: Downsample trajectory (if not already done in approve())
                if (!mode2DownsampledPath || mode2DownsampledPath.length === 0) {
                    debugLog('Mode 2: ERROR - Smooth the path first before sending!', 'ERROR');
                    return;
                }
                
                // CRITICAL DEBUG: Log first and last waypoints
                debugLog(`Mode 2: Path start: (${mode2DownsampledPath[0].x.toFixed(3)}, ${mode2DownsampledPath[0].z.toFixed(3)}) m`, 'INFO');
                debugLog(`Mode 2: Path end: (${mode2DownsampledPath[mode2DownsampledPath.length-1].x.toFixed(3)}, ${mode2DownsampledPath[mode2DownsampledPath.length-1].z.toFixed(3)}) m`, 'INFO');
                debugLog(`Mode 2: Current live position: (${(window.mode2LiveX || 0).toFixed(3)}, ${(window.mode2LiveZ || 0).toFixed(3)}) m`, 'INFO');
                
                // Send planned path to server for tracking analysis
                try {
                    const waypoints = mode2DownsampledPath.map((p, i) => {
                        // Calculate heading for each waypoint
                        let heading = 0;
                        if (i < mode2DownsampledPath.length - 1) {
                            const next = mode2DownsampledPath[i + 1];
                            const dx = next.x - p.x;
                            const dz = next.z - p.z;
                            heading = (Math.atan2(dx, dz) * 180 / Math.PI + 360) % 360;
                        } else if (i > 0) {
                            // Last point uses previous heading
                            const prev = mode2DownsampledPath[i - 1];
                            const dx = p.x - prev.x;
                            const dz = p.z - prev.z;
                            heading = (Math.atan2(dx, dz) * 180 / Math.PI + 360) % 360;
                        }
                        return [p.x, p.z, heading];
                    });
                    
                    const pathData = {
                        waypoints: waypoints,
                        differential: window.differentialMode || 0.25
                    };
                    
                    const pathMessage = `MODE2_PATH:${JSON.stringify(pathData)}`;
                    debugLog(`Mode 2: Sending path to server (${pathMessage.length} chars)`, 'INFO');
                    debugLog(`Mode 2: First waypoint heading: ${waypoints[0][2].toFixed(1)}°`, 'INFO');
                    
                    websocket.send(pathMessage);
                    debugLog(`Mode 2: ✓ PATH SENT TO SERVER`, 'INFO');
                    
                } catch (error) {
                    debugLog(`Mode 2: ERROR sending path to server: ${error.message}`, 'ERROR');
                    console.error('Mode 2 path send error:', error);
                    return;
                }
                
                // Determine which path to follow: GREEN smoothed or RED original
                if (mode2SmoothedPath && mode2SmoothedPath.length >= 3) {
                    mode2PathToFollow = mode2SmoothedPath;
                    debugLog(`Mode 2: Using GREEN smoothed path (${mode2SmoothedPath.length} waypoints)`, 'INFO');
                } else {
                    mode2PathToFollow = mode2DownsampledPath;
                    debugLog(`Mode 2: Using RED original path (${mode2DownsampledPath.length} waypoints)`, 'INFO');
                }
                
                // Generate motor commands from path to follow
                mode2PathCommands = generatePathCommands(mode2PathToFollow);
                
                if (mode2PathCommands.length === 0) {
                    debugLog('Mode 2: No commands generated from path', 'ERROR');
                    return;
                }
                
                debugLog(`Mode 2: Generated ${mode2PathCommands.length} commands from ${mode2PathToFollow.length} waypoints`, 'INFO');
                
                // Start autonomous following
                startMode2Following();
                
                isSent = true;
                document.getElementById('trajectory-status').textContent = 'FOLLOWING';
                document.getElementById('trajectory-status').className = 'status-tracking';
            }
            
            // ═══════════════════════════════════════════════════════════════════════════════
            // MODE 2: PATH SMOOTHING ALGORITHM (Respects 75cm turning radius)
            // ═══════════════════════════════════════════════════════════════════════════════
            
            function smoothPathWithTurningRadius(rawPath) {
                // ── Dubins path planner, R = 0.75m, forward-only arcs ────────────────
                // Converts hand-drawn zigzag into smooth LSL/RSR/LSR/RSL/RLR/LRL arcs.
                // Uses standard 2D convention: angle from +x CCW; our ground plane is (x,z).

                const R       = mode2TurningRadius;
                const STEP    = 0.05;   // 5 cm dense output sampling
                const MIN_SEP = 0.30;   // collapse waypoints closer than 30 cm

                if (!rawPath || rawPath.length < 2) {
                    debugLog('Mode 2: Path too short for Dubins', 'WARN');
                    return rawPath ? rawPath.map(p => p.clone()) : [];
                }

                const baseY = rawPath[0].y;

                // ── Helpers ────────────────────────────────────────────────────────
                function mod2pi(x) {
                    let v = x % (2 * Math.PI);
                    return v < 0 ? v + 2 * Math.PI : v;
                }
                // My heading convention: atan2(dx, dz) from +z toward +x
                // Standard Dubins: angle from +x CCW  →  std = π/2 - mine
                function toStd(h) { return Math.PI / 2 - h; }

                // ── Step 1: Simplify input ─────────────────────────────────────────
                const pts = [rawPath[0]];
                for (let i = 1; i < rawPath.length; i++) {
                    const prev = pts[pts.length - 1];
                    const dx = rawPath[i].x - prev.x, dz = rawPath[i].z - prev.z;
                    if (Math.sqrt(dx*dx + dz*dz) >= MIN_SEP) pts.push(rawPath[i]);
                }
                const lastRaw = rawPath[rawPath.length - 1];
                if (pts[pts.length - 1] !== lastRaw) pts.push(lastRaw);

                const n = pts.length;
                debugLog(`Mode 2: Dubins input ${rawPath.length} → ${n} pts (${MIN_SEP*100}cm min sep)`, 'INFO');

                // ── Step 2: Headings ───────────────────────────────────────────────
                const stdH = [];
                for (let i = 0; i < n - 1; i++) {
                    const dx = pts[i+1].x - pts[i].x, dz = pts[i+1].z - pts[i].z;
                    stdH.push(toStd(Math.atan2(dx, dz)));
                }
                stdH.push(stdH[stdH.length - 1]);  // last heading = previous

                // ── Step 3: Dubins segment solvers ────────────────────────────────
                // Normalized distances (divide by R). Standard angle convention.
                // Circle centers:
                //   Left  CL = (x - R sinθ,  z + R cosθ)
                //   Right CR = (x + R sinθ,  z - R cosθ)
                // Arc motions (standard: θ from +x CCW, z is 2D y):
                //   Left  (increasing θ): x=CL.x+R sinθ,  z=CL.z-R cosθ
                //   Right (decreasing θ): x=CR.x-R sinθ,  z=CR.z+R cosθ
                //   Straight:             x+=L cosθ,       z+=L sinθ

                function dubinsLSL(a, b, d) {
                    const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b);
                    const psq = 2+d*d-2*Math.cos(a-b)+2*d*(sa-sb);
                    if (psq<0) return null;
                    const p=Math.sqrt(psq);
                    const tmp=Math.atan2(cb-ca, d+sa-sb);
                    return {type:'LSL', t:mod2pi(-a+tmp), p, q:mod2pi(b-tmp)};
                }
                function dubinsRSR(a, b, d) {
                    const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b);
                    const psq = 2+d*d-2*Math.cos(a-b)+2*d*(sb-sa);
                    if (psq<0) return null;
                    const p=Math.sqrt(psq);
                    const tmp=Math.atan2(ca-cb, d-sa+sb);
                    return {type:'RSR', t:mod2pi(a-tmp), p, q:mod2pi(-b+tmp)};
                }
                function dubinsLSR(a, b, d) {
                    const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b);
                    const psq = -2+d*d+2*Math.cos(a-b)+2*d*(sa+sb);
                    if (psq<0) return null;
                    const p=Math.sqrt(psq);
                    const tmp=Math.atan2(-ca-cb, d+sa+sb)-Math.atan2(-2,p);
                    return {type:'LSR', t:mod2pi(-a+tmp), p, q:mod2pi(-b+tmp)};
                }
                function dubinsRSL(a, b, d) {
                    const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b);
                    const psq = -2+d*d+2*Math.cos(a-b)-2*d*(sa+sb);
                    if (psq<0) return null;
                    const p=Math.sqrt(psq);
                    const tmp=Math.atan2(ca+cb, d-sa-sb)-Math.atan2(2,p);
                    return {type:'RSL', t:mod2pi(a-tmp), p, q:mod2pi(b-tmp)};
                }
                function dubinsRLR(a, b, d) {
                    const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b);
                    const v = (6-d*d+2*Math.cos(a-b)+2*d*(sa-sb))/8;
                    if (Math.abs(v)>1) return null;
                    const p=mod2pi(2*Math.PI-Math.acos(v));
                    const t=mod2pi(a-Math.atan2(ca-cb,d-sa+sb)+p/2);
                    return {type:'RLR', t, p, q:mod2pi(a-b-t+p)};
                }
                function dubinsLRL(a, b, d) {
                    const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b);
                    const v = (6-d*d+2*Math.cos(a-b)+2*d*(-sa+sb))/8;
                    if (Math.abs(v)>1) return null;
                    const p=mod2pi(2*Math.PI-Math.acos(v));
                    const t=mod2pi(-a+Math.atan2(-ca+cb,d+sa-sb)+p/2);
                    return {type:'LRL', t, p, q:mod2pi(b-a-t+p)};
                }

                function shortestDubins(x0,z0,th0, x1,z1,th1) {
                    const dx=x1-x0, dz=z1-z0;
                    const D=Math.sqrt(dx*dx+dz*dz)/R;
                    const angle=Math.atan2(dz,dx);   // standard atan2: z is 2D-y
                    const alpha=mod2pi(th0-angle), beta=mod2pi(th1-angle);
                    const best=[
                        dubinsLSL(alpha,beta,D), dubinsRSR(alpha,beta,D),
                        dubinsLSR(alpha,beta,D), dubinsRSL(alpha,beta,D),
                        dubinsRLR(alpha,beta,D), dubinsLRL(alpha,beta,D)
                    ].filter(Boolean);
                    if (!best.length) return null;
                    return best.reduce((a,b) => (a.t+a.p+a.q)<(b.t+b.p+b.q)?a:b);
                }

                // ── Step 4: Sample each Dubins segment ────────────────────────────
                function sampleSeg(x, z, th, seg, out) {
                    const dirs = seg.type.split('');
                    const lens = [seg.t*R, seg.p*R, seg.q*R];
                    for (let si=0; si<3; si++) {
                        const dir=dirs[si], L=lens[si];
                        if (L<0.001) continue;
                        const steps=Math.max(4, Math.ceil(L/STEP));
                        if (dir==='S') {
                            for (let s=1;s<=steps;s++) {
                                const d=(s/steps)*L;
                                out.push(new THREE.Vector3(x+d*Math.cos(th), baseY, z+d*Math.sin(th)));
                            }
                            x+=L*Math.cos(th); z+=L*Math.sin(th);
                        } else if (dir==='L') {
                            const cx=x-R*Math.sin(th), cz=z+R*Math.cos(th);
                            for (let s=1;s<=steps;s++) {
                                const a=(s/steps)*L/R;
                                out.push(new THREE.Vector3(cx+R*Math.sin(th+a), baseY, cz-R*Math.cos(th+a)));
                            }
                            th+=L/R; x=cx+R*Math.sin(th); z=cz-R*Math.cos(th);
                        } else {
                            const cx=x+R*Math.sin(th), cz=z-R*Math.cos(th);
                            for (let s=1;s<=steps;s++) {
                                const a=(s/steps)*L/R;
                                out.push(new THREE.Vector3(cx-R*Math.sin(th-a), baseY, cz+R*Math.cos(th-a)));
                            }
                            th-=L/R; x=cx-R*Math.sin(th); z=cz+R*Math.cos(th);
                        }
                    }
                    return {x,z,th};
                }

                // ── Step 5: Build full path ────────────────────────────────────────
                const out = [new THREE.Vector3(pts[0].x, baseY, pts[0].z)];
                let cx=pts[0].x, cz=pts[0].z, cth=stdH[0];

                for (let i=0; i<n-1; i++) {
                    const gx=pts[i+1].x, gz=pts[i+1].z, gth=stdH[i+1];
                    const seg=shortestDubins(cx,cz,cth, gx,gz,gth);
                    if (seg) {
                        const r=sampleSeg(cx,cz,cth, seg, out);
                        cx=r.x; cz=r.z; cth=r.th;
                    } else {
                        out.push(new THREE.Vector3(gx, baseY, gz));
                        cx=gx; cz=gz; cth=gth;
                    }
                }
                out.push(new THREE.Vector3(pts[n-1].x, baseY, pts[n-1].z));

                // Deduplicate
                const deduped=[out[0]];
                for (let i=1;i<out.length;i++) {
                    const p=deduped[deduped.length-1], q=out[i];
                    if (Math.sqrt((q.x-p.x)**2+(q.z-p.z)**2)>0.005) deduped.push(q);
                }

                debugLog(`Mode 2: Dubins done — ${deduped.length} pts, R=${R}m`, 'INFO');
                return deduped;
            }

            function generatePathCommands(pathPoints) {
                const commands = [];
                const WHEELBASE = 0.34;  // 34cm
                const TRACK_WIDTH = 0.29; // 29cm
                
                // Initialize Mode 2 position and heading from selected tracking source
                if (mode2TrackingSource === 'controller') {
                    // Use Mode 4 controller tracking (ALWAYS AVAILABLE)
                    if (window.mode4Position && window.mode4Heading !== null) {
                        mode2RobotPosition = new THREE.Vector3(
                            window.mode4Position.x,
                            window.mode4Position.y,
                            window.mode4Position.z
                        );
                        mode2RobotHeading = window.mode4Heading;
                        debugLog(`Mode 2: Using controller tracking - Pos(${mode2RobotPosition.x.toFixed(2)}, ${mode2RobotPosition.z.toFixed(2)}) Heading:${(mode2RobotHeading * 180 / Math.PI).toFixed(1)}°`, 'INFO');
                    } else {
                        // Fallback: use path start position
                        mode2RobotPosition = pathPoints[0].clone();
                        mode2RobotHeading = Math.atan2(
                            pathPoints[1].x - pathPoints[0].x,
                            pathPoints[1].z - pathPoints[0].z
                        );
                        debugLog('Mode 2: WARNING - Controller tracking unavailable, using path start', 'WARN');
                    }
                } else if (mode2TrackingSource === 'mode1') {
                    // Use Mode 1 last position (only available if Mode 1 was used)
                    if (mode1LastPosition && mode1LastHeading !== null) {
                        mode2RobotPosition = new THREE.Vector3(
                            mode1LastPosition.x,
                            mode1LastPosition.y,
                            mode1LastPosition.z
                        );
                        mode2RobotHeading = mode1LastHeading;
                        debugLog(`Mode 2: Using Mode 1 position - Pos(${mode2RobotPosition.x.toFixed(2)}, ${mode2RobotPosition.z.toFixed(2)}) Heading:${(mode2RobotHeading * 180 / Math.PI).toFixed(1)}°`, 'INFO');
                    } else {
                        debugLog('Mode 2: ERROR - Mode 1 position not available!', 'ERROR');
                        return [];
                    }
                } else {
                    // Fallback
                    mode2RobotPosition = pathPoints[0].clone();
                    mode2RobotHeading = Math.atan2(
                        pathPoints[1].x - pathPoints[0].x,
                        pathPoints[1].z - pathPoints[0].z
                    );
                }
                
                // Get current differential mode (default 0.25 if not set)
                const differentialMode = window.differentialMode || 0.25;
                
                for (let i = 1; i < pathPoints.length; i++) {
                    const start = pathPoints[i - 1];
                    const end = pathPoints[i];
                    
                    // Calculate heading
                    const dx = end.x - start.x;
                    const dz = end.z - start.z;
                    const targetHeading = Math.atan2(dx, dz);
                    
                    // Calculate heading change
                    let headingChange = targetHeading - mode2RobotHeading;
                    while (headingChange > Math.PI) headingChange -= 2 * Math.PI;
                    while (headingChange < -Math.PI) headingChange += 2 * Math.PI;
                    
                    // Calculate segment distance
                    const segmentDist = Math.sqrt(dx * dx + dz * dz);
                    
                    // Determine steering angle from curvature
                    const curvature = headingChange / Math.max(segmentDist, 0.01);
                    const steeringAngleDeg = Math.max(-30, Math.min(30, curvature * 100));
                    
                    // Convert to servo (90=straight, 130=30°L, 50=30°R)
                    const servo2Angle = Math.round(90 + steeringAngleDeg * (40 / 30));
                    const clampedServo2 = Math.max(50, Math.min(130, servo2Angle));
                    
                    // Base speed (70% straight, slower for curves)
                    const absCurvature = Math.abs(curvature);
                    let baseSpeed = 70 - (absCurvature * 200);
                    baseSpeed = Math.max(55, Math.min(70, baseSpeed));
                    
                    // Apply differential
                    let motor1Speed = baseSpeed;
                    let motor2Speed = baseSpeed;
                    
                    if (Math.abs(steeringAngleDeg) >= 10 && baseSpeed >= 55) {
                        const innerAngleRad = Math.abs(steeringAngleDeg) * Math.PI / 180;
                        const turnRadius = WHEELBASE / Math.tan(innerAngleRad);
                        const innerRadius = turnRadius - (TRACK_WIDTH / 2);
                        const outerRadius = turnRadius + (TRACK_WIDTH / 2);
                        const speedRatio = outerRadius / innerRadius;
                        const fullDifferential = ((speedRatio - 1) / 2) * 100;
                        const differential = fullDifferential * differentialMode;
                        
                        if (steeringAngleDeg > 0) {
                            motor1Speed = baseSpeed + differential;
                            motor2Speed = baseSpeed - differential;
                        } else {
                            motor1Speed = baseSpeed - differential;
                            motor2Speed = baseSpeed + differential;
                        }
                        
                        motor1Speed = Math.round(Math.max(0, Math.min(80, motor1Speed)));
                        motor2Speed = Math.round(Math.max(0, Math.min(80, motor2Speed)));
                        
                        if (motor1Speed > 0 && motor1Speed < 50) motor1Speed = 50;
                        if (motor2Speed > 0 && motor2Speed < 50) motor2Speed = 50;
                    } else {
                        motor1Speed = Math.round(baseSpeed);
                        motor2Speed = Math.round(baseSpeed);
                    }
                    
                    // Calculate duration
                    const avgSpeed = (motor1Speed + motor2Speed) / 2;
                    const speedMetersPerSec = (avgSpeed / 65) * 0.3;
                    const duration = segmentDist / speedMetersPerSec;
                    
                    commands.push({
                        motor1: motor1Speed,
                        motor2: motor2Speed,
                        servo1: 90,
                        servo2: clampedServo2,
                        duration: duration * 1000,
                        targetPosition: end.clone(),
                        targetHeading: targetHeading,
                        segment: i
                    });
                    
                    mode2RobotHeading = targetHeading;
                }
                
                // STOP command
                commands.push({
                    motor1: 0,
                    motor2: 0,
                    servo1: 90,
                    servo2: 90,
                    duration: 100,
                    targetPosition: pathPoints[pathPoints.length - 1].clone(),
                    targetHeading: mode2RobotHeading,
                    segment: pathPoints.length
                });
                
                return commands;
            }
            
            // Mode 1 state storage (for Mode 2 fallback option)
            let mode1LastPosition = null;  // {x, y, z} - stored when Mode 1 drives robot
            let mode1LastHeading = null;   // radians - stored when Mode 1 drives robot
            let mode1WasUsed = false;      // flag to enable Mode 1 option in Mode 2 UI
            
            // Mode 2 state tracking
            let mode2DownsampledPath = [];  // Store downsampled path for regeneration
            let mode2SmoothedPath = null;   // GREEN smoothed path (null if not smoothed yet)
            let mode2PathToFollow = null;   // Actual path to follow (original or smoothed)
            let mode2LastServo2 = 90;  // Smooth servo2 transitions (prevent jerky steering)
            let mode2StartTime = 0;  // Safety: track execution time
            const MODE2_MAX_DURATION = 120000;  // Safety: 2 minute timeout
            let mode2PendingTimeout = null;  // Track pending setTimeout so it can be cancelled
            let mode2PendingPanelRebuild = null;  // Track pending panel rebuild timeout
            let mode2CurrentWaypointIndex = 0;  // Current target waypoint
            
            // Mode 2 control timing
            let mode2LastCommandTime = 0;
            const MODE2_COMMAND_INTERVAL = 500;  // 2 Hz = 500ms between commands
            
            // Mode 2 tracking source: 'controller' (Mode 4 method) or 'mode1' (last position)
            let mode2TrackingSource = 'controller';  // DEFAULT: use Mode 4 controller tracking
            
            // Mode 4 tracking data (exposed globally for Mode 2 to use)
            window.mode4Position = null;  // {x, y, z}
            window.mode4Heading = null;   // radians
            
            // Mode 2 path smoothing constraints
            const MODE2_MIN_TURN_RADIUS = 0.75;
            let mode2TurningRadius = 0.25;  // 5-75cm, default 25cm  // 75cm minimum turning radius
            
            function startMode2Following() {
                if (mode2Following) return;
                
                mode2Following = true;
                mode2CurrentWaypointIndex = 0;  // Start at first waypoint
                mode2LastCommandTime = 0;  // Force immediate first command
                mode2StartTime = Date.now();  // Safety timeout
                
                // Initialize robot position from selected tracking source
                if (mode2TrackingSource === 'controller') {
                    if (window.mode4Position && window.mode4Heading !== null) {
                        mode2RobotPosition = new THREE.Vector3(
                            window.mode4Position.x,
                            window.mode4Position.y,
                            window.mode4Position.z
                        );
                        mode2RobotHeading = window.mode4Heading;
                        debugLog(`Mode 2: START - Controller tracking initialized`, 'INFO');
                        debugLog(`  Position: (${mode2RobotPosition.x.toFixed(2)}, ${mode2RobotPosition.z.toFixed(2)})m`, 'INFO');
                        debugLog(`  Heading: ${(mode2RobotHeading * 180 / Math.PI).toFixed(0)}°`, 'INFO');
                    } else {
                        debugLog('Mode 2: WARNING - Controller tracking not available, using path start', 'WARN');
                        mode2RobotPosition = mode2PathToFollow[0].clone();
                        mode2RobotHeading = 0;
                    }
                } else if (mode2TrackingSource === 'mode1') {
                    if (mode1LastPosition && mode1LastHeading !== null) {
                        mode2RobotPosition = new THREE.Vector3(
                            mode1LastPosition.x,
                            mode1LastPosition.y,
                            mode1LastPosition.z
                        );
                        mode2RobotHeading = mode1LastHeading;
                        debugLog(`Mode 2: START - Mode 1 tracking initialized`, 'INFO');
                        debugLog(`  Position: (${mode2RobotPosition.x.toFixed(2)}, ${mode2RobotPosition.z.toFixed(2)})m`, 'INFO');
                        debugLog(`  Heading: ${(mode2RobotHeading * 180 / Math.PI).toFixed(0)}°`, 'INFO');
                    } else {
                        debugLog('Mode 2: ERROR - Mode 1 tracking not available!', 'ERROR');
                        mode2RobotPosition = mode2PathToFollow[0].clone();
                        mode2RobotHeading = 0;
                    }
                }
                
                debugLog(`Mode 2: Path following started (${mode2PathToFollow.length} waypoints, 2Hz control)`, 'INFO');
                debugLog(`Mode 2: Waypoint tolerance: 10cm, Path deviation tolerance: 10cm`, 'INFO');
                
                // Start control loop
                requestAnimationFrame(mode2ControlLoop);
            }
            
            // ═══════════════════════════════════════════════════════════════════════════════
            // MODE 2: POSITION-BASED CONTROL LOOP (2Hz commands, 10Hz position sampling)
            // ═══════════════════════════════════════════════════════════════════════════════
            
            function mode2ControlLoop() {
                if (!mode2Following) return;
                
                // SAFETY: Check timeout
                if (Date.now() - mode2StartTime > MODE2_MAX_DURATION) {
                    debugLog('Mode 2: TIMEOUT - stopped after 2 minutes', 'ERROR');
                    stopMode2Following();
                    return;
                }
                
                // Update robot position from selected tracking source (10Hz sampling via RAF)
                if (mode2TrackingSource === 'controller') {
                    if (window.mode4Position && window.mode4Heading !== null) {
                        mode2RobotPosition.set(
                            window.mode4Position.x,
                            window.mode4Position.y,
                            window.mode4Position.z
                        );
                        mode2RobotHeading = window.mode4Heading;
                        window.mode2RobotHeading = mode2RobotHeading;  // Expose for visual marker
                    } else {
                        debugLog('Mode 2: WARNING - Controller tracking lost!', 'WARN');
                    }
                } else if (mode2TrackingSource === 'mode1') {
                    // Mode 1 tracking is static (doesn't update during execution)
                    // Position updates would come from odometry if we had it
                }
                
                // Check if we've completed all waypoints
                if (mode2CurrentWaypointIndex >= mode2PathToFollow.length) {
                    debugLog(`Mode 2: ✓ COMPLETED - Reached all ${mode2PathToFollow.length} waypoints`, 'INFO');
                    stopMode2Following();
                    return;
                }
                
                // Get current target waypoint
                const targetWaypoint = mode2PathToFollow[mode2CurrentWaypointIndex];
                
                // Calculate distance to current waypoint
                const dx = targetWaypoint.x - mode2RobotPosition.x;
                const dz = targetWaypoint.z - mode2RobotPosition.z;
                const distanceToWaypoint = Math.sqrt(dx * dx + dz * dz);
                
                // Check if we've reached the current waypoint (10cm tolerance)
                if (distanceToWaypoint < 0.10) {  // 10cm threshold
                    debugLog(`Mode 2: ✓ Waypoint ${mode2CurrentWaypointIndex + 1}/${mode2PathToFollow.length} reached (${(distanceToWaypoint * 100).toFixed(1)}cm)`, 'INFO');
                    mode2CurrentWaypointIndex++;
                    
                    // Check if that was the last waypoint
                    if (mode2CurrentWaypointIndex >= mode2PathToFollow.length) {
                        debugLog('Mode 2: ✓ ALL WAYPOINTS REACHED - Stopping', 'INFO');
                        stopMode2Following();
                        return;
                    }
                }
                
                // Calculate path deviation (distance to nearest path segment)
                let pathDeviation = Infinity;
                for (let i = 0; i < mode2PathToFollow.length - 1; i++) {
                    const p1 = mode2PathToFollow[i];
                    const p2 = mode2PathToFollow[i + 1];
                    
                    // Distance from point to line segment
                    const segDx = p2.x - p1.x;
                    const segDz = p2.z - p1.z;
                    const segLenSq = segDx * segDx + segDz * segDz;
                    
                    if (segLenSq === 0) continue;
                    
                    let t = ((mode2RobotPosition.x - p1.x) * segDx + (mode2RobotPosition.z - p1.z) * segDz) / segLenSq;
                    t = Math.max(0, Math.min(1, t));
                    
                    const projX = p1.x + t * segDx;
                    const projZ = p1.z + t * segDz;
                    const dist = Math.sqrt((mode2RobotPosition.x - projX) ** 2 + (mode2RobotPosition.z - projZ) ** 2);
                    
                    if (dist < pathDeviation) {
                        pathDeviation = dist;
                    }
                }
                
                // Log warning if too far from path
                if (pathDeviation > 0.10) {  // 10cm deviation tolerance
                    debugLog(`Mode 2: WARNING - Path deviation: ${(pathDeviation * 100).toFixed(1)}cm (max 10cm)`, 'WARN');
                }
                
                // 2Hz COMMAND RATE: Only send commands every 500ms
                const now = Date.now();
                if (now - mode2LastCommandTime < MODE2_COMMAND_INTERVAL) {
                    // Not time to send command yet, just update visualization
                    updateMode2Visualization();
                    requestAnimationFrame(mode2ControlLoop);
                    return;
                }
                
                mode2LastCommandTime = now;
                
                // Calculate heading to target waypoint
                const targetHeading = Math.atan2(dx, dz);
                
                // Calculate heading error
                let headingError = targetHeading - mode2RobotHeading;
                while (headingError > Math.PI) headingError -= 2 * Math.PI;
                while (headingError < -Math.PI) headingError += 2 * Math.PI;
                
                // Calculate steering angle (-30° to +30°)
                const steeringAngleDeg = Math.max(-30, Math.min(30, headingError * (180 / Math.PI)));
                
                // Convert to servo command (50-130, center at 90)
                const servo2 = Math.round(90 + steeringAngleDeg * (40 / 30));
                const clampedServo2 = Math.max(50, Math.min(130, servo2));
                
                // Calculate motor speeds based on distance and curvature
                const curvature = Math.abs(headingError) / Math.max(distanceToWaypoint, 0.01);
                let baseSpeed = 70 - (curvature * 200);
                baseSpeed = Math.max(55, Math.min(70, baseSpeed));
                
                // Apply differential (0.25x for slower inside wheel)
                const differentialMode = window.differentialMode || 0.25;
                let motor1Speed = baseSpeed;
                let motor2Speed = baseSpeed;
                
                if (headingError > 0.05) {  // Turning left
                    motor2Speed = Math.round(baseSpeed * differentialMode);
                } else if (headingError < -0.05) {  // Turning right
                    motor1Speed = Math.round(baseSpeed * differentialMode);
                }
                
                // Send command to Arduino
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    const command = `ALL:M1:${motor1Speed}:M2:${motor2Speed}:S1:90:S2:${clampedServo2}`;
                    websocket.send(command);
                    
                    // Send tracking data with comprehensive metrics
                    const timestamp = Date.now();
                    const headingDeg = (mode2RobotHeading * 180 / Math.PI + 360) % 360;
                    const targetHeadingDeg = (targetHeading * 180 / Math.PI + 360) % 360;
                    const posX_cm = (mode2RobotPosition.x * 100).toFixed(1);
                    const posZ_cm = (mode2RobotPosition.z * 100).toFixed(1);
                    const distNext_cm = (distanceToWaypoint * 100).toFixed(1);
                    const pathDev_cm = (pathDeviation * 100).toFixed(1);
                    
                    const trackCommand = `MODE2_TRACK:${timestamp}:${posX_cm}:0:${posZ_cm}:${headingDeg.toFixed(0)}:${targetHeadingDeg.toFixed(0)}:${distNext_cm}:${pathDev_cm}:WP:${mode2CurrentWaypointIndex + 1}/${mode2PathToFollow.length}:M1:${motor1Speed}:M2:${motor2Speed}:S2:${clampedServo2}`;
                    websocket.send(trackCommand);
                }
                
                // Update visualization
                updateMode2Visualization();
                
                // Continue loop
                requestAnimationFrame(mode2ControlLoop);
            }

            function regeneratePathCommandsWithHeading() {
                // Regenerate path commands using the calibrated heading and downsampled path
                const pathPoints = mode2DownsampledPath;  // Use downsampled path, not raw trajectory
                const newCommands = [];
                
                const WHEELBASE = 0.34;
                const TRACK_WIDTH = 0.29;
                const differentialMode = window.differentialMode || 0.25;
                
                // Skip calibration command (already done)
                
                for (let i = 1; i < pathPoints.length; i++) {
                    const start = pathPoints[i - 1];
                    const end = pathPoints[i];
                    
                    // Calculate target heading to next waypoint
                    const dx = end.x - start.x;
                    const dz = end.z - start.z;
                    const targetHeading = Math.atan2(dx, dz);
                    
                    // Calculate heading change from CURRENT heading
                    let headingChange = targetHeading - mode2RobotHeading;
                    while (headingChange > Math.PI) headingChange -= 2 * Math.PI;
                    while (headingChange < -Math.PI) headingChange += 2 * Math.PI;
                    
                    // Calculate segment distance
                    const segmentDist = Math.sqrt(dx * dx + dz * dz);
                    
                    // Determine steering angle
                    const curvature = headingChange / Math.max(segmentDist, 0.01);
                    const steeringAngleDeg = Math.max(-30, Math.min(30, curvature * 100));
                    
                    const servo2Angle = Math.round(90 + steeringAngleDeg * (40 / 30));
                    const clampedServo2 = Math.max(50, Math.min(130, servo2Angle));
                    
                    // Base speed
                    const absCurvature = Math.abs(curvature);
                    let baseSpeed = 70 - (absCurvature * 200);
                    baseSpeed = Math.max(55, Math.min(70, baseSpeed));
                    
                    // Apply differential
                    let motor1Speed = baseSpeed;
                    let motor2Speed = baseSpeed;
                    
                    if (Math.abs(steeringAngleDeg) >= 10 && baseSpeed >= 55) {
                        const innerAngleRad = Math.abs(steeringAngleDeg) * Math.PI / 180;
                        const turnRadius = WHEELBASE / Math.tan(innerAngleRad);
                        const innerRadius = turnRadius - (TRACK_WIDTH / 2);
                        const outerRadius = turnRadius + (TRACK_WIDTH / 2);
                        const speedRatio = outerRadius / innerRadius;
                        const fullDifferential = ((speedRatio - 1) / 2) * 100;
                        const differential = fullDifferential * differentialMode;
                        
                        if (steeringAngleDeg > 0) {
                            motor1Speed = baseSpeed + differential;
                            motor2Speed = baseSpeed - differential;
                        } else {
                            motor1Speed = baseSpeed - differential;
                            motor2Speed = baseSpeed + differential;
                        }
                        
                        motor1Speed = Math.round(Math.max(0, Math.min(80, motor1Speed)));
                        motor2Speed = Math.round(Math.max(0, Math.min(80, motor2Speed)));
                        
                        if (motor1Speed > 0 && motor1Speed < 50) motor1Speed = 50;
                        if (motor2Speed > 0 && motor2Speed < 50) motor2Speed = 50;
                    } else {
                        motor1Speed = Math.round(baseSpeed);
                        motor2Speed = Math.round(baseSpeed);
                    }
                    
                    // Calculate duration
                    const avgSpeed = (motor1Speed + motor2Speed) / 2;
                    const speedMetersPerSec = (avgSpeed / 65) * 0.3;
                    const duration = segmentDist / speedMetersPerSec;
                    
                    newCommands.push({
                        motor1: motor1Speed,
                        motor2: motor2Speed,
                        servo1: 90,
                        servo2: clampedServo2,
                        duration: duration * 1000,
                        targetPosition: end.clone(),
                        targetHeading: targetHeading,
                        segment: i,
                        isCalibration: false
                    });
                    
                    // FIX BUG 2: Update heading for next iteration (was missing!)
                    mode2RobotHeading = targetHeading;
                }
                
                // STOP command
                newCommands.push({
                    motor1: 0,
                    motor2: 0,
                    servo1: 90,
                    servo2: 90,
                    duration: 100,
                    targetPosition: pathPoints[pathPoints.length - 1].clone(),
                    targetHeading: mode2RobotHeading,
                    segment: pathPoints.length,
                    isCalibration: false
                });
                
                // Replace commands (keep calibration command at index 0)
                mode2PathCommands = [mode2PathCommands[0], ...newCommands];
                
                debugLog(`Mode 2: Path regenerated with calibrated heading (${mode2PathCommands.length} commands)`, 'INFO');
            }
            
            function stopMode2Following() {
                if (!mode2Following) return;
                mode2Following = false;
                
                // FIX 6: Cancel any pending setTimeout to prevent burst on Quest headset resume.
                // Without this, queued callbacks all fire at once when the XR session unpauses.
                if (mode2PendingTimeout !== null) {
                    clearTimeout(mode2PendingTimeout);
                    mode2PendingTimeout = null;
                    debugLog('Mode 2: Pending timeout cancelled (prevents resume burst)', 'INFO');
                }
                
                // SAFETY: Emergency stop - send multiple times to ensure receipt
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    const stopCmd = 'ALL:M1:0:M2:0:S1:90:S2:90';
                    websocket.send(stopCmd);
                    websocket.send(stopCmd);  // Send twice for safety
                    websocket.send('MODE2_STOP');  // Notify server
                    debugLog('Mode 2: EMERGENCY STOP SENT (motors off)', 'WARN');
                }
                
                // SAFETY: Clear Mode 2 state completely
                mode2FollowIndex = 0;
                window.mode2RobotHeading = undefined;
                
                // Reset isSent so the path can be re-executed after a stop
                isSent = false;
                
                debugLog('Mode 2: Path following completed/stopped', 'INFO');
                document.getElementById('trajectory-status').textContent = 'COMPLETE';
                document.getElementById('trajectory-status').className = 'status-good';
            }

            function createMode2Grid() {
                // Guard: Don't recreate if grid already exists
                if (mode2GridPlane) {
                    debugLog('Mode 2: Grid already exists, skipping creation', 'INFO');
                    return;
                }
                
                // Create white background with 10cm x 10cm grid (black lines)
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                
                // White background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 2048, 2048);
                
                // Black grid lines
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                // Grid: MAP_SIZE = 2.1m, so 21x21 squares of 10cm each
                const gridSize = 21;  // 21 squares
                const cellSize = 2048 / gridSize;  // pixels per cell
                
                // Draw vertical lines
                for (let i = 0; i <= gridSize; i++) {
                    const x = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, 2048);
                    ctx.stroke();
                }
                
                // Draw horizontal lines
                for (let i = 0; i <= gridSize; i++) {
                    const y = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(2048, y);
                    ctx.stroke();
                }
                
                // Create texture and plane
                const texture = new THREE.CanvasTexture(canvas);
                const geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
                const mat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide,
                    transparent: false
                });
                
                mode2GridPlane = new THREE.Mesh(geo, mat);
                mode2GridPlane.rotation.x = -Math.PI / 2;
                mode2GridPlane.position.set(0, floorY + 0.002, 0);  // LOWER than map to avoid Z-fighting

            function createPathMarker(position, index, color) {
                // Create 4cm diameter empty circle with number
                const group = new THREE.Group();
                
                // Circle (4cm diameter = 0.04m)
                const circleGeo = new THREE.RingGeometry(0.018, 0.020, 32);
                const circleMat = new THREE.MeshBasicMaterial({ 
                    color: color, 
                    side: THREE.DoubleSide 
                });
                const circle = new THREE.Mesh(circleGeo, circleMat);
                circle.rotation.x = -Math.PI / 2;
                circle.position.y = 0.002;  // Slightly above grid
                group.add(circle);
                
                // Number text (using canvas texture)
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = color === 0x00ff00 ? '#00ff00' : '#ff8800';
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index.toString(), 64, 64);
                
                const textTexture = new THREE.CanvasTexture(canvas);
                const textGeo = new THREE.PlaneGeometry(0.03, 0.03);
                const textMat = new THREE.MeshBasicMaterial({ 
                    map: textTexture, 
                    transparent: true,
                    side: THREE.DoubleSide
                });
                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.rotation.x = -Math.PI / 2;
                textMesh.position.set(0.03, 0.003, 0);  // Next to circle
                group.add(textMesh);
                
                group.position.copy(position);
                return group;
            }
            
            function updateMode2UserMarkers() {
                // GUARD: Don't create ANY markers until user has actually drawn something
                if (trajectoryPoints.length < 2) {
                    debugLog('Mode 2: Not enough points for markers, skipping', 'INFO');
                    return;
                }
                
                // SAFETY: Verify we're in drawing mode
                if (!isDrawing) {
                    debugLog('Mode 2: Not drawing, skipping marker update', 'INFO');
                    return;
                }
                
                // Place markers every 20cm along user path (interpolated for precision)
                if (!mode2UserMarkersGroup) {
                    mode2UserMarkersGroup = new THREE.Group();
                    scene.add(mode2UserMarkersGroup);
                }
                
                // Clear existing markers
                while (mode2UserMarkersGroup.children.length > 0) {
                    mode2UserMarkersGroup.remove(mode2UserMarkersGroup.children[0]);
                }
                mode2UserMarkers = [];
                
                debugLog(`Mode 2: Creating markers from ${trajectoryPoints.length} points`, 'INFO');
                
                // First marker at start
                const firstMarker = createPathMarker(trajectoryPoints[0], 0, 0x00ff00);
                mode2UserMarkersGroup.add(firstMarker);
                mode2UserMarkers.push({
                    index: 0,
                    position: trajectoryPoints[0].clone(),
                    distance: 0,
                    gridX: Math.floor((trajectoryPoints[0].x + MAP_SIZE/2) / 0.1),
                    gridZ: Math.floor((trajectoryPoints[0].z + MAP_SIZE/2) / 0.1)
                });
                
                // Place markers at exact 20cm intervals (interpolated)
                let cumulativeDistance = 0;
                let nextMarkerDistance = 0.20;  // First marker after start
                let markerIndex = 1;
                
                for (let i = 1; i < trajectoryPoints.length; i++) {
                    const segmentStart = trajectoryPoints[i-1];
                    const segmentEnd = trajectoryPoints[i];
                    const segmentLength = segmentEnd.distanceTo(segmentStart);
                    const segmentStartDist = cumulativeDistance;
                    
                    cumulativeDistance += segmentLength;
                    
                    // Check if any markers fall within this segment
                    while (nextMarkerDistance <= cumulativeDistance) {
                        // Interpolate exact position at nextMarkerDistance
                        const distIntoSegment = nextMarkerDistance - segmentStartDist;
                        const t = distIntoSegment / segmentLength;  // 0 to 1
                        
                        const markerPos = new THREE.Vector3(
                            segmentStart.x + (segmentEnd.x - segmentStart.x) * t,
                            segmentStart.y + (segmentEnd.y - segmentStart.y) * t,
                            segmentStart.z + (segmentEnd.z - segmentStart.z) * t
                        );
                        
                        const marker = createPathMarker(markerPos, markerIndex, 0x00ff00);
                        mode2UserMarkersGroup.add(marker);
                        mode2UserMarkers.push({
                            index: markerIndex,
                            position: markerPos.clone(),
                            distance: nextMarkerDistance,
                            gridX: Math.floor((markerPos.x + MAP_SIZE/2) / 0.1),
                            gridZ: Math.floor((markerPos.z + MAP_SIZE/2) / 0.1)
                        });
                        
                        markerIndex++;
                        nextMarkerDistance += 0.20;  // Next marker 20cm later
                    }
                }
                
                // Last marker at end if >1cm from previous marker
                const lastPoint = trajectoryPoints[trajectoryPoints.length - 1];
                const distFromLastMarker = cumulativeDistance - mode2UserMarkers[mode2UserMarkers.length - 1].distance;
                
                if (distFromLastMarker > 0.01) {
                    const marker = createPathMarker(lastPoint, markerIndex, 0x00ff00);
                    mode2UserMarkersGroup.add(marker);
                    mode2UserMarkers.push({
                        index: markerIndex,
                        position: lastPoint.clone(),
                        distance: cumulativeDistance,
                        gridX: Math.floor((lastPoint.x + MAP_SIZE/2) / 0.1),
                        gridZ: Math.floor((lastPoint.z + MAP_SIZE/2) / 0.1)
                    });
                }
                
                debugLog(`Mode 2: Placed ${mode2UserMarkers.length} user markers at exact 20cm intervals`, 'INFO');
            }
