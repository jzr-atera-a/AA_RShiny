            // ─── DIFFERENTIAL MODE PANEL ──────────────────────────────────────────────────
            let differentialPanel = null;
            let selectedDifferentialMode = 0.25;  // Default: 0.25x
            
            function buildDifferentialPanel() {
                if (!floorDetected) return;
                
                const W = 600;
                const H = 500;
                const canvas = document.createElement('canvas');
                canvas.width = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');
                
                drawDifferentialPanel(ctx, W, H);
                
                const tex = new THREE.CanvasTexture(canvas);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                
                const geo = new THREE.PlaneGeometry(0.6, 0.5);  // 60cm × 50cm
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
                differentialPanel = new THREE.Mesh(geo, mat);
                differentialPanel.userData.canvas = canvas;
                differentialPanel.userData.ctx = ctx;
                
                // Position: ABOVE vehicle panel (same X/Z, higher Y)
                differentialPanel.position.set(
                    userX + 1.1,  // Same X as vehicle panel
                    floorY + 1.45,  // 65cm above vehicle panel
                    userZ - (MAP_SIZE / 2 + 0.10)  // Same Z as vehicle panel
                );
                differentialPanel.lookAt(new THREE.Vector3(userX + 1.1, floorY + 1.45, userZ));
                scene.add(differentialPanel);
                
                debugLog('Differential mode panel built', 'INFO');
            }
            
            function drawDifferentialPanel(ctx, W, H) {
                ctx.clearRect(0, 0, W, H);
                
                // Background
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, 'rgba(20,10,10,0.95)');
                grad.addColorStop(1, 'rgba(15,5,5,0.95)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Border
                ctx.strokeStyle = '#ff6600';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, W-4, H-4);
                
                // Title
                ctx.fillStyle = '#ff6600';
                ctx.font = 'bold 26px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('DIFFERENTIAL', W/2, 32);
                
                // Separator
                ctx.strokeStyle = '#ff6600';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(20, 45);
                ctx.lineTo(W-20, 45);
                ctx.stroke();
                
                // Mode options
                const modes = [
                    { name: '0.25x', value: 0.25, y: 70 },
                    { name: '0.50x', value: 0.50, y: 165 },
                    { name: '0.75x', value: 0.75, y: 260 }
                ];
                
                const rowH = 85;
                modes.forEach(mode => {
                    const isSelected = Math.abs(selectedDifferentialMode - mode.value) < 0.01;
                    
                    // Row background
                    if (isSelected) {
                        ctx.fillStyle = 'rgba(255, 102, 0, 0.2)';
                        ctx.fillRect(15, mode.y, W-30, rowH);
                    }
                    
                    // Border
                    ctx.strokeStyle = isSelected ? '#ff6600' : '#666666';
                    ctx.lineWidth = isSelected ? 3 : 2;
                    ctx.strokeRect(15, mode.y, W-30, rowH);
                    
                    // Mode name
                    ctx.fillStyle = isSelected ? '#ffffff' : '#888888';
                    ctx.font = 'bold 32px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(mode.name, W/2, mode.y + 45);
                    
                    // Active indicator
                    if (isSelected) {
                        ctx.fillStyle = '#00ff66';
                        ctx.font = 'bold 16px Arial';
                        ctx.fillText('✓ ACTIVE', W/2, mode.y + 70);
                    }
                });
                
                // Info text
                ctx.fillStyle = '#999999';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Differential drive strength', W/2, H - 20);
            }
            
            function checkDifferentialPanelInteraction(controller) {
                if (!differentialPanel || !controller) return;
                
                const raycaster = new THREE.Raycaster();
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion);
                raycaster.set(controller.position, dir);
                const hits = raycaster.intersectObject(differentialPanel);
                
                if (hits.length > 0) {
                    const uv = hits[0].uv;
                    const W = differentialPanel.userData.canvas.width;
                    const H = differentialPanel.userData.canvas.height;
                    const uvY = 1.0 - uv.y;
                    const y = uvY * H;
                    
                    // Check which mode was clicked
                    const modes = [
                        { value: 0.25, yMin: 70, yMax: 155 },
                        { value: 0.50, yMin: 165, yMax: 250 },
                        { value: 0.75, yMin: 260, yMax: 345 }
                    ];
                    
                    modes.forEach(mode => {
                        if (y >= mode.yMin && y <= mode.yMax) {
                            selectedDifferentialMode = mode.value;
                            window.differentialMode = mode.value;
                            debugLog(`Differential mode set to ${mode.value}x`, 'INFO');
                            drawDifferentialPanel(differentialPanel.userData.ctx, W, H);
                            differentialPanel.material.map.needsUpdate = true;
                        }
                    });
                }
            }

            function checkVehiclePanelInteraction(controller) {
                if (!vehiclePanel) return;
                const ray = new THREE.Raycaster();
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion);
                ray.set(controller.position, dir);
                const hits = ray.intersectObject(vehiclePanel);
                if (hits.length === 0) return;
                const uv = hits[0].uv;
                if (!uv) return;
                
                const uvY = 1.0 - uv.y;
                
                // Check vehicle rows - update SELECTED vehicle (not active yet)
                const vehicles = [
                    { type: 'robot', y1: 80/600, y2: 200/600 },
                    { type: 'truck', y1: 200/600, y2: 320/600 }
                ];
                
                for (const veh of vehicles) {
                    if (uvY >= veh.y1 && uvY <= veh.y2) {
                        selectedVehicle = veh.type;  // Just highlight selection
                        vehicleApprovePressed = false;
                        drawVehiclePanel(vehiclePanel.userData.ctx, 600, 600);
                        return;
                    }
                }
                
                // Check APPROVE button - actually switch to selected vehicle
                const approveY1 = 340/600;
                const approveY2 = 390/600;
                if (uvY >= approveY1 && uvY <= approveY2) {
                    vehicleApprovePressed = true;
                    drawVehiclePanel(vehiclePanel.userData.ctx, 600, 600);
                    
                    // Actually switch to the selected vehicle
                    switchToVehicle(selectedVehicle).then(() => {
                        debugLog(`Vehicle switched to: ${selectedVehicle}`, 'INFO');
                    }).catch(err => {
                        debugLog(`Vehicle switch error: ${err}`, 'ERROR');
                    });
                }
            }

            function drawControlPanel(ctx, W, H) {
                ctx.clearRect(0, 0, W, H);

                // Background
                ctx.fillStyle = 'rgba(15,15,30,0.95)';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, W-4, H-4);

                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ROBOT CONTROL MODE', W/2, 42);

                // Separator
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(20, 55); ctx.lineTo(W-20, 55); ctx.stroke();

                const modes = [
                    { num: '0', title: 'R Vehicle Map View', desc: 'View R Vehicle and M25 London' },
                    { num: '1', title: 'Manual', desc: 'Joystick' },
                    { num: '2', title: 'Trajectory', desc: 'Draw path' },
                    { num: '3', title: 'M25 Auto', desc: 'Sevenoaks' },
                    { num: '4', title: 'Ctrl Track', desc: 'Left Kalman' },
                    { num: '5', title: 'Anchor', desc: 'Spatial' },
                    { num: '6', title: 'EV Chargers', desc: 'Live Status' },
                    { num: '7', title: 'Truck Positions', desc: 'Fleet Map' }
                ];

                const rowH = 120;
                modes.forEach((m, i) => {
                    const y = 70 + i * rowH;
                    const isActive = (controlMode === i);

                    // Row background
                    ctx.fillStyle = isActive ? 'rgba(0,255,100,0.18)' : 'rgba(255,255,255,0.04)';
                    ctx.fillRect(16, y, W-32, rowH - 8);
                    ctx.strokeStyle = isActive ? '#00ff66' : '#444466';
                    ctx.lineWidth = isActive ? 3 : 1;
                    ctx.strokeRect(16, y, W-32, rowH - 8);

                    // Radio button
                    ctx.strokeStyle = isActive ? '#00ff66' : '#888888';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(48, y + 46, 16, 0, Math.PI * 2);
                    ctx.stroke();
                    if (isActive) {
                        ctx.fillStyle = '#00ff66';
                        ctx.beginPath();
                        ctx.arc(48, y + 46, 10, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Mode number + title (single line)
                    ctx.fillStyle = isActive ? '#00ff66' : '#ffffff';
                    ctx.font = `bold 28px Arial`;
                    ctx.textAlign = 'left';
                    ctx.fillText(`${m.num}. ${m.title}`, 76, y + 48);

                    // Description
                    ctx.fillStyle = isActive ? '#aaffcc' : '#aaaaaa';
                    ctx.font = '20px Arial';
                    ctx.fillText(m.desc, 76, y + 76);

                    // ACTIVE badge
                    if (isActive) {
                        ctx.fillStyle = '#00ff66';
                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'right';
                        ctx.fillText('✓ ACTIVE', W - 24, y + 48);
                        ctx.textAlign = 'left';
                    }
                });

                // APPROVE button (below Mode 7)
                const btnY = 70 + 8 * rowH + 10;
                ctx.fillStyle = approvePressed ? '#333333' : '#226622';
                ctx.fillRect(30, btnY, W-60, 60);
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 3;
                ctx.strokeRect(30, btnY, W-60, 60);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('APPROVE', W/2, btnY + 42);

                if (controlPanel && controlPanel.material && controlPanel.material.map) {
                    controlPanel.material.map.needsUpdate = true;
                }
            }

            // ─── PANEL INTERACTION ────────────────────────────────────────────────────────
            function checkControlPanelInteraction(controller) {
                if (!controlPanel) return;
                const ray = new THREE.Raycaster();
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion);
                ray.set(controller.position, dir);
                const hits = ray.intersectObject(controlPanel);
                if (hits.length === 0) return;
                const uv = hits[0].uv;
                if (!uv) return;

                const totalModeRows = 8; // Modes 0-7
                const rowH = 120 / 1200;  // per-mode row height in UV (120px rows, 1200px canvas)
                const topOffset = 70 / 1200; // top margin in UV

                // Check mode rows
                for (let i = 0; i < totalModeRows; i++) {
                    const y1 = topOffset + i * rowH;
                    const y2 = y1 + rowH;
                    const uvY = 1.0 - uv.y; // flip Y
                    if (uvY >= y1 && uvY <= y2) {
                        controlMode = i; // Mode 0-7
                        approvePressed = false;
                        drawControlPanel(controlPanel.userData.ctx, 1500, 1200);
                        document.getElementById('mode-status').textContent = `MODE ${controlMode}`;
                        return;
                    }
                }

                // APPROVE button (updated for 8 modes)
                const approveY1 = (70 + 8 * 120 + 10) / 1200;
                const approveY2 = approveY1 + (60 / 1200);
                const uvY = 1.0 - uv.y;
                if (uvY >= approveY1 && uvY <= approveY2) {
                    approvePressed = true;
                    drawControlPanel(controlPanel.userData.ctx, 1500, 1200);
                    executeMode(controlMode);
                }
            }

            function executeMode(mode) {
                debugLog(`=== EXECUTE MODE ${mode} ===`, 'INFO');
                debugLog(`Current vehicle: ${currentVehicle}`, 'INFO');
                
                // ALWAYS show current vehicle in ALL modes
                if (currentVehicle === 'robot') {
                    showMode0Robot();
                    debugLog('Robot should be visible now', 'INFO');
                } else {
                    showMode0Truck();
                    debugLog('Truck should be visible now', 'INFO');
                }

                // Hide all left panels first
                if (mode2LeftPanel) { 
                    scene.remove(mode2LeftPanel); 
                    mode2LeftPanel = null;
                    
                    // Cancel any pending panel rebuild to prevent setTimeout firing after mode exit
                    if (mode2PendingPanelRebuild !== null) {
                        clearTimeout(mode2PendingPanelRebuild);
                        mode2PendingPanelRebuild = null;
                        debugLog('Mode 2: Cancelled pending panel rebuild (mode exiting)', 'INFO');
                    }
                }
                if (mode3LeftPanel) { 
                    scene.remove(mode3LeftPanel); 
                    mode3LeftPanel = null; 
                }
                
                // Clear Mode 2/3 paths when switching modes
                if (mode !== 1) {
                    // Cleanup Mode 1
                    if (mode1LeftPanel) {
                        scene.remove(mode1LeftPanel);
                        mode1LeftPanel = null;
                    }
                    if (mode1PathLine) {
                        scene.remove(mode1PathLine);
                        mode1PathLine = null;
                    }
                    mode1TrackingActive = false;
                    mode1PathData = [];
                    removeMode1Grid();
                    if (mapPlane && !mapPlane.visible) mapPlane.visible = true;
                }
                
                if (mode !== 2) {
                    // Only clear tracking if Mode 2 is not actively executing.
                    // Clearing mid-execution would freeze mode2LiveX/Z and trigger the stop guard.
                    if (!mode2Following) {
                        mode2TrackingActive = false;
                        mode2ControllerPath = [];
                        if (mode2ControllerLine) {
                            scene.remove(mode2ControllerLine);
                            mode2ControllerLine = null;
                        }
                        removeMode2Grid();
                        if (mapPlane && !mapPlane.parent) {
                            scene.add(mapPlane);
                            debugLog('Mode 2 exit: Map RE-ADDED to scene', 'INFO');
                        }
                    }
                }
                if (mode !== 3) {
                    mode3TrackingActive = false;
                    mode3SimulationActive = false;
                    if (mode3SimulationInterval) {
                        clearInterval(mode3SimulationInterval);
                        mode3SimulationInterval = null;
                    }
                    mode3ControllerPath = [];
                    if (mode3ControllerLine) {
                        scene.remove(mode3ControllerLine);
                        mode3ControllerLine = null;
                    }
                }

                // Mode 0 doesn't need websocket
                if (mode === 0) {
                    // Stop Mode 4 tracking if active
                    if (isTrackingRobot) stopRobotTracking();
                    document.getElementById('trajectory-status').textContent = 'MAP VIEW ACTIVE';
                    return;
                }

                // Mode 4 and 5 don't need websocket - start tracking immediately
                if (mode === 4) {
                    // Stop other modes before starting Mode 4
                    if (isManualControlActive) stopManualControl();
                    if (isChargerModeActive) stopChargerMode();
                    startRobotTracking();
                    return;
                }
                
                if (mode === 5) {
                    // Stop other modes before starting Mode 5
                    if (isTrackingRobot) stopRobotTracking();
                    if (isManualControlActive) stopManualControl();
                    if (isChargerModeActive) stopChargerMode();
                    startAnchorTracking();
                    return;
                }

                if (!websocket || websocket.readyState !== WebSocket.OPEN) return;

                const modeNames = {
                    0: 'R Vehicle Map View',
                    1: 'Manual Control',
                    2: 'User Trajectory',
                    3: 'M25 Highway',
                    4: 'Track Robot (Controller)',
                    5: 'Spatial Anchor Tracking',
                    6: 'EV Charger Status',
                    7: 'Truck Positions Map'
                };

                websocket.send(JSON.stringify({
                    command: 'MODE_SELECTED',
                    mode,
                    mode_name: modeNames[mode],
                    timestamp: performance.now()
                }));

                // Stop all active modes first
                if (mode2Following) {
                    debugLog('SAFETY: Force-stopping Mode 2 before mode switch', 'WARN');
                    stopMode2Following();
                }
                if (isManualControlActive) stopManualControl();
                if (isTrackingRobot) stopRobotTracking();
                if (anchorTrackingActive) anchorTrackingActive = false;
                if (isChargerModeActive) stopChargerMode();

                if (mode === 1) {
                    // Hide M25 map, show grid
                    if (mapPlane) mapPlane.visible = false;
                    createMode1Grid();
                    
                    // Create left panel
                    mode1LeftPanel = buildMode1LeftPanel();
                    mode1LeftPanel.position.set(userX - 1.1, floorY + 0.80, userZ - (MAP_SIZE/2 + 0.10));
                    mode1LeftPanel.rotation.y = 0;
                    scene.add(mode1LeftPanel);
                    
                    startManualControl();
                }
                
                // Mode 2: Show left panel + grid, hide map
                if (mode === 2) {
                    // Clear old trajectory data from previous sessions
                    trajectoryPoints = [];
                    totalDistance = 0;
                    isApproved = false;
                    isSent = false;
                    isDrawing = false;
                    
                    // Clear trajectory line
                    if (trajectoryLine) {
                        scene.remove(trajectoryLine);
                        trajectoryLine = null;
                    }
                    
                    // Clear controller path
                    mode2ControllerPath = [];
                    if (mode2ControllerLine) {
                        scene.remove(mode2ControllerLine);
                        mode2ControllerLine = null;
                    }
                    
                    // Update UI
                    document.getElementById('point-count').textContent = '0';
                    document.getElementById('path-distance').textContent = '0.00';
                    document.getElementById('trajectory-status').textContent = 'IDLE';
                    
                    // ACTUALLY REMOVE MAP FROM SCENE (not just hide)
                    if (mapPlane) {
                        scene.remove(mapPlane);
                        debugLog('Mode 2: Map REMOVED from scene', 'INFO');
                    }
                    createMode2Grid();
                    
                    // Create left panel
                    mode2LeftPanel = buildMode2LeftPanel();
                    mode2LeftPanel.position.set(userX - 1.1, floorY + 0.80, userZ - (MAP_SIZE/2 + 0.10));
                    mode2LeftPanel.rotation.y = 0;
                    scene.add(mode2LeftPanel);
                    
                    // ACTIVATE CONTROLLER TRACKING IMMEDIATELY (like Mode 4)
                    mode2TrackingActive = true;
                    debugLog('Mode 2: Controller tracking ACTIVATED', 'INFO');
                    
                    debugLog('Mode 2: Initialized - cleared old data, grid created', 'INFO');
                }
                
                if (mode === 3) {
                    // Mode 3: Show left panel
                    mode3LeftPanel = buildMode3LeftPanel();
                    mode3LeftPanel.position.set(userX - 1.1, floorY + 0.80, userZ - (MAP_SIZE/2 + 0.10));
                    mode3LeftPanel.rotation.y = 0;
                    scene.add(mode3LeftPanel);
                    debugLog('Mode 3: Left panel created', 'INFO');
                    
                    // Send M25 command
                    m25ChartData = [];
                    chartMaxSpeed = 1; chartMaxDist = 1;
                    websocket.send(JSON.stringify({
                        command: 'EXECUTE_M25',
                        start_location: 'Sevenoaks',
                        direction: 'clockwise'
                    }));
                }

                if (mode === 6) startChargerMode();
                
                if (mode === 7) {
                    // Mode 7: Truck Positions (no vehicles shown)
                    if (mode0Robot) mode0Robot.visible = false;
                    if (mode0Truck) mode0Truck.visible = false;
                    if (mapPlane) mapPlane.visible = false;  // Hide M25 map
                    mode7Active = true;
                    loadMode7Map();
                    debugLog('Mode 7: Truck positions mode started', 'INFO');
                }
                
                if (mode !== 7) {
                    cleanupMode7();
                    // Restore M25 map when leaving Mode 7
                    if (mapPlane && !mapPlane.visible) mapPlane.visible = true;
                }
            }

            // ─── MODE 1: MANUAL CONTROL ──────────────────────────────────────────────────
            let isManualControlActive = false;
            let manualControlInterval = null;
            let lastJoystickForward = 0;
            let lastJoystickTurn = 0;
            let lastMotorSpeed = 0;      // Both motors same speed (MOTORS:XX command)
            let lastServo2 = 90;          // Servo2 (pin 9) - steering (50-130°)
            let lastServo1 = 90;          // Servo1 (pin 8) - gripper (40-140°)
            
            // Left controller tracking for Mode 1
            let mode1LeftTracking = false;
            let mode1LeftMarker = null;
            let mode1LeftPanel = null;
            let mode1TrackingActive = false;
            let mode1PathData = [];  // Stores {pos, heading, linear, angular, timestamp}
            let mode1PathLine = null;  // Orange line
            let mode1Markers = [];
            let mode1MarkersGroup = null;
            let mode1GridPlane = null;
            
            function buildMode1LeftPanel() {
                const canvas = document.createElement('canvas');
                canvas.width = 600;
