<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Robot AR — Map + 3D Vehicle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family: monospace; color:#0f0; overflow:hidden; }
  #hud {
    position:fixed; top:0; left:0; width:100%; z-index:100;
    background:rgba(0,0,0,0.85); padding:10px 14px;
    font-size:12px; line-height:1.8; pointer-events:none;
  }
  #hud .row { display:flex; gap:18px; flex-wrap:wrap; }
  .ok  { color:#0f0; }
  .bad { color:#f00; }
  .warn{ color:#ff0; }
  .info{ color:#0af; }
  #start-btn {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); border:2px solid #0f0; color:#0f0;
    font-family:monospace; font-size:16px; padding:14px 40px;
    cursor:pointer; z-index:200; letter-spacing:3px;
    transition: all 0.2s;
  }
  #start-btn:hover { background:rgba(0,255,0,0.15); box-shadow:0 0 20px rgba(0,255,0,0.4); }
  #start-btn:disabled { opacity:0.3; cursor:default; }
  #hud-corners { position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:50; display:none; }
  .corner { position:absolute; width:20px; height:20px; border-color:rgba(0,255,0,0.5); border-style:solid; }
  .tl{top:12px;left:12px;border-width:2px 0 0 2px}
  .tr{top:12px;right:12px;border-width:2px 2px 0 0}
  .bl{bottom:12px;left:12px;border-width:0 0 2px 2px}
  .br{bottom:12px;right:12px;border-width:0 2px 2px 0}
</style>
</head>
<body>

<div id="hud">
  <div class="row">
    <span>🤖 ROBOT AR</span>
    <span>AR: <span id="s-ar" class="warn">—</span></span>
    <span>Floor: <span id="s-floor" class="warn">detecting…</span></span>
    <span>Map: <span id="s-map" class="warn">loading…</span></span>
    <span>Robot: <span id="s-robot" class="warn">loading…</span></span>
  </div>
  <div class="row" style="margin-top:4px; font-size:10px; color:#888;">
    Body 60cm · Track 30cm · Wheelbase 34cm · Shown at 1:1 real size
  </div>
</div>

<div id="hud-corners">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
</div>

<button id="start-btn" onclick="startAR()">▶ START AR</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

// ══════════════════════════════════════════════════════════════════════════════
// ROBOT PHYSICAL CONFIGURATION
// ══════════════════════════════════════════════════════════════════════════════
const ROBOT = {
  bodyLength:    0.60,   // 60 cm — full encasing length
  wheelbase:     0.34,   // 34 cm — front to rear axle
  wheelTrack:    0.30,   // 30 cm — outer wheel to outer wheel
  bodyWidth:     0.30,   // approx from wheel track + fender
  bodyHeight:    0.20,   // approx from proportions
  turningRadius: 0.50,   // 50 cm minimum
  maxSpeed:      0.20,   // 20 cm/s = 0.20 m/s
  minSpeed:      0.08,   // 8 cm/s
  // Servo: Ackermann steering, 45–135°, center 90°
  servoMin:  45,
  servoMax:  135,
  servoCenter: 90,
};

// STL scale: model body = 200 STL units = 600 mm real → factor = 0.003 m/unit
const STL_SCALE = ROBOT.bodyLength / 200.0;   // = 0.003

// MAP
const MAP_SIZE    = 2.1;   // 2.1 × 2.1 m floor projection
const FLOOR_OFFSET = 1.6;  // camera to floor estimate (m)

/
function b64ToBuffer(b64) {
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const u8  = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return buf;
}

function parseSTLBinary(buffer) {
  const geo  = new THREE.BufferGeometry();
  const view = new DataView(buffer);
  const n    = view.getUint32(80, true);
  const pos  = [], nor = [];
  let off = 84;
  for (let i = 0; i < n; i++) {
    const nx = view.getFloat32(off,     true);
    const ny = view.getFloat32(off + 4,  true);
    const nz = view.getFloat32(off + 8,  true);
    off += 12;
    for (let v = 0; v < 3; v++) {
      pos.push(view.getFloat32(off, true), view.getFloat32(off+4, true), view.getFloat32(off+8, true));
      nor.push(nx, ny, nz);
      off += 12;
    }
    off += 2;
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  return geo;
}

function loadRobotGeometry() {
  const buf = b64ToBuffer(STL_B64);
  const geo = parseSTLBinary(buf);
  geo.computeBoundingBox();
  // Centre geometry
  const centre = new THREE.Vector3();
  geo.boundingBox.getCenter(centre);
  geo.translate(-centre.x, -centre.y, -centre.z);
  return geo;
}

// ══════════════════════════════════════════════════════════════════════════════
// THREE.JS GLOBALS
// ══════════════════════════════════════════════════════════════════════════════
let scene, camera, renderer;
let floorY = null, floorDetected = false;
let userX = 0, userZ = 0;
let mapPlane = null;
let robotGroup = null;
let floorPlane = null;
let arStarted = false;

// ──────────────────────────────────────────────────────────────────────────────
// BUILD ROBOT MESH
// ──────────────────────────────────────────────────────────────────────────────
function buildRobotMesh() {
  const geo = loadRobotGeometry();

  // ── Bake orientation directly into geometry (avoids Euler composition bugs) ──
  // STL axes: X=front(long), Y=left, Z=up
  // Target:   robot flat on floor, top facing +Y, front facing -Z (north)
  //
  // Step 1: rotateX(-PI/2)  →  Z-up becomes Y-up, robot lies flat, top faces +Y
  // Step 2: rotateY(-PI/2)  →  front (STL +X) now faces -Z (north on map)
  geo.rotateX(-Math.PI / 2);
  geo.rotateY(-Math.PI / 2);

  // After baking, recompute bounding box to get correct wheel-bottom Y
  geo.computeBoundingBox();
  const yMin = geo.boundingBox.min.y;   // lowest point (wheel bottom) in local space
  // Shift geometry so wheel bottoms sit at Y=0 in local space
  geo.translate(0, -yMin, 0);
  geo.computeBoundingBox();

  // Body material — white gloss
  const bodyMat = new THREE.MeshPhongMaterial({
    color:     0xf2f0ec,
    specular:  0x999999,
    shininess: 90,
    side:      THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, bodyMat);
  mesh.scale.setScalar(STL_SCALE);

  // Hazard stripe edge highlight
  const edgeGeo = new THREE.EdgesGeometry(geo, 28);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xf5c842, transparent: true, opacity: 0.3 });
  const edges   = new THREE.LineSegments(edgeGeo, edgeMat);
  edges.scale.setScalar(STL_SCALE);

  // Direction arrow — points toward front (-Z after bake = north)
  const arrowGeo = new THREE.ConeGeometry(0.03, 0.08, 8);
  arrowGeo.rotateX(-Math.PI / 2);
  const arrow = new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({ color: 0x00ff44 }));
  // Place arrow at top-front of robot in world space (after scale)
  const bodyTopY = geo.boundingBox.max.y * STL_SCALE + 0.04;
  arrow.position.set(0, bodyTopY, -ROBOT.bodyLength * 0.45);

  robotGroup = new THREE.Group();
  robotGroup.add(mesh);
  robotGroup.add(edges);
  robotGroup.add(arrow);

  // No extra Y lift needed — geometry already shifted so wheel bottoms = Y=0
  // Group position Y will be set to floorY when placed
  robotGroup.userData.wheelOffset = 0;

  document.getElementById('s-robot').textContent = 'Ready';
  document.getElementById('s-robot').className = 'ok';
  return robotGroup;
}

// ──────────────────────────────────────────────────────────────────────────────
// MAP FROM GEOJSON
// ──────────────────────────────────────────────────────────────────────────────
async function loadGeoJSONMap() {
  const res    = await fetch('sample_campus_map.geojson');
  const geojson = await res.json();

  const canvas = document.createElement('canvas');
  canvas.width = 4096; canvas.height = 2048;  // 2× wider E-W
  const ctx = canvas.getContext('2d');

  // Dark background
  ctx.fillStyle = '#0a0f1f';
  ctx.fillRect(0, 0, 4096, 2048);

  function coordToPixel(lon, lat) {
    // Canvas: 4096 wide (E-W) × 2048 tall (N-S) = 2:1 aspect ratio
    // Same geographic range (0.0037) on both axes → 2x horizontal stretch
    // Data centred at lon=0.000045, lat=0.000125
    const lonRange = 0.0037;
    const latRange = 0.0037;
    const lonCentre = 0.000045;
    const latCentre = 0.000125;
    const x = (lon - lonCentre + lonRange / 2) / lonRange * 4096;
    const y = 2048 - (lat - latCentre + latRange / 2) / latRange * 2048;
    return [x, y];
  }

  // Heatmap blobs
  const m25 = geojson.features.find(f => f.properties.heatmap);
  if (m25 && m25.geometry.type === 'LineString') {
    m25.geometry.coordinates.forEach((c, i) => {
      const [x, y] = coordToPixel(c[0], c[1]);
      const ratio = i / m25.geometry.coordinates.length;
      const col = ratio < 0.25 || ratio > 0.75 ? 'rgba(0,255,0,0.28)'
                : ratio < 0.4  || ratio > 0.6  ? 'rgba(255,255,0,0.28)'
                : 'rgba(255,102,0,0.28)';
      const g = ctx.createRadialGradient(x, y, 0, x, y, 160);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 80, 0, Math.PI*2); ctx.fill();
    });
  }

  // Polygons
  geojson.features.filter(f => f.geometry.type === 'Polygon').forEach(f => {
    ctx.fillStyle = f.properties.color || '#ccc';
    ctx.globalAlpha = f.properties.opacity || 0.4;
    ctx.beginPath();
    f.geometry.coordinates[0].forEach((c, i) => {
      const [x, y] = coordToPixel(c[0], c[1]);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.fill(); ctx.globalAlpha = 1;
  });

  // Lines
  geojson.features.filter(f => f.geometry.type === 'LineString').forEach(f => {
    ctx.strokeStyle = f.properties.color || '#333';
    ctx.lineWidth   = f.properties.width  || 4;
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.globalAlpha = f.properties.opacity || 1;
    if (f.properties.heatmap) { ctx.shadowColor = f.properties.color; ctx.shadowBlur = 15; }
    ctx.beginPath();
    f.geometry.coordinates.forEach((c, i) => {
      const [x, y] = coordToPixel(c[0], c[1]);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    if (f.properties.designation) {
      const [x, y] = coordToPixel(f.geometry.coordinates[0][0], f.geometry.coordinates[0][1]);
      ctx.fillStyle = f.properties.color; ctx.font = 'bold 22px Arial';
      ctx.fillText(f.properties.designation, x+8, y-8);
    }
  });

  // Points
  geojson.features.filter(f => f.geometry.type === 'Point').forEach(f => {
    const [x, y] = coordToPixel(f.geometry.coordinates[0], f.geometry.coordinates[1]);
    ctx.fillStyle = ctx.shadowColor = f.properties.color || '#00ff88';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(f.properties.name, x+14, y+5);
    ctx.shadowBlur = 0;
  });

  // Centre label + North
  const [cx, cy] = coordToPixel(0.000045, 0.000125);  // LONDON label at data centre
  ctx.fillStyle = '#fff'; ctx.font = 'bold 56px Arial'; ctx.textAlign = 'center';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
  ctx.fillText('LONDON', cx, cy); ctx.shadowBlur = 0; ctx.textAlign = 'left';
  // North arrow — top centre
  ctx.fillStyle = '#fff'; ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center';
  ctx.fillText('↑ N', 2048, 55);
  ctx.textAlign = 'left';

  // Scale indicator
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(80, 1980); ctx.lineTo(480, 1980); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
  ctx.fillText('MAP (scaled)', 280, 2010);
  // East edge label
  ctx.textAlign = 'right';
  ctx.fillText('E →', 4060, 1024);

  document.getElementById('s-map').textContent = 'Loaded';
  document.getElementById('s-map').className = 'ok';
  return new THREE.CanvasTexture(canvas);
}

function placeMap(texture) {
  texture.minFilter = texture.magFilter = THREE.LinearFilter;
  const geo = new THREE.PlaneGeometry(MAP_SIZE * 2, MAP_SIZE);  // 2× wider E-W
  geo.rotateX(-Math.PI / 2);
  mapPlane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: texture, transparent: true, opacity: 0.72, depthWrite: false
  }));
  mapPlane.position.set(userX, floorY + 0.001, userZ);
  scene.add(mapPlane);

  // Compass rose above map centre
  addCompassRose(userX, floorY + 0.003, userZ);

  // Place robot: wheels touch floor exactly (geometry Y=0 = wheel bottom)
  robotGroup.position.set(userX, floorY, userZ);
  robotGroup.rotation.y = 0;  // front faces -Z (north) — baked into geometry
  scene.add(robotGroup);

  console.log('✓ Robot placed on floor at', userX.toFixed(2), floorY.toFixed(2), userZ.toFixed(2));
  console.log('  Scale:', STL_SCALE, '→ body renders at', (200*STL_SCALE*100).toFixed(0), 'cm');
}

function addCompassRose(cx, y, cz) {
  // Simple N/S/E/W labels as sprites
  const directions = [
    { label:'N', dx: 0,               dz:-MAP_SIZE/2-0.12 },
    { label:'S', dx: 0,               dz: MAP_SIZE/2+0.12 },
    { label:'E', dx: MAP_SIZE+0.12,   dz: 0 },   // 2× wider
    { label:'W', dx:-MAP_SIZE-0.12,   dz: 0 },   // 2× wider
  ];
  directions.forEach(d => {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#00ff88'; ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.label, 32, 32);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
    sp.scale.set(0.12, 0.12, 1);
    sp.position.set(cx + d.dx, y + 0.01, cz + d.dz);
    scene.add(sp);
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// INIT SCENE
// ──────────────────────────────────────────────────────────────────────────────
function init() {
  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 50);

  // Warm directional + cool fill + ambient
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(3, 6, 3);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xd0e8ff, 0.6);
  fill.position.set(-3, 2, -3);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x404060, 1.0));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222244, 0.5));

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Pre-build robot (geometry parsing is slow, do it before AR starts)
  buildRobotMesh();
  // Don't add to scene yet — will be placed on floor detection

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(animate);
}

// ──────────────────────────────────────────────────────────────────────────────
// START AR
// ──────────────────────────────────────────────────────────────────────────────
async function startAR() {
  if (!navigator.xr) {
    alert('WebXR not available. Open this page in Meta Quest Browser.');
    return;
  }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!ok) {
    alert('immersive-ar not supported. Ensure you are using Meta Quest Browser v28+.');
    return;
  }

  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').textContent = 'Starting…';

  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['dom-overlay', 'hit-test'],
      domOverlay: { root: document.body }
    });
  } catch(e) {
    console.warn('local-floor failed, trying local:', e);
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });
    } catch(e2) {
      alert('Could not start AR: ' + e2.message);
      document.getElementById('start-btn').disabled = false;
      document.getElementById('start-btn').textContent = '▶ START AR';
      return;
    }
  }

  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);

  arStarted = true;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('hud-corners').style.display = 'block';
  document.getElementById('s-ar').textContent = 'Active';
  document.getElementById('s-ar').className = 'ok';

  session.addEventListener('end', () => {
    arStarted = false;
    floorDetected = false;
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('start-btn').disabled = false;
    document.getElementById('start-btn').textContent = '▶ START AR';
    document.getElementById('hud-corners').style.display = 'none';
    document.getElementById('s-ar').textContent = 'Ended';
    document.getElementById('s-ar').className = 'warn';
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// ANIMATE LOOP
// ──────────────────────────────────────────────────────────────────────────────
function animate() {
  const session = renderer.xr.getSession();

  if (session && !floorDetected) {
    const frame    = renderer.xr.getFrame();
    const refSpace = renderer.xr.getReferenceSpace();
    if (frame && refSpace) {
      const vp = frame.getViewerPose(refSpace);
      if (vp) {
        // With local-floor the floor is Y=0; viewer Y = standing height
        userX  = vp.transform.position.x;
        userZ  = vp.transform.position.z;

        // local-floor: floor at Y=0
        // local (fallback): estimate floor from viewer height
        const refType = renderer.xr.getReferenceSpaceType?.() || 'local-floor';
        floorY = refType === 'local-floor' ? 0.0
               : vp.transform.position.y - FLOOR_OFFSET;

        floorDetected = true;

        // Invisible floor collider
        floorPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(50,50).rotateX(-Math.PI/2),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        floorPlane.position.y = floorY;
        scene.add(floorPlane);

        // Subtle grid
        const grid = new THREE.GridHelper(6, 30, 0x003300, 0x001100);
        grid.position.set(userX, floorY + 0.0005, userZ);
        scene.add(grid);

        document.getElementById('s-floor').textContent =
          `Y=${floorY.toFixed(2)}m`;
        document.getElementById('s-floor').className = 'ok';

        // Load map and place robot
        loadGeoJSONMap()
          .then(tex => placeMap(tex))
          .catch(e => {
            console.error('Map load error:', e);
            document.getElementById('s-map').textContent = 'Error';
            document.getElementById('s-map').className = 'bad';
            // Still place robot even if map fails
            robotGroup.position.set(userX, floorY, userZ);
            scene.add(robotGroup);
          });
      }
    }
  }

  renderer.render(scene, camera);
}

// ──────────────────────────────────────────────────────────────────────────────
// CHECK XR SUPPORT
// ──────────────────────────────────────────────────────────────────────────────
async function checkSupport() {
  if (!navigator.xr) {
    document.getElementById('s-ar').textContent = 'No WebXR';
    document.getElementById('s-ar').className = 'bad';
    document.getElementById('start-btn').disabled = true;
    return;
  }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  document.getElementById('s-ar').textContent = ok ? 'Supported ✓' : 'Not supported';
  document.getElementById('s-ar').className   = ok ? 'ok' : 'bad';
  if (!ok) document.getElementById('start-btn').disabled = true;
}

// Make startAR accessible from inline onclick
window.startAR = startAR;

// Boot
init();
checkSupport();
</script>
</body>
</html>
