            function startMode3Simulation() {
                if (mode3SimulationActive) return;
                
                debugLog(`Mode 3: Attempting simulation. M25 coords available: ${m25PathCoordinates.length}`, 'INFO');
                
                if (m25PathCoordinates.length < 2) {
                    debugLog('Mode 3: No M25 path data available - cannot start simulation', 'ERROR');
                    alert('M25 path data not loaded. Please wait for map to load.');
                    return;
                }
                
                mode3SimulationActive = true;
                mode3SimulationProgress = 0;  // Distance traveled in meters
                mode3ControllerPath = [];
                
                debugLog('Mode 3: Simulation started (20cm/s) with real M25 path', 'INFO');
                
                // Calculate total M25 path length
                let totalDistance = 0;
                for (let i = 1; i < m25PathCoordinates.length; i++) {
                    const p1 = latLonTo3D(m25PathCoordinates[i-1].lat, m25PathCoordinates[i-1].lon);
                    const p2 = latLonTo3D(m25PathCoordinates[i].lat, m25PathCoordinates[i].lon);
                    totalDistance += Math.sqrt((p2.x - p1.x)**2 + (p2.z - p1.z)**2);
                }
                
                debugLog(`Mode 3: M25 total path length: ${totalDistance.toFixed(2)}m`, 'INFO');
                debugLog(`Mode 3: First point: ${JSON.stringify(m25PathCoordinates[0])}`, 'INFO');
                
                // Move at 20cm/s = 0.2m/s, update at 60Hz
                mode3SimulationInterval = setInterval(() => {
                    mode3SimulationProgress += 0.2 / 60;  // 0.2m/s at 60Hz = distance per frame
                    
                    // Loop when reaching end
                    if (mode3SimulationProgress >= totalDistance) {
                        mode3SimulationProgress = 0;
                    }
                    
                    // Get M25 point at distance
                    const point = getM25PointAtDistance(mode3SimulationProgress);
                    if (point) {
                        // Update vehicle
                        const wheelOffset = 0.04;
                        if (currentVehicle === 'robot' && mode0Robot) {
                            mode0Robot.position.set(point.x, floorY + 0.001 + wheelOffset, point.z);
                            // Add PI/2 + PI to align vehicle facing forward (180° flip)
                            mode0Robot.rotation.y = point.heading + (Math.PI / 2) + Math.PI;
                            
                            // Debug first update
                            if (mode3SimulationProgress < 0.1) {
                                debugLog(`Mode 3: Vehicle at (${point.x.toFixed(2)}, ${point.z.toFixed(2)}), heading ${point.heading.toFixed(2)}`, 'INFO');
                            }
                        }
                        if (currentVehicle === 'truck' && mode0Truck) {
                            mode0Truck.position.set(point.x, floorY + 0.001 + wheelOffset, point.z);
                            // Add PI/2 + PI to align vehicle facing forward (180° flip)
                            mode0Truck.rotation.y = point.heading + (Math.PI / 2) + Math.PI;
                        }
                        
                        // Add to path
                        updateMode3ControllerPath(new THREE.Vector3(point.x, floorY + 0.001, point.z));
                    } else {
                        debugLog('Mode 3: getM25PointAtDistance returned null!', 'ERROR');
                    }
                }, 1000/60);
            }
            
            function stopMode3Simulation() {
                mode3SimulationActive = false;
                if (mode3SimulationInterval) {
                    clearInterval(mode3SimulationInterval);
                    mode3SimulationInterval = null;
                }
                debugLog('Mode 3: Simulation stopped', 'INFO');
            }
            
            function latLonTo3D(lat, lon) {
                // Use EXACT SAME coordinate transformation as coordToPixel()
                const lonRange = 0.0037, latRange = 0.0037;
                const lonCentre = 0.000045, latCentre = 0.000125;
                
                // Convert to pixel coordinates (same as heatmap rendering)
                const pixelX = (lon - lonCentre + lonRange / 2) / lonRange * 4096;
                const pixelY = 2048 - (lat - latCentre + latRange / 2) / latRange * 2048;
                
                // Convert pixels to 3D world coordinates
                // Map texture: 4096 wide x 2048 tall
                // Normalize: 0-1 range, centered at 0.5
                const normX = pixelX / 4096;  // 0 to 1
                const normY = pixelY / 2048;  // 0 to 1
                
                // CRITICAL FIX: Rotate 90° counter-clockwise and scale 2x
                // Original: x = normX, z = normY
                // Rotated 90° CCW: x = -normY, z = normX
                // Then center and scale by 2x
                
                const x = -(normY - 0.5) * MAP_SIZE * 2;  // Rotate + 2x scale
                const z = (normX - 0.5) * MAP_SIZE * 2;   // Rotate + 2x scale
                
                return { x, z };
            }
            
            function getM25PointAtDistance(targetDistance) {
                // Find position on M25 path at given distance from start
                if (m25PathCoordinates.length < 2) return null;
                
                let accumulatedDistance = 0;
                
                for (let i = 1; i < m25PathCoordinates.length; i++) {
                    const p1 = latLonTo3D(m25PathCoordinates[i-1].lat, m25PathCoordinates[i-1].lon);
                    const p2 = latLonTo3D(m25PathCoordinates[i].lat, m25PathCoordinates[i].lon);
                    
                    const segmentLength = Math.sqrt((p2.x - p1.x)**2 + (p2.z - p1.z)**2);
                    
                    if (accumulatedDistance + segmentLength >= targetDistance) {
                        // Target is on this segment
                        const remainingDist = targetDistance - accumulatedDistance;
                        const t = remainingDist / segmentLength;  // Interpolation factor (0-1)
                        
                        const x = p1.x + (p2.x - p1.x) * t;
                        const z = p1.z + (p2.z - p1.z) * t;
                        
                        // Calculate heading (direction to next point)
                        const dx = p2.x - p1.x;
                        const dz = p2.z - p1.z;
                        const heading = Math.atan2(dx, dz);  // Heading in radians
                        
                        return { x, z, heading };
                    }
                    
                    accumulatedDistance += segmentLength;
                }
                
                // If we get here, return last point
                const lastPoint = latLonTo3D(
                    m25PathCoordinates[m25PathCoordinates.length - 1].lat,
                    m25PathCoordinates[m25PathCoordinates.length - 1].lon
                );
                return { x: lastPoint.x, z: lastPoint.z, heading: 0 };
            }
            
            function updateMode3ControllerPath(point) {
                mode3ControllerPath.push(point.clone());
                
                // Update orange line
                if (mode3ControllerLine) { scene.remove(mode3ControllerLine); mode3ControllerLine = null; }
                if (mode3ControllerPath.length >= 2) {
                    const geo = new THREE.BufferGeometry().setFromPoints(mode3ControllerPath);
                    mode3ControllerLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xff8800, linewidth: 3 })); // ORANGE
                    scene.add(mode3ControllerLine);
                }
            }
            
            function analyzeMode3Paths() {
                if (mode3ControllerPath.length < 2) {
                    debugLog('Not enough path data for analysis', 'ERROR');
                    return;
                }
                
                let analysis = '=== MODE 3 M25 ANALYSIS ===\n\n';
                
                // Calculate M25 ideal path
                const m25Distance = Math.PI * 2 * (MAP_SIZE * 0.4);
                
                let controllerDist = 0;
                for (let i = 1; i < mode3ControllerPath.length; i++) {
                    controllerDist += mode3ControllerPath[i].distanceTo(mode3ControllerPath[i-1]);
                }
                
                analysis += `M25 Ideal Path:\n`;
                analysis += `  Circumference: ${m25Distance.toFixed(3)}m\n\n`;
                
                analysis += `${mode3Mode === 'virtual' ? 'Controller' : 'Simulation'} Path (Orange):\n`;
                analysis += `  Points: ${mode3ControllerPath.length}\n`;
                analysis += `  Total Distance: ${controllerDist.toFixed(3)}m\n\n`;
                
                const deviation = Math.abs(m25Distance - controllerDist);
                analysis += `Deviation: ${deviation.toFixed(3)}m (${(deviation/m25Distance*100).toFixed(1)}%)\n\n`;
                
                // Radial deviation from ideal circle
                analysis += `Radial Deviations (from ideal M25):\n`;
                const idealRadius = MAP_SIZE * 0.4;
                const step = Math.floor(mode3ControllerPath.length / 10);
                for (let i = 0; i < mode3ControllerPath.length; i += step) {
                    const p = mode3ControllerPath[i];
                    const radius = Math.sqrt(p.x * p.x + p.z * p.z);
                    const radialDev = Math.abs(radius - idealRadius);
                    analysis += `  Point ${i}: ${(radialDev*100).toFixed(1)}cm\n`;
                }
                
                downloadTextFile('mode3_analysis.txt', analysis);
                debugLog('Mode 3 analysis downloaded', 'INFO');
            }

            // ─── MODE 6: EV CHARGER STATUS ───────────────────────────────────────────────
            function startChargerMode() {
                if (isChargerModeActive) return;
                isChargerModeActive = true;
                debugLog('Mode 6: EV Charger tracking started', 'INFO');
                
                // Build 3D graph
                charger3DGraph = build3DChargerGraph();
                if (charger3DGraph) scene.add(charger3DGraph);
                
                // Build 2D panel
                charger2DPanel = build2DChargerPanel();
                if (charger2DPanel) scene.add(charger2DPanel);
                
                // Reset rotation and zoom
                charger3DRotation = { x: 0, y: 0 };
                charger3DZoom = 1.0;
                
                // Initialize history
                chargerHistoryData = [generateChargerPerformanceData()];
                
                // Show control instructions
                document.getElementById('mode6-controls').style.display = 'block';
                
                // Request initial charger update from server
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        command: 'START_CHARGER_UPDATES'
                    }));
                }
                
                debugLog('Mode 6: 3D graph and 2D panel created', 'INFO');
            }

            function stopChargerMode() {
                isChargerModeActive = false;
                clearAllChargerMarkers();
                selectedChargers = [];
                
                // Remove graphs
                if (charger3DGraph) {
                    scene.remove(charger3DGraph);
                    charger3DGraph = null;
                }
                if (charger2DPanel) {
                    scene.remove(charger2DPanel);
                    charger2DPanel = null;
                }
                
                chargerHistoryData = [];
                
                // Hide control instructions
                document.getElementById('mode6-controls').style.display = 'none';
                
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        command: 'STOP_CHARGER_UPDATES'
                    }));
                }
                debugLog('Mode 6: EV Charger tracking stopped', 'INFO');
            }

            function clearAllChargerMarkers() {
                chargerMarkers.forEach(marker => {
                    if (marker.cone) scene.remove(marker.cone);
                    if (marker.infoPanel) scene.remove(marker.infoPanel);
                });
                chargerMarkers = [];
            }

            function updateChargers(chargersData) {
                if (!floorDetected || !isChargerModeActive) return;
                
                // Clear old markers
                clearAllChargerMarkers();
                
                debugLog(`Received ${chargersData.length} charger updates`, 'INFO');
                
                // Create new markers for each charger
                chargersData.forEach((charger, index) => {
                    const {x, z} = latLonToARCoords(charger.lat, charger.lon);
                    createChargerMarker(charger, x, z, index);
                });
                
                // Add new performance data to history
                const newData = generateChargerPerformanceData();
                chargerHistoryData.push(newData);
                if (chargerHistoryData.length > MAX_HISTORY) {
                    chargerHistoryData.shift(); // Remove oldest
                }
                
                // Rebuild 3D graph with new data
                if (charger3DGraph) {
                    scene.remove(charger3DGraph);
                    charger3DGraph = build3DChargerGraph();
                    if (charger3DGraph) {
                        scene.add(charger3DGraph);
                        // Reapply rotation and zoom
                        update3DChargerGraph();
                    }
                }
                
                // Update 2D panel
                update2DChargerPanel();
            }

            function createChargerMarker(charger, x, z, index) {
                // Determine color based on status
                let color;
                switch(charger.status) {
                    case 'available': color = 0x00ff00; break;  // Green
                    case 'in_use': color = 0xffaa00; break;     // Yellow/Orange
                    case 'offline': color = 0xff0000; break;    // Red
                    case 'reserved': color = 0x0099ff; break;   // Blue
                    default: color = 0x888888;                   // Gray
                }
                
                // Create pulsing cone marker
                const geo = new THREE.ConeGeometry(0.08, 0.20, 8);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 0.9
                });
                const cone = new THREE.Mesh(geo, mat);
                cone.position.set(x, floorY + 0.15, z);  // Float above map
                cone.userData = { 
                    charger: charger,
                    index: index,
                    type: 'charger_marker'
                };
                scene.add(cone);
                
                // Store marker reference
                chargerMarkers.push({
                    cone: cone,
                    charger: charger,
                    createdAt: Date.now(),
                    infoPanel: null
                });
                
                debugLog(`Created charger marker at (${x.toFixed(2)}, ${z.toFixed(2)}) - ${charger.status}`, 'INFO');
            }

            function checkChargerSelection(controller) {
                if (!isChargerModeActive || !controller) return;
                
                const raycaster = new THREE.Raycaster();
                const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion);
                raycaster.set(controller.position, direction);
                
                // Check all charger cones
                const cones = chargerMarkers.map(m => m.cone).filter(c => c);
                const intersects = raycaster.intersectObjects(cones);
                
                if (intersects.length > 0) {
                    const selectedCone = intersects[0].object;
                    const chargerData = selectedCone.userData.charger;
                    const chargerIndex = selectedCone.userData.index;
                    
                    // Toggle selection
                    const existingIndex = selectedChargers.findIndex(c => c.id === chargerData.id);
                    if (existingIndex >= 0) {
                        // Deselect
                        selectedChargers.splice(existingIndex, 1);
                        removeChargerInfoPanel(chargerData.id);
                        debugLog(`Deselected charger ${chargerData.id}`, 'INFO');
                    } else {
                        // Select
                        selectedChargers.push(chargerData);
                        showChargerInfoPanel(chargerData, selectedCone.position);
                        debugLog(`Selected charger ${chargerData.id} - ${selectedChargers.length} total selected`, 'INFO');
                    }
                }
            }

            function showChargerInfoPanel(charger, position) {
                // Create HIGH RES canvas for info panel (same ratio as before: 4:3)
                const canvas = document.createElement('canvas');
                canvas.width = 2048;   // 4x higher resolution
                canvas.height = 1536;  // 4x higher resolution
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = 'rgba(0, 44, 60, 0.95)';
                ctx.fillRect(0, 0, 2048, 1536);
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 16;
                ctx.strokeRect(16, 16, 2016, 1504);
                
                // Title
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 128px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Charger ${charger.id}`, 1024, 180);
                
                // Status indicator bar
                const statusColors = {
                    'available': '#00ff00',
                    'in_use': '#ffaa00',
                    'offline': '#ff0000',
                    'reserved': '#0099ff'
                };
                ctx.fillStyle = statusColors[charger.status] || '#888888';
                ctx.fillRect(720, 240, 608, 32);
                
                // Info fields (scaled 4x)
                const fields = [
                    { label: 'Status:', value: charger.status.toUpperCase(), y: 400 },
                    { label: 'Condition:', value: charger.condition, y: 560 },
                    { label: 'Capacity:', value: charger.capacity, y: 720 },
                    { label: 'Connector:', value: charger.connector_type, y: 880 },
                    { label: 'Price:', value: charger.price, y: 1040 },
                    { label: 'Queue:', value: `${charger.queue_length} vehicles`, y: 1200 }
                ];
                
                ctx.textAlign = 'left';
                fields.forEach(field => {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 96px Arial';
                    ctx.fillText(field.label, 120, field.y);
                    
                    ctx.fillStyle = '#00ccff';
                    ctx.font = '96px Arial';
                    ctx.fillText(field.value, 800, field.y);
                });
                
                // Create 3D panel with CRISP texture filtering
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;  // Critical for clarity
                texture.magFilter = THREE.LinearFilter;  // Critical for clarity
                texture.needsUpdate = true;
                
                const panelGeo = new THREE.PlaneGeometry(0.4, 0.3);
                const panelMat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true,
                    side: THREE.DoubleSide
                });
                const panel = new THREE.Mesh(panelGeo, panelMat);
                
                // Position near charger but offset and higher
                panel.position.set(position.x + 0.3, position.y + 0.25, position.z);
                panel.lookAt(new THREE.Vector3(0, position.y + 0.25, 0)); // Face user
                panel.userData = { charger_id: charger.id, type: 'info_panel' };
                
                scene.add(panel);
                
                // Store panel reference
                const markerIndex = chargerMarkers.findIndex(m => m.charger.id === charger.id);
                if (markerIndex >= 0) {
                    chargerMarkers[markerIndex].infoPanel = panel;
                }
            }

            function removeChargerInfoPanel(chargerId) {
                const markerIndex = chargerMarkers.findIndex(m => m.charger.id === chargerId);
                if (markerIndex >= 0 && chargerMarkers[markerIndex].infoPanel) {
                    scene.remove(chargerMarkers[markerIndex].infoPanel);
                    chargerMarkers[markerIndex].infoPanel = null;
                }
            }

            function animateChargerMarkers(timestamp) {
                if (!isChargerModeActive) return;
                
                // Pulse animation for charger cones
                const pulseSpeed = 0.003;
                const pulseAmount = 0.15;
                const pulse = Math.sin(timestamp * pulseSpeed) * pulseAmount + 1.0;
                
                chargerMarkers.forEach(marker => {
                    if (marker.cone) {
                        marker.cone.scale.y = pulse;
                        marker.cone.rotation.y += 0.01; // Slow rotation
                    }
                });
                
                // Auto-remove markers older than 15 seconds
                const now = Date.now();
                chargerMarkers = chargerMarkers.filter(marker => {
                    if (now - marker.createdAt > CHARGER_UPDATE_INTERVAL) {
                        if (marker.cone) scene.remove(marker.cone);
                        if (marker.infoPanel) scene.remove(marker.infoPanel);
                        return false;
                    }
                    return true;
                });
            }

            // ─── MODE 6: 3D GRAPH ────────────────────────────────────────────────────────
            function build3DChargerGraph() {
                if (!floorDetected) return;
                
                const group = new THREE.Group();
                const S = CHARGER_GRAPH_SCALE;
                
                // Generate simulated performance data
                const locations = ['North', 'East', 'South', 'West', 'Central'];
                const performanceData = chargerHistoryData.length > 0 ? chargerHistoryData[chargerHistoryData.length - 1] : generateChargerPerformanceData();
                
                // Axes
                const axMat = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 2 });
                const mkLine = (p1, p2) => {
                    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...p1), new THREE.Vector3(...p2)]);
                    return new THREE.Line(g, axMat);
                };
                group.add(mkLine([0,0,0], [S,0,0]));       // X axis
                group.add(mkLine([0,0,0], [0,S*1.2,0]));   // Y axis
                group.add(mkLine([0,0,0], [0,0,S*0.8]));   // Z axis
                
                // Axis labels
                const makeLabel = (text, pos, col = '#00ff88') => {
                    const lc = document.createElement('canvas');
                    lc.width = 256; lc.height = 80;
                    const lctx = lc.getContext('2d');
                    lctx.fillStyle = col;
                    lctx.font = 'bold 36px Arial';
                    lctx.textAlign = 'center';
                    lctx.fillText(text, 128, 54);
                    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ 
                        map: new THREE.CanvasTexture(lc), 
                        transparent: true 
                    }));
                    sp.position.set(...pos);
                    sp.scale.set(0.35, 0.11, 1);
                    group.add(sp);
                };
                makeLabel('LOCATIONS', [S + 0.15, 0.02, 0], '#00ccff');
                makeLabel('UTILIZATION %', [0.08, S*1.2 + 0.12, 0], '#00ff88');
                makeLabel('TIME', [0, 0.02, S*0.8 + 0.12], '#ffaa00');
                makeLabel('CHARGER PERFORMANCE ANALYTICS', [S/2, S*1.2 + 0.3, 0], '#ffffff');
                
                // 3D Bars - Utilization by location
                const barWidth = S / (locations.length + 2);
                locations.forEach((loc, i) => {
                    const utilization = performanceData.utilization[i] || 0;
                    const h = (utilization / 100) * S;
                    const col = utilization > 75 ? 0x00ff88 : utilization > 50 ? 0xffaa00 : 0xff6600;
                    
                    const geo = new THREE.BoxGeometry(barWidth * 0.7, h, barWidth * 0.7);
                    const mat = new THREE.MeshStandardMaterial({ 
                        color: col, 
                        roughness: 0.3, 
                        metalness: 0.5,
                        emissive: col,
                        emissiveIntensity: 0.2
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    const bx = ((i + 1) / (locations.length + 1)) * S;
                    mesh.position.set(bx, h / 2, 0);
                    group.add(mesh);
                    
                    // Location label
                    const llc = document.createElement('canvas');
                    llc.width = 128; llc.height = 48;
                    const llctx = llc.getContext('2d');
                    llctx.fillStyle = '#ffffff';
                    llctx.font = 'bold 24px Arial';
                    llctx.textAlign = 'center';
                    llctx.fillText(loc, 64, 32);
                    const lsp = new THREE.Sprite(new THREE.SpriteMaterial({ 
                        map: new THREE.CanvasTexture(llc), 
                        transparent: true 
                    }));
                    lsp.position.set(bx, -0.15, 0);
                    lsp.scale.set(0.25, 0.08, 1);
                    group.add(lsp);
                });
                
                // 3D Scatter - Charging sessions over time
                const scatterData = performanceData.sessions || [];
                scatterData.forEach(session => {
                    const geo = new THREE.SphereGeometry(0.03, 8, 8);
                    const col = session.speed > 100 ? 0x00ff00 : session.speed > 50 ? 0xffaa00 : 0xff0000;
                    const mat = new THREE.MeshStandardMaterial({ 
                        color: col, 
                        emissive: col, 
                        emissiveIntensity: 0.5,
                        roughness: 0.2,
                        metalness: 0.8
                    });
                    const sphere = new THREE.Mesh(geo, mat);
                    sphere.position.set(
                        session.location * S,
                        (session.utilization / 100) * S,
                        session.time * S * 0.8
                    );
                    group.add(sphere);
                });
                
                // Grid lines
                for (let g = 0.2; g <= 1.0; g += 0.2) {
                    const y = g * S;
                    const gm = new THREE.LineBasicMaterial({ color: 0x0a3040, transparent: true, opacity: 0.3 });
                    const gg = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, y, 0), 
                        new THREE.Vector3(S, y, 0)
                    ]);
                    group.add(new THREE.Line(gg, gm));
                }
                
                // Position graph floating above map
                group.position.set(userX - S/2, floorY + CHARGER_GRAPH_Y, userZ - S*0.4);
                group.rotation.x = -0.15; // Slight tilt
                
                return group;
            }

            function generateChargerPerformanceData() {
                const data = {
                    utilization: [],
                    sessions: []
                };
                
                // Generate utilization percentages for 5 locations
                for (let i = 0; i < 5; i++) {
                    data.utilization.push(30 + Math.random() * 65); // 30-95%
                }
                
                // Generate 15-20 charging sessions
                const numSessions = 15 + Math.floor(Math.random() * 6);
                for (let i = 0; i < numSessions; i++) {
                    data.sessions.push({
                        location: Math.random(),      // 0-1 normalized
                        utilization: 20 + Math.random() * 75,  // 20-95%
                        time: Math.random(),          // 0-1 normalized
                        speed: 30 + Math.random() * 120  // 30-150 kW
                    });
                }
                
                return data;
            }

            function update3DChargerGraph() {
                if (!charger3DGraph || !isChargerModeActive) return;
                
                // Apply user rotation and zoom
                charger3DGraph.rotation.x = -0.15 + charger3DRotation.x;
                charger3DGraph.rotation.y = charger3DRotation.y;
                charger3DGraph.scale.setScalar(charger3DZoom);
            }

            // ─── MODE 6: 2D PANEL GRAPH ──────────────────────────────────────────────────
            function build2DChargerPanel() {
                if (!floorDetected) return;
                
                const canvas = document.createElement('canvas');
                canvas.width = 1500;
                canvas.height = 1000;
                const ctx = canvas.getContext('2d');
                
                draw2DChargerCharts(ctx, canvas.width, canvas.height);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                
                const geo = new THREE.PlaneGeometry(1.5, 1.0);
                const mat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true, 
                    side: THREE.DoubleSide 
                });
                const panel = new THREE.Mesh(geo, mat);
                
                // Position on south side of map (opposite control panel which is north)
                panel.position.set(
                    userX,
                    floorY + 0.80,
                    userZ + (MAP_SIZE / 2 + 0.10)  // South side
                );
                panel.lookAt(new THREE.Vector3(userX, floorY + 0.80, userZ));
                
                panel.userData.canvas = canvas;
                panel.userData.ctx = ctx;
                
                return panel;
            }

            function draw2DChargerCharts(ctx, W, H) {
                // Background
                ctx.fillStyle = 'rgba(15,15,30,0.95)';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, W-4, H-4);
                
                // Title
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('EV CHARGING ANALYTICS', W/2, 42);
                
                // Separator
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                ctx.beginPath(); 
                ctx.moveTo(20, 55); 
                ctx.lineTo(W-20, 55); 
                ctx.stroke();
                
                const chartY = 80;
                const chartH = (H - chartY - 40) / 3;
                
                // Chart 1: Battery Level vs Range
                drawBatteryRangeChart(ctx, 30, chartY, W - 60, chartH - 20);
                
                // Chart 2: Charging Session History
                drawChargingHistoryChart(ctx, 30, chartY + chartH, W - 60, chartH - 20);
                
                // Chart 3: Cost Analysis
                drawCostAnalysisChart(ctx, 30, chartY + chartH * 2, W - 60, chartH - 20);
            }

            function drawBatteryRangeChart(ctx, x, y, w, h) {
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Battery Level vs Predicted Range', x, y + 24);
                
                // Chart area
                const chartX = x + 10;
                const chartY = y + 40;
                const chartW = w - 20;
                const chartH = h - 50;
                
                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 5; i++) {
                    const yPos = chartY + (i / 5) * chartH;
                    ctx.beginPath();
                    ctx.moveTo(chartX, yPos);
                    ctx.lineTo(chartX + chartW, yPos);
                    ctx.stroke();
                }
                
                // Generate battery curve (historical + prediction)
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 3;
                ctx.beginPath();
                const points = 50;
                for (let i = 0; i <= points; i++) {
                    const t = i / points;
                    const battery = 100 - t * 85; // 100% down to 15%
                    const range = battery * 3.5; // ~350km at 100%
                    const px = chartX + t * chartW;
                    const py = chartY + chartH - (range / 350) * chartH;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                
                // Prediction zone (dashed)
                ctx.strokeStyle = '#ffaa00';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                const predStart = 0.7;
                for (let i = 0; i <= 15; i++) {
                    const t = predStart + (i / 15) * (1 - predStart);
                    const battery = 100 - t * 85;
                    const range = battery * 3.5 + Math.sin(i) * 15;
                    const px = chartX + t * chartW;
                    const py = chartY + chartH - (range / 350) * chartH;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Y-axis labels
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'right';
                for (let i = 0; i <= 5; i++) {
                    const range = (i / 5) * 350;
                    const yPos = chartY + chartH - (i / 5) * chartH;
                    ctx.fillText(`${range.toFixed(0)}km`, chartX - 5, yPos + 5);
                }
            }

            function drawChargingHistoryChart(ctx, x, y, w, h) {
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Last 10 Charging Sessions', x, y + 24);
                
                const chartX = x + 10;
                const chartY = y + 40;
                const chartW = w - 20;
                const chartH = h - 50;
                
                // Bars for last 10 sessions
                const numBars = 10;
                const barW = chartW / (numBars + 1);
                
                for (let i = 0; i < numBars; i++) {
                    const energy = 20 + Math.random() * 60; // 20-80 kWh
                    const barH = (energy / 80) * chartH;
                    const barX = chartX + (i + 0.5) * barW;
                    const barY = chartY + chartH - barH;
                    
                    // Gradient bar
                    const gradient = ctx.createLinearGradient(barX, barY, barX, barY + barH);
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#008855');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(barX, barY, barW * 0.7, barH);
                    
                    // Value label
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${energy.toFixed(0)}`, barX + barW * 0.35, barY - 5);
                }
                
                // Y-axis label
                ctx.save();
                ctx.translate(chartX - 30, chartY + chartH/2);
                ctx.rotate(-Math.PI/2);
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Energy (kWh)', 0, 0);
                ctx.restore();
            }

            function drawCostAnalysisChart(ctx, x, y, w, h) {
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Monthly Cost Breakdown', x, y + 24);
                
                const centerX = x + w / 3;
                const centerY = y + h / 2 + 20;
                const radius = Math.min(w, h) / 3;
                
                // Pie chart data
                const costs = [
                    { label: 'Charging', value: 120, color: '#00ff88' },
                    { label: 'Network Fee', value: 25, color: '#ffaa00' },
                    { label: 'Peak Hours', value: 45, color: '#ff6600' },
                    { label: 'Parking', value: 30, color: '#00ccff' }
                ];
                const total = costs.reduce((sum, c) => sum + c.value, 0);
                
                // Draw pie
                let startAngle = -Math.PI / 2;
                costs.forEach((cost, i) => {
                    const sliceAngle = (cost.value / total) * Math.PI * 2;
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                    ctx.closePath();
                    ctx.fillStyle = cost.color;
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    startAngle += sliceAngle;
                });
                
                // Legend
                const legendX = x + w * 0.6;
                const legendY = y + 60;
                ctx.textAlign = 'left';
                costs.forEach((cost, i) => {
                    const ly = legendY + i * 35;
                    
                    // Color box
                    ctx.fillStyle = cost.color;
                    ctx.fillRect(legendX, ly - 12, 20, 20);
                    
                    // Label
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '18px Arial';
                    ctx.fillText(`${cost.label}: £${cost.value}`, legendX + 30, ly + 5);
                });
                
                // Total
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(`Total: £${total}/month`, legendX, legendY + costs.length * 35 + 20);
            }

            function update2DChargerPanel() {
                if (!charger2DPanel || !isChargerModeActive) return;
                
                // Redraw with latest data
                const ctx = charger2DPanel.userData.ctx;
                const canvas = charger2DPanel.userData.canvas;
                draw2DChargerCharts(ctx, canvas.width, canvas.height);
                charger2DPanel.material.map.needsUpdate = true;
            }

            // ─── MAIN ANIMATION LOOP ──────────────────────────────────────────────────────
            function animate(timestamp, frame) {
                if (!frame) return;

                const session = renderer.xr.getSession();
                if (!session) return;

                // Get reference space
                if (!refSpace) {
                    refSpace = renderer.xr.getReferenceSpace();
                }
                if (!refSpace) return;

                // Floor detection
                if (!floorDetected) detectFloor(frame, refSpace);

                // Hit test setup (for Mode 5)
                if (!hitTestSourceRequested && floorDetected) {
                    session.requestReferenceSpace('viewer').then(vs => {
                        session.requestHitTestSource({ space: vs }).then(src => {
                            hitTestSource = src;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                // Update reticle (Mode 5)
                if (hitTestSource && anchorTrackingActive) {
                    const hitResults = frame.getHitTestResults(hitTestSource);
                    if (hitResults.length > 0) {
                        const hit = hitResults[0];
                        const pose = hit.getPose(refSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                } else if (!anchorTrackingActive) {
                    reticle.visible = false;
                }

                // Process controller inputs
                if (floorDetected && session.inputSources) {
                    session.inputSources.forEach((source) => {
                        const gamepad = source.gamepad;
                        if (!gamepad) return;

                        if (source.handedness === 'left') {
                            const leftTrigger = gamepad.buttons[0]?.pressed || false;
                            const xButton    = gamepad.buttons[4]?.pressed || false;
                            const axes = gamepad.axes;

                            // Mode 6: 3D Graph controls
                            if (controlMode === 6 && isChargerModeActive) {
                                // Left joystick (axes[2], axes[3]) - Rotate 3D graph
                                if (axes && axes.length >= 4) {
                                    const joyX = axes[2]; // Horizontal
                                    const joyY = axes[3]; // Vertical
                                    
                                    // Rotate graph with joystick
                                    if (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1) {
                                        charger3DRotation.y += joyX * 0.02;  // Yaw
                                        charger3DRotation.x += joyY * 0.02;  // Pitch
                                        // Clamp pitch to prevent flipping
                                        charger3DRotation.x = Math.max(-0.8, Math.min(0.8, charger3DRotation.x));
                                    }
                                }
                                
                                // Left trigger (squeeze) - Zoom
                                if (leftTrigger) {
                                    charger3DZoom = Math.min(2.0, charger3DZoom + 0.02); // Zoom in
                                } else if (gamepad.buttons[1]?.pressed) { // Left grip
                                    charger3DZoom = Math.max(0.5, charger3DZoom - 0.02); // Zoom out
                                }
                                
                                // X button - Reset view
                                if (xButton && !lastXButton) {
                                    charger3DRotation = { x: 0, y: 0 };
                                    charger3DZoom = 1.0;
                                    debugLog('Mode 6: 3D graph view reset', 'INFO');
                                }
                                
                                update3DChargerGraph();
                            }

                            // X button stops Mode 4 tracking
                            if (xButton && !lastXButton && isTrackingRobot) {
                                stopRobotTracking();
                            }
                            lastXButton = xButton;
                        }

                        if (source.handedness === 'right') {
                            const trigger    = gamepad.buttons[0]?.pressed || false;
                            const grip       = gamepad.buttons[1]?.pressed || false;
                            const thumbstick = gamepad.buttons[3]?.pressed || false;
                            const aButton    = gamepad.buttons[4]?.pressed || false;
                            const bButton    = gamepad.buttons[5]?.pressed || false;
                            const axes = gamepad.axes;

                            // RIGHT TRIGGER: Panel interactions (Mode + Vehicle selection)
                            if (trigger && !lastRightTriggerPanel && controller1) {
                                checkControlPanelInteraction(controller1);
                                checkVehiclePanelInteraction(controller1);
                                
                                // Check Mode 2 left panel
                                if (controlMode === 2 && mode2LeftPanel) {
                                    const raycaster = new THREE.Raycaster();
                                    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller1.quaternion);
                                    raycaster.set(controller1.position, dir);
                                    const hits = raycaster.intersectObject(mode2LeftPanel);
                                    if (hits.length > 0) {
                                        checkMode2LeftPanelClick(hits[0].uv);
                                    }
                                }
                                
                                // Check Mode 3 left panel
                                if (controlMode === 3 && mode3LeftPanel) {
                                    const raycaster = new THREE.Raycaster();
                                    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller1.quaternion);
                                    raycaster.set(controller1.position, dir);
                                    const hits = raycaster.intersectObject(mode3LeftPanel);
                                    if (hits.length > 0) {
                                        checkMode3LeftPanelClick(hits[0].uv);
                                    }
                                }
                            }
                            lastRightTriggerPanel = trigger;

                            // Mode 1: Manual Control - Right joystick drives robot
                            if (controlMode === 1 && isManualControlActive) {
                                if (axes && axes.length >= 4) {
                                    const joyX = axes[2]; // Right joystick horizontal (turn)
                                    const joyY = axes[3]; // Right joystick vertical (forward/back)
                                    
                                    // Invert Y axis (joystick forward is negative)
                                    processJoystickInput(-joyY, joyX);
                                }
                                
                                // A/B buttons control gripper (SERVO1 on pin 8)
                                processGripperButtons(aButton, bButton);
                            }

                            if (controlMode === 2) {
                                // Two-stage drawing: First trigger arms, second trigger (after 1s) starts
                                if (trigger && !isApproved && !isSent) {
                                    if (!drawingArmed) {
                                        // First trigger press - ARM drawing mode
                                        drawingArmed = true;
                                        drawingArmTime = performance.now();
                                        debugLog('Mode 2: Drawing ARMED, press trigger again to start', 'INFO');
                                    } else if (performance.now() - drawingArmTime > 1000) {
                                        // Second trigger after 1 second - START drawing
                                        if (!isDrawing) {
                                            isDrawing = true;
                                            debugLog('Mode 2: Drawing STARTED', 'INFO');
                                        }
                                        // Find intersect point on floor plane
                                        if (controller1) {
                                            const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -floorY);
                                            const ray = new THREE.Raycaster();
                                            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller1.quaternion);
                                            ray.set(controller1.position, dir);
                                            const target = new THREE.Vector3();
                                            ray.ray.intersectPlane(floorPlane, target);
                                            if (target.lengthSq() > 0) addPoint(target);
                                        }
                                    }
                                } else {
                                    if (isDrawing) {
                                        isDrawing = false;
                                        debugLog('Mode 2: Drawing STOPPED', 'INFO');
                                    }
                                }
                                // Grip and thumbstick still work for quick controls
                                if (thumbstick && !lastThumbstick && !isApproved) deleteLast();
                                lastThumbstick = thumbstick;
                                if (aButton && !lastAButton && isApproved && !isSent) sendTrajectory();
                                lastAButton = aButton;
                            }

                            if (controlMode === 5) {
                                // Place anchor on right trigger press
                                if (trigger && !lastRightTrigger && anchorTrackingActive) {
                                    placeAnchorAtReticle();
                                }
                                lastRightTrigger = trigger;
                            }

                            if (controlMode === 6) {
                                // Select charger on right trigger press
                                if (trigger && !lastRightTrigger && controller1) {
                                    checkChargerSelection(controller1);
                                }
                                lastRightTrigger = trigger;
                            }
                        }

                        // Mode 4: Track left controller with Kalman
                        if (source.handedness === 'left' && isTrackingRobot && source.gripSpace) {
                            debugLog('Mode 4: Left controller detected and tracking!', 'INFO');
                            
                            const gripPose = frame.getPose(source.gripSpace, refSpace);
                            if (gripPose) {
                                const pos = gripPose.transform.position;
                                const ori = gripPose.transform.orientation;

                                // Extract raw controller position (including Y for triangle marker)
                                const rawY = pos.y;
                                
                                // Heading from quaternion (yaw only)
                                const qx = ori.x, qy = ori.y, qz = ori.z, qw = ori.w;
                                const rawHeading = Math.atan2(2*(qw*qy + qx*qz), 1 - 2*(qy*qy + qz*qz));
                                const rawDeg = (rawHeading * 180 / Math.PI + 360) % 360;

                                // Kalman filter for SMOOTH tracking
                                const fx = kfX.update(pos.x);
                                const fz = kfZ.update(pos.z);
                                const filtHeading = kfH.update(rawDeg);

                                // Update triangle marker - SMOOTH filtered position at actual controller height
                                if (triangleMarker) {
                                    triangleMarker.position.set(fx, rawY, fz);
                                    triangleMarker.rotation.y = filtHeading * Math.PI / 180;
                                }
                                
                                // Update green cone icon - filtered position, above vehicle
                                if (robotIcon) {
                                    robotIcon.position.set(fx, floorY + 0.20, fz);
                                    robotIcon.rotation.y = filtHeading * Math.PI / 180;
                                }
                                
                                // Update ROBOT if it's the current vehicle
                                if (currentVehicle === 'robot' && mode0Robot) {
                                    const wheelOffset = 0.04;
                                    mode0Robot.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    mode0Robot.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                    
                                    // Log every 60 frames (~1 second)
                                    if (Math.random() < 0.016) {
                                        debugLog(`Mode 4: Robot tracking - pos:(${fx.toFixed(2)}, ${fz.toFixed(2)}), heading:${filtHeading.toFixed(1)}°`, 'INFO');
                                    }
                                }
                                
                                // Update TRUCK if it's the current vehicle
                                if (currentVehicle === 'truck' && mode0Truck) {
                                    const wheelOffset = 0.04;
                                    mode0Truck.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    mode0Truck.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                    
                                    // Log every 60 frames (~1 second)
                                    if (Math.random() < 0.016) {
                                        debugLog(`Mode 4: Truck tracking - pos:(${fx.toFixed(2)}, ${fz.toFixed(2)}), heading:${filtHeading.toFixed(1)}°`, 'INFO');
                                    }
                                }

                                const dist_cm = Math.sqrt((fx - userX)**2 + (fz - userZ)**2) / MAP_SIZE * 200;
                                updateRobotChart(performance.now() / 1000, dist_cm, filtHeading);
                            }
                        }

                        // Mode 1: Track left controller for manual control (overlay virtual on real robot)
                        if (source.handedness === 'left' && mode1LeftTracking && source.gripSpace) {
                            const gripPose = frame.getPose(source.gripSpace, refSpace);
                            if (gripPose) {
                                const pos = gripPose.transform.position;
                                const ori = gripPose.transform.orientation;

                                // Kalman filter for smooth tracking
                                const fx = kfX.update(pos.x);
                                const fz = kfZ.update(pos.z);
                                
                                // Heading from quaternion
                                const qx = ori.x, qy = ori.y, qz = ori.z, qw = ori.w;
                                const rawHeading = Math.atan2(2*(qw*qy + qx*qz), 1 - 2*(qy*qy + qz*qz));
                                const rawDeg = (rawHeading * 180 / Math.PI + 360) % 360;
                                const filtHeading = kfH.update(rawDeg);

                                // Update marker position (left hand position in air)
                                if (mode1LeftMarker) {
                                    mode1LeftMarker.position.set(fx, pos.y, fz);
                                    mode1LeftMarker.rotation.y = filtHeading * Math.PI / 180;
                                }
                                
                                // Update ROBOT if it's the current vehicle (overlay on real robot)
                                if (currentVehicle === 'robot' && mode0Robot) {
                                    const wheelOffset = 0.04;
                                    mode0Robot.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    mode0Robot.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                }
                                
                                // Update TRUCK if it's the current vehicle (overlay on real robot)
                                if (currentVehicle === 'truck' && mode0Truck) {
                                    const wheelOffset = 0.04;
                                    mode0Truck.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    mode0Truck.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                }
                            }
                        }

                        // Mode 2: Track left controller after trajectory approval
                        if (source.handedness === 'left' && mode2TrackingActive && source.gripSpace) {
                            const gripPose = frame.getPose(source.gripSpace, refSpace);
                            if (gripPose) {
                                const pos = gripPose.transform.position;
                                const ori = gripPose.transform.orientation;

                                // Kalman filter for smooth tracking
                                const fx = kfX.update(pos.x);
                                const fz = kfZ.update(pos.z);
                                
                                // Heading from quaternion
                                const qx = ori.x, qy = ori.y, qz = ori.z, qw = ori.w;
                                const rawHeading = Math.atan2(2*(qw*qy + qx*qz), 1 - 2*(qy*qy + qz*qz));
                                const rawDeg = (rawHeading * 180 / Math.PI + 360) % 360;
                                const filtHeading = kfH.update(rawDeg);
                                
                                // Update ROBOT position
                                if (currentVehicle === 'robot' && mode0Robot) {
                                    const wheelOffset = 0.04;
                                    mode0Robot.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    mode0Robot.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                }
                                
                                // Update TRUCK position
                                if (currentVehicle === 'truck' && mode0Truck) {
                                    const wheelOffset = 0.04;
                                    mode0Truck.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                    mode0Truck.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                }
                                
                                // Add to orange path
                                updateMode2ControllerPath(new THREE.Vector3(fx, floorY + 0.001, fz));
                            }
                        }

                        // Mode 3: Track left controller in REAL and VIRTUAL modes (NOT in simulation)
                        if (source.handedness === 'left' && controlMode === 3 && !mode3SimulationActive && source.gripSpace) {
                            // Track in REAL mode OR VIRTUAL mode (when tracking is active)
                            const shouldTrack = (mode3Mode === 'real') || (mode3Mode === 'virtual' && mode3TrackingActive);
                            
                            if (shouldTrack) {
                                const gripPose = frame.getPose(source.gripSpace, refSpace);
                                if (gripPose) {
                                    const pos = gripPose.transform.position;
                                    const ori = gripPose.transform.orientation;

                                    // Kalman filter for smooth tracking
                                    const fx = kfX.update(pos.x);
                                    const fz = kfZ.update(pos.z);
                                    
                                    // Heading from quaternion
                                    const qx = ori.x, qy = ori.y, qz = ori.z, qw = ori.w;
                                    const rawHeading = Math.atan2(2*(qw*qy + qx*qz), 1 - 2*(qy*qy + qz*qz));
                                    const rawDeg = (rawHeading * 180 / Math.PI + 360) % 360;
                                    const filtHeading = kfH.update(rawDeg);
                                    
                                    // Update ROBOT position
                                    if (currentVehicle === 'robot' && mode0Robot) {
                                        const wheelOffset = 0.04;
                                        mode0Robot.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                        mode0Robot.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                    }
                                    
                                    // Update TRUCK position
                                    if (currentVehicle === 'truck' && mode0Truck) {
                                        const wheelOffset = 0.04;
                                        mode0Truck.position.set(fx, floorY + 0.001 + wheelOffset, fz);
                                        mode0Truck.rotation.y = (filtHeading * Math.PI / 180) + (Math.PI / 2);
                                    }
                                    
                                    // Add to orange path ONLY in VIRTUAL mode
                                    if (mode3Mode === 'virtual') {
                                        updateMode3ControllerPath(new THREE.Vector3(fx, floorY + 0.001, fz));
                                    }
                                }
                            }
                        }
                    });
                }

                // Rotate chart axes slowly for visibility
                if (chart3DAxes) chart3DAxes.rotation.y += 0.002;

                // Animate charger markers (Mode 6)
                if (isChargerModeActive) {
                    animateChargerMarkers(timestamp);
                }

                renderer.render(scene, camera);
            }

            init();
        </script>
    </body>
</html>
