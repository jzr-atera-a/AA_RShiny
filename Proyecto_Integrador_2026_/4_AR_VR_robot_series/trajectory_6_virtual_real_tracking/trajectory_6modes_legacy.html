            function drawVehiclePanel(ctx, W, H) {
                ctx.clearRect(0, 0, W, H);
                
                // Background with gradient
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, 'rgba(10,10,20,0.95)');
                grad.addColorStop(1, 'rgba(5,5,15,0.95)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Border
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, W-4, H-4);
                
                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('VEHICLE', W/2, 35);
                
                // Separator
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(20, 50);
                ctx.lineTo(W-20, 50);
                ctx.stroke();
                
                // Vehicle options
                const vehicles = [
                    { name: 'Robot', type: 'robot', y: 80 },
                    { name: 'Truck', type: 'truck', y: 200 }
                ];
                
                const rowH = 120;
                vehicles.forEach((veh, i) => {
                    const y = veh.y;
                    const isSelected = selectedVehicle === veh.type;  // UI selection
                    const isActive = currentVehicle === veh.type;      // Actually active
                    
                    // Row background
                    if (isSelected) {
                        ctx.fillStyle = 'rgba(0, 200, 255, 0.2)';  // Blue for selected
                        ctx.fillRect(10, y, W-20, rowH);
                    }
                    
                    // Border
                    ctx.strokeStyle = isSelected ? '#00ccff' : '#666666';
                    ctx.lineWidth = isSelected ? 3 : 2;
                    ctx.strokeRect(10, y, W-20, rowH);
                    
                    // Icon (simple representation)
                    ctx.fillStyle = isSelected ? '#00ccff' : '#888888';
                    ctx.font = 'bold 36px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(veh.type === 'robot' ? '🤖' : '🚛', W/2, y + 50);
                    
                    // Name
                    ctx.fillStyle = isSelected ? '#ffffff' : '#888888';
                    ctx.font = 'bold 24px Arial';
                    ctx.fillText(veh.name, W/2, y + 90);
                    
                    // ACTIVE badge (only for actually active vehicle)
                    if (isActive) {
                        ctx.fillStyle = '#00ff66';
                        ctx.font = 'bold 16px Arial';
                        ctx.fillText('✓ ACTIVE', W/2, y + 110);
                    }
                });
                
                // APPROVE button
                const btnY = 340;
                ctx.fillStyle = vehicleApprovePressed ? '#333333' : '#226622';
                ctx.fillRect(30, btnY, W-60, 50);
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 3;
                ctx.strokeRect(30, btnY, W-60, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('APPROVE', W/2, btnY + 33);
                
                if (vehiclePanel && vehiclePanel.material && vehiclePanel.material.map) {
                    vehiclePanel.material.map.needsUpdate = true;
                }
            }

            function checkVehiclePanelInteraction(controller) {
                if (!vehiclePanel) return;
                const ray = new THREE.Raycaster();
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion);
                ray.set(controller.position, dir);
                const hits = ray.intersectObject(vehiclePanel);
                if (hits.length === 0) return;
                const uv = hits[0].uv;
                if (!uv) return;
                
                const uvY = 1.0 - uv.y;
                
                // Check vehicle rows - update SELECTED vehicle (not active yet)
                const vehicles = [
                    { type: 'robot', y1: 80/600, y2: 200/600 },
                    { type: 'truck', y1: 200/600, y2: 320/600 }
                ];
                
                for (const veh of vehicles) {
                    if (uvY >= veh.y1 && uvY <= veh.y2) {
                        selectedVehicle = veh.type;  // Just highlight selection
                        vehicleApprovePressed = false;
                        drawVehiclePanel(vehiclePanel.userData.ctx, 600, 600);
                        return;
                    }
                }
                
                // Check APPROVE button - actually switch to selected vehicle
                const approveY1 = 340/600;
                const approveY2 = 390/600;
                if (uvY >= approveY1 && uvY <= approveY2) {
                    vehicleApprovePressed = true;
                    drawVehiclePanel(vehiclePanel.userData.ctx, 600, 600);
                    
                    // Actually switch to the selected vehicle
                    switchToVehicle(selectedVehicle).then(() => {
                        debugLog(`Vehicle switched to: ${selectedVehicle}`, 'INFO');
                    }).catch(err => {
                        debugLog(`Vehicle switch error: ${err}`, 'ERROR');
                    });
                }
            }

            function drawControlPanel(ctx, W, H) {
                ctx.clearRect(0, 0, W, H);

                // Background
                ctx.fillStyle = 'rgba(15,15,30,0.95)';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, W-4, H-4);

                // Title
                ctx.fillStyle = '#00ccff';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ROBOT CONTROL MODE', W/2, 42);

                // Separator
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(20, 55); ctx.lineTo(W-20, 55); ctx.stroke();

                const modes = [
                    { num: '0', title: 'R Vehicle Map View', desc: 'View R Vehicle and M25 London' },
                    { num: '1', title: 'Manual', desc: 'Joystick' },
                    { num: '2', title: 'Trajectory', desc: 'Draw path' },
                    { num: '3', title: 'M25 Auto', desc: 'Sevenoaks' },
                    { num: '4', title: 'Ctrl Track', desc: 'Left Kalman' },
                    { num: '5', title: 'Anchor', desc: 'Spatial' },
                    { num: '6', title: 'EV Chargers', desc: 'Live Status' }
                ];

                const rowH = 120;
                modes.forEach((m, i) => {
                    const y = 70 + i * rowH;
                    const isActive = (controlMode === i);

                    // Row background
                    ctx.fillStyle = isActive ? 'rgba(0,255,100,0.18)' : 'rgba(255,255,255,0.04)';
                    ctx.fillRect(16, y, W-32, rowH - 8);
                    ctx.strokeStyle = isActive ? '#00ff66' : '#444466';
                    ctx.lineWidth = isActive ? 3 : 1;
                    ctx.strokeRect(16, y, W-32, rowH - 8);

                    // Radio button
                    ctx.strokeStyle = isActive ? '#00ff66' : '#888888';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(48, y + 46, 16, 0, Math.PI * 2);
                    ctx.stroke();
                    if (isActive) {
                        ctx.fillStyle = '#00ff66';
                        ctx.beginPath();
                        ctx.arc(48, y + 46, 10, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Mode number + title (single line)
                    ctx.fillStyle = isActive ? '#00ff66' : '#ffffff';
                    ctx.font = `bold 28px Arial`;
                    ctx.textAlign = 'left';
                    ctx.fillText(`${m.num}. ${m.title}`, 76, y + 48);

                    // Description
                    ctx.fillStyle = isActive ? '#aaffcc' : '#aaaaaa';
                    ctx.font = '20px Arial';
                    ctx.fillText(m.desc, 76, y + 76);

                    // ACTIVE badge
                    if (isActive) {
                        ctx.fillStyle = '#00ff66';
                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'right';
                        ctx.fillText('✓ ACTIVE', W - 24, y + 48);
                        ctx.textAlign = 'left';
                    }
                });

                // APPROVE button
                const btnY = 70 + 7 * rowH + 10;
                ctx.fillStyle = approvePressed ? '#333333' : '#226622';
                ctx.fillRect(30, btnY, W-60, 60);
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 3;
                ctx.strokeRect(30, btnY, W-60, 60);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('APPROVE', W/2, btnY + 42);

                if (controlPanel && controlPanel.material && controlPanel.material.map) {
                    controlPanel.material.map.needsUpdate = true;
                }
            }

            // ─── PANEL INTERACTION ────────────────────────────────────────────────────────
            function checkControlPanelInteraction(controller) {
                if (!controlPanel) return;
                const ray = new THREE.Raycaster();
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion);
                ray.set(controller.position, dir);
                const hits = ray.intersectObject(controlPanel);
                if (hits.length === 0) return;
                const uv = hits[0].uv;
                if (!uv) return;

                const totalModeRows = 7; // Updated from 6 to 7
                const rowH = 120 / 1000;  // per-mode row height in UV (updated for new canvas height)
                const topOffset = 70 / 1000; // updated for new layout

                // Check mode rows
                for (let i = 0; i < totalModeRows; i++) {
                    const y1 = topOffset + i * rowH;
                    const y2 = y1 + rowH;
                    const uvY = 1.0 - uv.y; // flip Y
                    if (uvY >= y1 && uvY <= y2) {
                        controlMode = i; // Mode 0-5
                        approvePressed = false;
                        drawControlPanel(controlPanel.userData.ctx, 1500, 1000);
                        document.getElementById('mode-status').textContent = `MODE ${controlMode}`;
                        return;
                    }
                }

                // APPROVE button (updated for 7 modes)
                const approveY1 = (70 + 7 * 120 + 10) / 1000;
                const approveY2 = approveY1 + (60 / 1000);
                const uvY = 1.0 - uv.y;
                if (uvY >= approveY1 && uvY <= approveY2) {
                    approvePressed = true;
                    drawControlPanel(controlPanel.userData.ctx, 1500, 1000);
                    executeMode(controlMode);
                }
            }

            function executeMode(mode) {
                debugLog(`=== EXECUTE MODE ${mode} ===`, 'INFO');
                debugLog(`Current vehicle: ${currentVehicle}`, 'INFO');
                
                // ALWAYS show current vehicle in ALL modes
                if (currentVehicle === 'robot') {
                    showMode0Robot();
                    debugLog('Robot should be visible now', 'INFO');
                } else {
                    showMode0Truck();
                    debugLog('Truck should be visible now', 'INFO');
                }

                // Hide all left panels first
                if (mode2LeftPanel) { 
                    scene.remove(mode2LeftPanel); 
                    mode2LeftPanel = null; 
                }
                if (mode3LeftPanel) { 
                    scene.remove(mode3LeftPanel); 
                    mode3LeftPanel = null; 
                }
                
                // Clear Mode 2/3 paths when switching modes
                if (mode !== 2) {
                    mode2TrackingActive = false;
                    mode2ControllerPath = [];
                    if (mode2ControllerLine) {
                        scene.remove(mode2ControllerLine);
                        mode2ControllerLine = null;
                    }
                    // Remove grid and RESTORE map when LEAVING Mode 2
                    removeMode2Grid();
                    if (mapPlane && !mapPlane.parent) {
                        scene.add(mapPlane);
                        debugLog('Mode 2 exit: Map RE-ADDED to scene', 'INFO');
                    }
                }
                if (mode !== 3) {
                    mode3TrackingActive = false;
                    mode3SimulationActive = false;
                    if (mode3SimulationInterval) {
                        clearInterval(mode3SimulationInterval);
                        mode3SimulationInterval = null;
                    }
                    mode3ControllerPath = [];
                    if (mode3ControllerLine) {
                        scene.remove(mode3ControllerLine);
                        mode3ControllerLine = null;
                    }
                }

                // Mode 0 doesn't need websocket
                if (mode === 0) {
                    // Stop Mode 4 tracking if active
                    if (isTrackingRobot) stopRobotTracking();
                    document.getElementById('trajectory-status').textContent = 'MAP VIEW ACTIVE';
                    return;
                }

                // Mode 4 and 5 don't need websocket - start tracking immediately
                if (mode === 4) {
                    // Stop other modes before starting Mode 4
                    if (isManualControlActive) stopManualControl();
                    if (isChargerModeActive) stopChargerMode();
                    startRobotTracking();
                    return;
                }
                
                if (mode === 5) {
                    // Stop other modes before starting Mode 5
                    if (isTrackingRobot) stopRobotTracking();
                    if (isManualControlActive) stopManualControl();
                    if (isChargerModeActive) stopChargerMode();
                    startAnchorTracking();
                    return;
                }

                if (!websocket || websocket.readyState !== WebSocket.OPEN) return;

                const modeNames = {
                    0: 'R Vehicle Map View',
                    1: 'Manual Control',
                    2: 'User Trajectory',
                    3: 'M25 Highway',
                    4: 'Track Robot (Controller)',
                    5: 'Spatial Anchor Tracking',
                    6: 'EV Charger Status'
                };

                websocket.send(JSON.stringify({
                    command: 'MODE_SELECTED',
                    mode,
                    mode_name: modeNames[mode],
                    timestamp: performance.now()
                }));

                // Stop all active modes first
                if (isManualControlActive) stopManualControl();
                if (isTrackingRobot) stopRobotTracking();
                if (anchorTrackingActive) anchorTrackingActive = false;
                if (isChargerModeActive) stopChargerMode();

                if (mode === 1) startManualControl();
                
                // Mode 2: Show left panel + grid, hide map
                if (mode === 2) {
                    // Clear old trajectory data from previous sessions
                    trajectoryPoints = [];
                    totalDistance = 0;
                    isApproved = false;
                    isSent = false;
                    isDrawing = false;
                    drawingArmed = false;  // Reset armed state
                    
                    // Clear trajectory line
                    if (trajectoryLine) {
                        scene.remove(trajectoryLine);
                        trajectoryLine = null;
                    }
                    
                    // Clear controller path
                    mode2ControllerPath = [];
                    if (mode2ControllerLine) {
                        scene.remove(mode2ControllerLine);
                        mode2ControllerLine = null;
                    }
                    
                    // Update UI
                    document.getElementById('point-count').textContent = '0';
                    document.getElementById('path-distance').textContent = '0.00';
                    document.getElementById('trajectory-status').textContent = 'IDLE';
                    
                    // ACTUALLY REMOVE MAP FROM SCENE (not just hide)
                    if (mapPlane) {
                        scene.remove(mapPlane);
                        debugLog('Mode 2: Map REMOVED from scene', 'INFO');
                    }
                    createMode2Grid();
                    
                    // Create left panel
                    mode2LeftPanel = buildMode2LeftPanel();
                    mode2LeftPanel.position.set(userX - 1.1, floorY + 0.80, userZ - (MAP_SIZE/2 + 0.10));
                    mode2LeftPanel.rotation.y = 0;
                    scene.add(mode2LeftPanel);
                    
                    debugLog('Mode 2: Initialized - cleared old data, grid created', 'INFO');
                }
                
                if (mode === 3) {
                    // Mode 3: Show left panel
                    mode3LeftPanel = buildMode3LeftPanel();
                    mode3LeftPanel.position.set(userX - 1.1, floorY + 0.80, userZ - (MAP_SIZE/2 + 0.10));
                    mode3LeftPanel.rotation.y = 0;
                    scene.add(mode3LeftPanel);
                    debugLog('Mode 3: Left panel created', 'INFO');
                    
                    // Send M25 command
                    m25ChartData = [];
                    chartMaxSpeed = 1; chartMaxDist = 1;
                    websocket.send(JSON.stringify({
                        command: 'EXECUTE_M25',
                        start_location: 'Sevenoaks',
                        direction: 'clockwise'
                    }));
                }

                if (mode === 6) startChargerMode();
            }

            // ─── MODE 1: MANUAL CONTROL ──────────────────────────────────────────────────
            let isManualControlActive = false;
            let manualControlInterval = null;
            let lastJoystickForward = 0;
            let lastJoystickTurn = 0;
            let lastMotorSpeed = 0;      // Both motors same speed (MOTORS:XX command)
            let lastServo2 = 90;          // Servo2 (pin 9) - steering (50-130°)
            let lastServo1 = 90;          // Servo1 (pin 8) - gripper (40-140°)
            
            // Left controller tracking for Mode 1
            let mode1LeftTracking = false;
            let mode1LeftMarker = null;

            // ─── MODE 1: MANUAL CONTROL ──────────────────────────────────────────────────
            function startManualControl() {
                if (isManualControlActive) return;
                isManualControlActive = true;
                mode1LeftTracking = true;
                
                debugLog('Mode 1: Manual control started', 'INFO');
                
                // Create left controller marker (small green sphere at controller position)
                const geo = new THREE.SphereGeometry(0.05, 16, 16);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                mode1LeftMarker = new THREE.Mesh(geo, mat);
                scene.add(mode1LeftMarker);
                
                // Start sending commands at 5Hz
                manualControlInterval = setInterval(() => {
                    sendManualControlCommand();
                }, 200); // 5Hz = 200ms
                
                // Tell server to start logging
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        command: 'START_MANUAL_CONTROL'
                    }));
                }
                
                document.getElementById('tracking-status').textContent = 'MANUAL';
                document.getElementById('tracking-status').className = 'status-tracking';
            }

            function stopManualControl() {
                isManualControlActive = false;
                mode1LeftTracking = false;
                
                // Stop motors immediately
                sendStopCommand();
                
                // Clear interval
                if (manualControlInterval) {
                    clearInterval(manualControlInterval);
                    manualControlInterval = null;
                }
                
                // Remove marker
                if (mode1LeftMarker) {
                    scene.remove(mode1LeftMarker);
                    mode1LeftMarker = null;
                }
                
                // Tell server to stop logging
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        command: 'STOP_MANUAL_CONTROL'
                    }));
                }
                
                document.getElementById('tracking-status').textContent = 'OFF';
                document.getElementById('tracking-status').className = 'status-bad';
                
                debugLog('Mode 1: Manual control stopped', 'INFO');
            }

            function sendManualControlCommand() {
                if (!isManualControlActive || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                
                // Get left controller pose (if available)
                let leftX = 0, leftY = 0, leftZ = 0, leftHeading = 0;
                
                // This will be populated in the animation loop
                if (mode1LeftMarker) {
                    leftX = mode1LeftMarker.position.x;
                    leftY = mode1LeftMarker.position.y;
                    leftZ = mode1LeftMarker.position.z;
                    leftHeading = (mode1LeftMarker.rotation.y * 180 / Math.PI + 360) % 360;
                }
                
                // Convert to cm from map center
                const leftX_cm = ((leftX - userX) / MAP_SIZE * 200);
                const leftZ_cm = ((leftZ - userZ) / MAP_SIZE * 200);
                const leftY_cm = (leftY - floorY) * 100; // cm above floor
                
                // Send command
                websocket.send(JSON.stringify({
                    command: 'MANUAL_CONTROL',
                    data: {
                        timestamp: performance.now() / 1000,
                        left_x_cm: leftX_cm,
                        left_y_cm: leftY_cm,
                        left_z_cm: leftZ_cm,
                        left_heading_deg: leftHeading,
                        joystick_forward: lastJoystickForward,
                        joystick_turn: lastJoystickTurn,
                        motor_speed: lastMotorSpeed,  // Both motors same speed
                        servo2_angle: lastServo2,      // Steering (pin 9)
                        servo1_angle: lastServo1       // Gripper (pin 8)
                    }
                }));
            }

            function sendStopCommand() {
                lastJoystickForward = 0;
                lastJoystickTurn = 0;
                lastMotorSpeed = 0;
                lastServo2 = 90;  // Center steering
                lastServo1 = 90;  // Center gripper
                
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        command: 'MANUAL_CONTROL',
                        data: {
                            timestamp: performance.now() / 1000,
                            left_x_cm: 0,
                            left_y_cm: 0,
                            left_z_cm: 0,
                            left_heading_deg: 0,
                            joystick_forward: 0,
                            joystick_turn: 0,
                            motor_speed: 0,
                            servo2_angle: 90,
                            servo1_angle: 90
                        }
                    }));
                }
            }

            function processJoystickInput(forwardAxis, turnAxis) {
                // Dead zone
                const DEAD_ZONE = 0.1;
                
                // Apply dead zone
                const forward = Math.abs(forwardAxis) > DEAD_ZONE ? forwardAxis : 0;
                const turn = Math.abs(turnAxis) > DEAD_ZONE ? turnAxis : 0;
                
                lastJoystickForward = forward;
                lastJoystickTurn = turn;
                
                // Map forward (-1 to +1) to motor speed (0 to 80% - SAFETY LIMIT)
                // Original: 50-80% range when moving
                if (Math.abs(forward) > 0) {
                    // Scale to 50-80% range (SAFETY)
                    lastMotorSpeed = 50 + (Math.abs(forward) * 30);  // 50-80%
                } else {
                    lastMotorSpeed = 0;  // Stop
                }
                
                // Note: Original doesn't support reverse! Only forward motion
                // If you want reverse, need to update Arduino code
                
                // Map turn (-1 to +1) to servo2 angle (50° to 130°)
                // Original range: SERVO2_MIN=50, SERVO2_MAX=130
                // -1 = full left = 50°
                //  0 = straight = 90°
                // +1 = full right = 130°
                lastServo2 = 90 + (turn * 40);
                lastServo2 = Math.max(50, Math.min(130, lastServo2)); // Clamp to range
            }

            function processGripperButtons(aPressed, bPressed) {
                // A button: close gripper (decrease angle toward min)
                // B button: open gripper (increase angle toward max)
                const GRIPPER_STEP = 5;  // degrees per button press
                
                if (aPressed) {
                    lastServo1 = Math.max(40, lastServo1 - GRIPPER_STEP);  // Close
                } else if (bPressed) {
                    lastServo1 = Math.min(140, lastServo1 + GRIPPER_STEP);  // Open
                }
            }

            // ─── MODE 2: LEFT PANEL (TRAJECTORY CONTROLS) ────────────────────────────────
            let mode2LeftPanel = null;
            let mode2ControllerPath = [];  // Orange path from left controller
            let mode2ControllerLine = null;
            let mode2TrackingActive = false;
            let mode2GridPlane = null;  // White grid background
            let mode2UserMarkers = [];  // Green markers for user path
            let mode2ControllerMarkers = [];  // Orange markers for controller path
            let mode2UserMarkersGroup = null;  // THREE.Group for user markers
            let mode2ControllerMarkersGroup = null;  // THREE.Group for controller markers
            
            // ─── MODE 3: LEFT PANEL (M25 CONTROLS) ───────────────────────────────────────
            let mode3LeftPanel = null;
            let mode3Mode = 'real';  // 'real' or 'virtual'
            let mode3ControllerPath = [];  // Orange path
            let mode3ControllerLine = null;
            let mode3TrackingActive = false;
            let mode3SimulationActive = false;
            let mode3SimulationInterval = null;
            let mode3SimulationProgress = 0;  // 0-1 along M25
            
            // ─── MODE 2: TRAJECTORY ───────────────────────────────────────────────────────
            function addPoint(point) {
                if (isApproved || isSent) return;
                trajectoryPoints.push(point.clone());
                if (trajectoryPoints.length > 1) {
                    const last = trajectoryPoints[trajectoryPoints.length - 2];
                    totalDistance += point.distanceTo(last);
                }
                document.getElementById('point-count').textContent = trajectoryPoints.length;
                document.getElementById('path-distance').textContent = totalDistance.toFixed(2);
                updateTrajectoryLine();
            }

            function updateTrajectoryLine() {
                if (trajectoryLine) { scene.remove(trajectoryLine); trajectoryLine = null; }
                if (trajectoryPoints.length < 2) return;
                
                // Adjust all points to be ABOVE the grid
                const adjustedPoints = trajectoryPoints.map(p => new THREE.Vector3(p.x, floorY + 0.003, p.z));
                
                const geo = new THREE.BufferGeometry().setFromPoints(adjustedPoints);
                trajectoryLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 3 })); // GREEN
                scene.add(trajectoryLine);
                
                // Update markers ONLY while actively drawing
                // NOT on approval or initialization!
                if (isDrawing && trajectoryPoints.length >= 2) {
                    updateMode2UserMarkers();
                }
            }

            function approve() {
                isApproved = true;
                document.getElementById('trajectory-status').textContent = 'APPROVED';
                document.getElementById('trajectory-status').className = 'status-approved';
            }

            function deleteLast() {
                if (trajectoryPoints.length > 0) {
                    trajectoryPoints.pop();
                    document.getElementById('point-count').textContent = trajectoryPoints.length;
                    updateTrajectoryLine();
                }
            }

            function sendTrajectory() {
                if (!websocket || !isApproved || trajectoryPoints.length < 5) return;
                websocket.send(JSON.stringify({
                    command: 'GENERATE_COMMANDS',
                    trajectory: {
                        points: trajectoryPoints.map(p => ({ x: p.x, y: p.y, z: p.z })),
                        distance: totalDistance,
                        floorY
                    }
                }));
                isSent = true;
                document.getElementById('trajectory-status').textContent = 'SENT';
                document.getElementById('trajectory-status').className = 'status-sent';
            }

            // ─── MODE 2: LEFT PANEL FUNCTIONS ────────────────────────────────────────────
            function createMode2Grid() {
                // Guard: Don't recreate if grid already exists
                if (mode2GridPlane) {
                    debugLog('Mode 2: Grid already exists, skipping creation', 'INFO');
                    return;
                }
                
                // Create white background with 10cm x 10cm grid (black lines)
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                
                // White background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 2048, 2048);
                
                // Black grid lines
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                // Grid: MAP_SIZE = 2.1m, so 21x21 squares of 10cm each
                const gridSize = 21;  // 21 squares
                const cellSize = 2048 / gridSize;  // pixels per cell
                
                // Draw vertical lines
                for (let i = 0; i <= gridSize; i++) {
                    const x = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, 2048);
                    ctx.stroke();
                }
                
                // Draw horizontal lines
                for (let i = 0; i <= gridSize; i++) {
                    const y = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(2048, y);
                    ctx.stroke();
                }
                
                // Create texture and plane
                const texture = new THREE.CanvasTexture(canvas);
                const geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
                const mat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide,
                    transparent: false
                });
                
                mode2GridPlane = new THREE.Mesh(geo, mat);
                mode2GridPlane.rotation.x = -Math.PI / 2;
                mode2GridPlane.position.set(0, floorY + 0.002, 0);  // LOWER than map to avoid Z-fighting
                scene.add(mode2GridPlane);
                
                debugLog('Mode 2: Grid created (21x21, 10cm cells)', 'INFO');
            }
            
            function removeMode2Grid() {
                if (mode2GridPlane) {
                    scene.remove(mode2GridPlane);
                    mode2GridPlane = null;
                }
                
                // Remove markers
                if (mode2UserMarkersGroup) {
                    scene.remove(mode2UserMarkersGroup);
                    mode2UserMarkersGroup = null;
                }
                if (mode2ControllerMarkersGroup) {
                    scene.remove(mode2ControllerMarkersGroup);
                    mode2ControllerMarkersGroup = null;
                }
                mode2UserMarkers = [];
                mode2ControllerMarkers = [];
            }
            
            function createPathMarker(position, index, color) {
                // Create 4cm diameter empty circle with number
                const group = new THREE.Group();
                
                // Circle (4cm diameter = 0.04m)
                const circleGeo = new THREE.RingGeometry(0.018, 0.020, 32);
                const circleMat = new THREE.MeshBasicMaterial({ 
                    color: color, 
                    side: THREE.DoubleSide 
                });
                const circle = new THREE.Mesh(circleGeo, circleMat);
                circle.rotation.x = -Math.PI / 2;
                circle.position.y = 0.002;  // Slightly above grid
                group.add(circle);
                
                // Number text (using canvas texture)
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = color === 0x00ff00 ? '#00ff00' : '#ff8800';
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index.toString(), 64, 64);
                
                const textTexture = new THREE.CanvasTexture(canvas);
                const textGeo = new THREE.PlaneGeometry(0.03, 0.03);
                const textMat = new THREE.MeshBasicMaterial({ 
                    map: textTexture, 
                    transparent: true,
                    side: THREE.DoubleSide
                });
                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.rotation.x = -Math.PI / 2;
                textMesh.position.set(0.03, 0.003, 0);  // Next to circle
                group.add(textMesh);
                
                group.position.copy(position);
                return group;
            }
            
            function updateMode2UserMarkers() {
                // GUARD: Don't create ANY markers until user has actually drawn something
                if (trajectoryPoints.length < 2) {
                    debugLog('Mode 2: Not enough points for markers, skipping', 'INFO');
                    return;
                }
                
                // SAFETY: Verify we're in drawing mode
                if (!isDrawing) {
                    debugLog('Mode 2: Not drawing, skipping marker update', 'INFO');
                    return;
                }
                
                // Place markers every 20cm along user path (interpolated for precision)
                if (!mode2UserMarkersGroup) {
                    mode2UserMarkersGroup = new THREE.Group();
                    scene.add(mode2UserMarkersGroup);
                }
                
                // Clear existing markers
                while (mode2UserMarkersGroup.children.length > 0) {
                    mode2UserMarkersGroup.remove(mode2UserMarkersGroup.children[0]);
                }
                mode2UserMarkers = [];
                
                debugLog(`Mode 2: Creating markers from ${trajectoryPoints.length} points`, 'INFO');
                
                // First marker at start
                const firstMarker = createPathMarker(trajectoryPoints[0], 0, 0x00ff00);
                mode2UserMarkersGroup.add(firstMarker);
                mode2UserMarkers.push({
                    index: 0,
                    position: trajectoryPoints[0].clone(),
                    distance: 0,
                    gridX: Math.floor((trajectoryPoints[0].x + MAP_SIZE/2) / 0.1),
                    gridZ: Math.floor((trajectoryPoints[0].z + MAP_SIZE/2) / 0.1)
                });
                
                // Place markers at exact 20cm intervals (interpolated)
                let cumulativeDistance = 0;
                let nextMarkerDistance = 0.20;  // First marker after start
                let markerIndex = 1;
                
                for (let i = 1; i < trajectoryPoints.length; i++) {
                    const segmentStart = trajectoryPoints[i-1];
                    const segmentEnd = trajectoryPoints[i];
                    const segmentLength = segmentEnd.distanceTo(segmentStart);
                    const segmentStartDist = cumulativeDistance;
                    
                    cumulativeDistance += segmentLength;
                    
                    // Check if any markers fall within this segment
                    while (nextMarkerDistance <= cumulativeDistance) {
                        // Interpolate exact position at nextMarkerDistance
                        const distIntoSegment = nextMarkerDistance - segmentStartDist;
                        const t = distIntoSegment / segmentLength;  // 0 to 1
                        
                        const markerPos = new THREE.Vector3(
                            segmentStart.x + (segmentEnd.x - segmentStart.x) * t,
                            segmentStart.y + (segmentEnd.y - segmentStart.y) * t,
                            segmentStart.z + (segmentEnd.z - segmentStart.z) * t
                        );
                        
                        const marker = createPathMarker(markerPos, markerIndex, 0x00ff00);
                        mode2UserMarkersGroup.add(marker);
                        mode2UserMarkers.push({
                            index: markerIndex,
                            position: markerPos.clone(),
                            distance: nextMarkerDistance,
                            gridX: Math.floor((markerPos.x + MAP_SIZE/2) / 0.1),
                            gridZ: Math.floor((markerPos.z + MAP_SIZE/2) / 0.1)
                        });
                        
                        markerIndex++;
                        nextMarkerDistance += 0.20;  // Next marker 20cm later
                    }
                }
                
                // Last marker at end if >1cm from previous marker
                const lastPoint = trajectoryPoints[trajectoryPoints.length - 1];
                const distFromLastMarker = cumulativeDistance - mode2UserMarkers[mode2UserMarkers.length - 1].distance;
                
                if (distFromLastMarker > 0.01) {
                    const marker = createPathMarker(lastPoint, markerIndex, 0x00ff00);
                    mode2UserMarkersGroup.add(marker);
                    mode2UserMarkers.push({
                        index: markerIndex,
                        position: lastPoint.clone(),
                        distance: cumulativeDistance,
                        gridX: Math.floor((lastPoint.x + MAP_SIZE/2) / 0.1),

            function analyzeMode2Paths() {
                if (trajectoryPoints.length < 2 || mode2ControllerPath.length < 2) {
                    debugLog('Not enough data for analysis', 'ERROR');
                    return;
                }
                
                let analysis = '=== MODE 2 TRAJECTORY ANALYSIS ===\n';
                analysis += 'Purpose: DC Motor & Ackermann Servo Control Improvement\n\n';
                
                // Grid Information
                analysis += '--- GRID CONFIGURATION ---\n';
                analysis += 'Grid Size: 21x21 cells (10cm x 10cm each)\n';
                analysis += `Map Area: ${MAP_SIZE}m x ${MAP_SIZE}m\n`;
                analysis += 'Grid Origin: Bottom-left corner (0,0)\n\n';
                
                // User Path (Planned Route)
                analysis += '--- USER PATH (GREEN - PLANNED ROUTE) ---\n';
                analysis += `Total Points: ${trajectoryPoints.length}\n`;
                
                let userDist = 0;
                for (let i = 1; i < trajectoryPoints.length; i++) {
                    userDist += trajectoryPoints[i].distanceTo(trajectoryPoints[i-1]);
                }
                analysis += `Total Distance: ${userDist.toFixed(3)}m\n`;
                analysis += `Markers Placed: ${mode2UserMarkers.length}\n\n`;
                
                // User Markers Detail
                analysis += 'User Path Markers (every 20cm):\n';
                mode2UserMarkers.forEach(m => {
                    analysis += `  Marker ${m.index}: `;
                    analysis += `Grid(${m.gridX}, ${m.gridZ}), `;
                    analysis += `World(${m.position.x.toFixed(3)}, ${m.position.z.toFixed(3)}), `;
                    analysis += `Distance: ${m.distance.toFixed(3)}m\n`;
                });
                analysis += '\n';
                
                // Controller Path (Actual Execution)
                analysis += '--- CONTROLLER PATH (ORANGE - ACTUAL EXECUTION) ---\n';
                analysis += `Total Points: ${mode2ControllerPath.length}\n`;
                
                let controllerDist = 0;
                for (let i = 1; i < mode2ControllerPath.length; i++) {
                    controllerDist += mode2ControllerPath[i].distanceTo(mode2ControllerPath[i-1]);
                }
                analysis += `Total Distance: ${controllerDist.toFixed(3)}m\n`;
                analysis += `Markers Placed: ${mode2ControllerMarkers.length}\n\n`;
                
                // Controller Markers Detail
                analysis += 'Controller Path Markers (every 20cm):\n';
                mode2ControllerMarkers.forEach(m => {
                    analysis += `  Marker ${m.index}: `;
                    analysis += `Grid(${m.gridX}, ${m.gridZ}), `;
                    analysis += `World(${m.position.x.toFixed(3)}, ${m.position.z.toFixed(3)}), `;
                    analysis += `Distance: ${m.distance.toFixed(3)}m\n`;
                });
                analysis += '\n';
                
                // Overall Deviation
                const totalDeviation = Math.abs(userDist - controllerDist);
                analysis += '--- OVERALL METRICS ---\n';
                analysis += `Total Distance Deviation: ${totalDeviation.toFixed(3)}m (${(totalDeviation/userDist*100).toFixed(1)}%)\n`;
                analysis += `Distance Ratio (actual/planned): ${(controllerDist/userDist).toFixed(3)}\n\n`;
                
                // Marker-by-Marker Analysis (for motor control tuning)
                analysis += '--- MARKER-BY-MARKER COMPARISON ---\n';
                analysis += 'Critical for DC Motor & Ackermann Servo Tuning\n\n';
                
                const minMarkers = Math.min(mode2UserMarkers.length, mode2ControllerMarkers.length);
                let totalSpatialDeviation = 0;
                let maxDeviation = 0;
                let maxDeviationMarker = 0;
                
                for (let i = 0; i < minMarkers; i++) {
                    const userM = mode2UserMarkers[i];
                    const controlM = mode2ControllerMarkers[i];
                    
                    // Spatial deviation (Euclidean distance)
                    const spatialDev = userM.position.distanceTo(controlM.position);
                    totalSpatialDeviation += spatialDev;
                    
                    if (spatialDev > maxDeviation) {
                        maxDeviation = spatialDev;
                        maxDeviationMarker = i;
                    }
                    
                    // Grid cell deviation
                    const gridDeltaX = Math.abs(userM.gridX - controlM.gridX);
                    const gridDeltaZ = Math.abs(userM.gridZ - controlM.gridZ);
                    
                    // Distance deviation at this marker
                    const distDev = Math.abs(userM.distance - controlM.distance);
                    
                    analysis += `Marker ${i}:\n`;
                    analysis += `  Spatial Deviation: ${(spatialDev*100).toFixed(1)}cm\n`;
                    analysis += `  Grid Deviation: ΔX=${gridDeltaX} cells, ΔZ=${gridDeltaZ} cells (${(Math.sqrt(gridDeltaX**2 + gridDeltaZ**2)*10).toFixed(1)}cm)\n`;
                    analysis += `  Distance Deviation: ${(distDev*100).toFixed(1)}cm\n`;
                    analysis += `  Planned: Grid(${userM.gridX}, ${userM.gridZ}) @ ${userM.distance.toFixed(3)}m\n`;
                    analysis += `  Actual:  Grid(${controlM.gridX}, ${controlM.gridZ}) @ ${controlM.distance.toFixed(3)}m\n`;
                    
                    // Velocity estimation between markers
                    if (i > 0) {
                        const userSegDist = userM.distance - mode2UserMarkers[i-1].distance;
                        const controlSegDist = controlM.distance - mode2ControllerMarkers[i-1].distance;
                        const velocityRatio = controlSegDist / userSegDist;
                        analysis += `  Velocity Ratio (actual/planned): ${velocityRatio.toFixed(3)}\n`;
                    }
                    analysis += '\n';
                }
                
                // Summary Statistics
                analysis += '--- SUMMARY STATISTICS ---\n';
                analysis += `Average Spatial Deviation: ${(totalSpatialDeviation/minMarkers*100).toFixed(1)}cm\n`;
                analysis += `Maximum Spatial Deviation: ${(maxDeviation*100).toFixed(1)}cm at Marker ${maxDeviationMarker}\n`;
                analysis += `Marker Count Difference: ${Math.abs(mode2UserMarkers.length - mode2ControllerMarkers.length)}\n\n`;
                
                // Motor Control Recommendations
                analysis += '--- MOTOR CONTROL RECOMMENDATIONS ---\n';
                const avgDeviation = totalSpatialDeviation / minMarkers;
                
                if (avgDeviation > 0.15) {
                    analysis += 'HIGH DEVIATION DETECTED (>15cm average)\n';
                    analysis += 'Recommendations:\n';
                    analysis += '  - Check DC motor calibration\n';
                    analysis += '  - Verify Ackermann steering geometry\n';
                    analysis += '  - Review PID controller gains\n';
                    analysis += '  - Check wheel slip compensation\n';
                } else if (avgDeviation > 0.08) {
                    analysis += 'MODERATE DEVIATION (8-15cm average)\n';
                    analysis += 'Recommendations:\n';
                    analysis += '  - Fine-tune motor speed controllers\n';
                    analysis += '  - Adjust Ackermann servo response time\n';
                    analysis += '  - Consider feedforward compensation\n';
                } else {
                    analysis += 'LOW DEVIATION (<8cm average)\n';
                    analysis += 'Performance: ACCEPTABLE\n';
                    analysis += 'Minor tuning may still improve accuracy\n';
                }
                
                analysis += '\n--- NEXT STEPS FOR IMPROVEMENT ---\n';
                analysis += '1. Focus on markers with highest deviation\n';
                analysis += '2. Analyze velocity ratios for motor response issues\n';
                analysis += '3. Check grid deviations for systematic steering errors\n';
                analysis += '4. Correlate deviations with path curvature\n';
                analysis += '5. Adjust DC motor PWM or Ackermann servo angles accordingly\n';
                
                downloadTextFile('mode2_analysis.txt', analysis);
                debugLog('Mode 2 analysis downloaded with motor control data', 'INFO');
            }
            
            function updateMode2ControllerPath(point) {
                if (!mode2TrackingActive) return;
                
                mode2ControllerPath.push(point.clone());
                
                // Update orange line
                if (mode2ControllerLine) { scene.remove(mode2ControllerLine); mode2ControllerLine = null; }
                if (mode2ControllerPath.length >= 2) {
                    // Adjust points to be ABOVE the grid
                    const adjustedPoints = mode2ControllerPath.map(p => new THREE.Vector3(p.x, floorY + 0.003, p.z));
                    const geo = new THREE.BufferGeometry().setFromPoints(adjustedPoints);
                    mode2ControllerLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xff8800, linewidth: 3 })); // ORANGE
                    scene.add(mode2ControllerLine);
                }
                
                // Update controller markers every 20cm
                if (!mode2ControllerMarkersGroup) {
                    mode2ControllerMarkersGroup = new THREE.Group();
                    scene.add(mode2ControllerMarkersGroup);
                }
                
                // Calculate cumulative distance
                let cumulativeDistance = 0;
                for (let i = 1; i < mode2ControllerPath.length; i++) {
                    cumulativeDistance += mode2ControllerPath[i].distanceTo(mode2ControllerPath[i-1]);
                }
                
                // Check if we need a new marker
                const lastMarkerDist = mode2ControllerMarkers.length > 0 ? 
                    mode2ControllerMarkers[mode2ControllerMarkers.length - 1].distance : -1;
                
                if (mode2ControllerMarkers.length === 0 || cumulativeDistance >= lastMarkerDist + 0.20) {
                    const markerIndex = mode2ControllerMarkers.length;
                    const marker = createPathMarker(point, markerIndex, 0xff8800);
                    mode2ControllerMarkersGroup.add(marker);
                    mode2ControllerMarkers.push({
                        index: markerIndex,
                        position: point.clone(),
                        distance: cumulativeDistance,
                        gridX: Math.floor((point.x + MAP_SIZE/2) / 0.1),
                        gridZ: Math.floor((point.z + MAP_SIZE/2) / 0.1)
                    });
                    
                    debugLog(`Mode 2: Controller marker ${markerIndex} at ${cumulativeDistance.toFixed(2)}m`, 'INFO');
                }
            }

                        }

                    }

                if (!robotIcon) {

                    robotIcon = new THREE.Mesh(geo2, new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
                    scene.add(robotIcon);
                }

                trackingInterval = setInterval(() => {
                    if (!isTrackingRobot || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                    if (!triangleMarker) return;
                    const pos = triangleMarker.position;
                    const x_cm = ((pos.x - userX) / MAP_SIZE * 200).toFixed(1);
                    const z_cm = ((pos.z - userZ) / MAP_SIZE * 200).toFixed(1);
                    const dist = Math.sqrt((pos.x - userX)**2 + (pos.z - userZ)**2);
                    const dist_cm = (dist / MAP_SIZE * 200).toFixed(1);
                    const heading = ((triangleMarker.rotation.y * 180 / Math.PI + 360) % 360).toFixed(1);
                    websocket.send(JSON.stringify({
                        command: 'ROBOT_POSITION',
                        data: {
                            x_cm: parseFloat(x_cm), z_cm: parseFloat(z_cm),
                            heading_deg: parseFloat(heading),
                            distance_from_center_cm: parseFloat(dist_cm),
                            timestamp: performance.now() / 1000
                        }
                    }));
                }, 200);
            }

            function stopRobotTracking() {
                isTrackingRobot = false;
                if (trackingInterval) { clearInterval(trackingInterval); trackingInterval = null; }
                if (triangleMarker) { scene.remove(triangleMarker); triangleMarker = null; }
