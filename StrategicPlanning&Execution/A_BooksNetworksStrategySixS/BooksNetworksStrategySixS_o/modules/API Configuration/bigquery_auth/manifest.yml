module:
  id: "bigquery_auth"
  name: "BigQuery Authentication"
  description: "Authenticate to Google BigQuery ONCE for all three suites - auto-creates all three tables (Flex Table, Mind Map, Knowledge Graph) in the same project/dataset"
  version: "1.0.0"
  author: "Unified Suite Team"

  enabled: true

  menu:
    label: "BigQuery Setup"
    icon: "database"
    tabname: "bigquery_auth"
    group: "API Configuration"
    badge:
      label: null
      color: null

  dependencies:
    packages:
      - shiny
      - shinydashboard
      - shinyjs
      - bigrquery
      - jsonlite

    package_versions:
      bigrquery: ">= 1.4.0"

  api:
    required: []
    optional: []

  data:
    required: []
    optional: []
