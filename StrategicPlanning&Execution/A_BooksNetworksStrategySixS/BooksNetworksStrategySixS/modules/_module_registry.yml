# modules/_module_registry.yml
# Which sub-tabs exist is decided by the files: one file per sub-tab, modules/<Tab group>/<id>.R, with its name, icon and
# description in the header of that file. This registry only says how the sidebar is grouped and, per sub-tab, whether it
# is enabled and where it sorts. Hubs (the sidebar entries that hold horizontal sub-tabs) are defined in R/utils_td_hubs.R.

app:
  name: "BooksNetworksStrategySixS"
  version: "1.4.0"
  description: "Eight AI-powered, BigQuery-backed suites in one app: book summaries, flexible comparison tables, mind maps, knowledge graphs, Sankey flow diagrams, strategy diagrams, Six Sigma diagrams and technical designs - sharing one Editing Tool API connection and one BigQuery connection across eight tables in the same project/dataset"

groups:
  - id: api_config
    label: "API Configuration"
    icon: "key"
    expanded: true
    modules: [api_hub_conn]

  - id: book_summary
    label: "Book Summary"
    icon: "book"
    expanded: false
    modules: [bk_hub_create, bk_hub_explore, books_about]

  - id: flex_table
    label: "Flex Table"
    icon: "table"
    expanded: false
    modules: [fx_hub_create, fx_hub_explore, flex_table_about]

  - id: mind_map
    label: "Mind Map"
    icon: "share-nodes"
    expanded: false
    modules: [mm_hub_create, mm_hub_explore, mindmap_about]

  - id: knowledge_graph
    label: "Knowledge Graph"
    icon: "diagram-project"
    expanded: false
    modules: [kg_hub_create, kg_hub_explore, kg_about]

  - id: sankey_graph
    label: "Sankey Graph"
    icon: "water"
    expanded: false
    modules: [sk_hub_create, sk_hub_explore, sankey_about]

  - id: strategic_analysis
    label: "Strategic Analysis"
    icon: "chess"
    expanded: false
    modules: [sa_hub_learn, sa_hub_create, sa_hub_explore, business_consulting, diagram_about]

  - id: six_sigma_analysis
    label: "Six Sigma Analysis"
    icon: "microscope"
    expanded: false
    modules: [ss_hub_learn, ss_hub_create, ss_hub_explore, sixsigma_about]

  - id: technical_designs
    label: "Technical Designs"
    icon: "sitemap"
    expanded: false
    modules: [td_hub_arch, td_hub_algo, td_hub_social, td_hub_manage, td_hub_studio, techdesign_about]

