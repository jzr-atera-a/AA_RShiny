# ============================================================================
# MODULE REGISTRY - ENABLE/DISABLE CONTROL CENTER
# ============================================================================
#
# Change "enabled: true/false" for any module to enable/disable it
# Priority determines load order (lower numbers load first)
#
# ============================================================================

modules:
  settings:
    enabled: true
    priority: 1
    description: "OpenAI API configuration and testing"
  
  converter:
    enabled: true
    priority: 10
    description: "M4A to MP3 audio converter with auto-splitting"
  
  splitter:
    enabled: true
    priority: 20
    description: "Audio file splitter by size or number of segments"
  
  transcription:
    enabled: true
    priority: 30
    description: "Audio transcription using OpenAI Whisper API"
  
  bulk_analysis:
    enabled: true
    priority: 40
    description: "Bulk text file analysis and summarization with ChatGPT"
  
  analytics:
    enabled: true
    priority: 50
    description: "Analytics dashboard with processing history"

# Global settings
settings:
  auto_install: false
  check_versions: true
  verbose: true
  dev_mode: false

# Application metadata
app:
  name: "Audio Processing Dashboard"
  version: "2.0.0"
  description: "Modular audio processing, transcription, and analysis platform"
  author: "Audio Processing Team"
