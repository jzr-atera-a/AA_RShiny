# modules/_module_registry.yml
# Meta ML Interview Prep Suite v3.0
# Priority controls load/source order — sidebar order is now driven by
# SIDEBAR_GROUPS in global.R, not by priority.

app:
  name: "Meta ML Interview Prep"
  version: "3.0.0"

modules:

  # ── Standalone tools (appear first in sidebar) ──────────────
  python_runner:
    enabled: true
    priority: 5
    name: "Python Runner"
    icon: "terminal"
    tabname: "python_runner"

  ml_design_whiteboard:
    enabled: true
    priority: 6
    name: "Design Whiteboard"
    icon: "chalkboard"
    tabname: "ml_design_whiteboard"

  # ── Welcome & Overview ───────────────────────────────────────
  intro:
    enabled: true
    priority: 10
    name: "Welcome & Overview"
    icon: "home"
    tabname: "intro"

  intro_profile:
    enabled: true
    priority: 11
    name: "Your Candidacy"
    icon: "id-badge"
    tabname: "intro_profile"

  # ── Engineer Qualities ───────────────────────────────────────
  qualities:
    enabled: true
    priority: 20
    name: "Engineer Qualities"
    icon: "star"
    tabname: "qualities"

  qualities_profile:
    enabled: true
    priority: 21
    name: "Your Qualities"
    icon: "medal"
    tabname: "qualities_profile"

  # ── Coding Interview ─────────────────────────────────────────
  coding_interview:
    enabled: true
    priority: 30
    name: "Coding Interview"
    icon: "code"
    tabname: "coding_interview"

  coding_profile:
    enabled: true
    priority: 31
    name: "Your Coding Angle"
    icon: "laptop-code"
    tabname: "coding_profile"

  # ── ML Design Interview ──────────────────────────────────────
  ml_design:
    enabled: true
    priority: 40
    name: "ML Design Interview"
    icon: "brain"
    tabname: "ml_design"

  ml_design_profile:
    enabled: true
    priority: 41
    name: "Your ML Systems"
    icon: "robot"
    tabname: "ml_design_profile"

  # ── Technical Project ────────────────────────────────────────
  tech_project:
    enabled: true
    priority: 50
    name: "Technical Project"
    icon: "project-diagram"
    tabname: "tech_project"

  tech_project_profile:
    enabled: true
    priority: 51
    name: "Your Projects"
    icon: "layer-group"
    tabname: "tech_project_profile"

  # ── Cross-Functional ─────────────────────────────────────────
  cross_functional:
    enabled: true
    priority: 60
    name: "Cross-Functional"
    icon: "handshake"
    tabname: "cross_functional"

  cross_functional_profile:
    enabled: true
    priority: 61
    name: "Your XFN Stories"
    icon: "people-arrows"
    tabname: "cross_functional_profile"

  # ── Career Interview ─────────────────────────────────────────
  career_interview:
    enabled: true
    priority: 70
    name: "Career Interview"
    icon: "user-tie"
    tabname: "career_interview"

  career_profile:
    enabled: true
    priority: 71
    name: "Your Career Story"
    icon: "user-graduate"
    tabname: "career_profile"
