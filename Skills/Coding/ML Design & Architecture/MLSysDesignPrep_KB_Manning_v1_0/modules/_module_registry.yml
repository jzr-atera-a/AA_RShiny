# modules/_module_registry.yml
# ML System Design Interview Prep
# Authors: Arseny Kravchenko, Valerii Babushkin (Manning, Feb 2025)

app:
  name: "ML System Design Prep — Kravchenko & Babushkin"
  version: "1.2.0"

groups:
  - id: core
    label: "K&B System Design"
    icon: "book"
    expanded: true
    modules: [intro, requirements, data_pipeline, feature_store, modelling, experiment_tracking, evaluation, serving, monitoring, end_to_end]

  - id: case_studies
    label: "Use Cases"
    icon: "briefcase"
    expanded: false
