# modules/Travel Planning/travel_itinerary_planner/manifest.yml
# Travel Itinerary Planner Module Configuration

module:
  id: travel_itinerary_planner
  name: "Travel Itinerary Planner"
  description: "AI-powered travel planning: discover attractions, select favorites, and generate optimized multi-day itineraries with Claude"
  version: "1.0.0"
  author: "Business Operations Suite"
  category: "travel_planning"
  
  # Module capabilities
  features:
    - "Destination-based attraction discovery"
    - "Customizable attraction selection (20-50 places)"
    - "Multi-day itinerary generation (1-7 days)"
    - "Constraint-based planning"
    - "Time and schedule optimization"
    - "Opening hours verification"
    - "Transit routing suggestions"
    - "Export as HTML with map placeholder"
    - "Export as mobile-friendly PDF"
    - "Export as iCalendar (.ics) for Outlook/Google Calendar"
    - "Multiple download format support"

  # Dependencies
  dependencies:
    - shiny
    - shinydashboard
    - shinyjs
    - DT
    - jsonlite
    - rmarkdown  # For PDF export
    - tinytex    # Optional: for PDF generation

  # API requirements
  api_requirements:
    - claude_api_config

  # Database schema
  database:
    tables: []
    
  # Configuration
  config:
    default_places: 30
    max_places: 50
    min_places: 20
    default_days: 3
    max_days: 7
    min_days: 1

  # Permissions
  permissions:
    - read
    - write
    - execute
    - export

  # Status
  enabled: true
  priority: 50
