# modules/_module_registry.yml
# Central Module Registry - Business Operations Suite
# Change 'enabled: false' to disable any module. Priority controls ordering
# WITHIN each sidebar group. Group membership/order/expanded state is
# controlled by the top-level `groups:` list below.
#
# SIDEBAR SECTIONS: inside a group, `sections:` bundles modules by topic. Each section is ONE sidebar item and its
# modules appear as horizontal tabs in the page. To regroup, move a module id between `sections:` lists (keep it in the
# group's `modules:` list too). A module no section lists keeps its own sidebar item. See R/utils_nav.R.

groups:
  - id: api_config
    label: "API Configuration"
    icon: "key"
    expanded: true
    modules: [bigquery_auth, claude_api_config, titan_auth, debug_console]
    sections:
      - id: sec_connections
        label: "API Configuration"
        icon: "key"
        modules: [bigquery_auth, claude_api_config, titan_auth, debug_console]
        tab_labels: {bigquery_auth: "BigQuery", claude_api_config: "Claude", titan_auth: "Titan Calendar", debug_console: "Debug Console"}

  - id: day_planner
    label: "Day Planner"
    icon: "route"
    expanded: false
    modules: [generate_schedule, schedule_generate_prep, schedule_prep_checklist, schedule_bulk_import, schedule_add_single, schedule_browse, schedule_visualizations, schedule_commitment_config, schedule_add_commitment, schedule_commitments_browse, schedule_about]
    sections:
      - id: sec_dp_plan
        label: "Plan the Day"
        icon: "route"
        modules: [generate_schedule, schedule_bulk_import, schedule_add_single]
        tab_labels: {generate_schedule: "Generate Schedule", schedule_bulk_import: "Bulk Import", schedule_add_single: "Add Entry"}
      - id: sec_dp_prep
        label: "Day Preparation"
        icon: "clipboard-check"
        modules: [schedule_generate_prep, schedule_prep_checklist]
        tab_labels: {schedule_generate_prep: "Generate Prep Steps", schedule_prep_checklist: "Checklist"}
      - id: sec_dp_commit
        label: "Commitments"
        icon: "handshake"
        modules: [schedule_add_commitment, schedule_commitments_browse, schedule_commitment_config]
        tab_labels: {schedule_add_commitment: "Add", schedule_commitments_browse: "Browse", schedule_commitment_config: "Trello Config"}
      - id: sec_dp_review
        label: "Review"
        icon: "table"
        modules: [schedule_browse, schedule_visualizations, schedule_about]
        tab_labels: {schedule_browse: "Browse Data", schedule_visualizations: "Visualizations", schedule_about: "About"}

  - id: diet_planner
    label: "Diet Planner"
    icon: "utensils"
    expanded: false
    modules: [generate_diet, diet_bulk_import, diet_add_single, diet_browse, diet_visualizations, diet_about]
    sections:
      - id: sec_diet_log
        label: "Plan & Log"
        icon: "utensils"
        modules: [generate_diet, diet_bulk_import, diet_add_single]
        tab_labels: {generate_diet: "Generate Diet", diet_bulk_import: "Bulk Import", diet_add_single: "Add Entry"}
      - id: sec_diet_review
        label: "Review"
        icon: "table"
        modules: [diet_browse, diet_visualizations, diet_about]
        tab_labels: {diet_browse: "Browse Data", diet_visualizations: "Visualizations", diet_about: "About"}

  - id: exercise_tracker
    label: "Exercise Tracker"
    icon: "dumbbell"
    expanded: false
    modules: [generate_workout, muscle_programme, muscle_log, muscle_map, muscle_progress, exercise_bulk_import, exercise_add_single, exercise_browse, exercise_visualizations, exercise_about]
    sections:
      - id: sec_ex_log
        label: "Workouts"
        icon: "dumbbell"
        modules: [generate_workout, exercise_bulk_import, exercise_add_single]
        tab_labels: {generate_workout: "Generate Workout", exercise_bulk_import: "Bulk Import", exercise_add_single: "Add Entry"}
      - id: sec_ex_muscle
        label: "Muscle Building"
        icon: "child"
        modules: [muscle_programme, muscle_log, muscle_map, muscle_progress]
        tab_labels: {muscle_programme: "Programme", muscle_log: "Log Sets", muscle_map: "Muscle Map", muscle_progress: "Progress"}
      - id: sec_ex_review
        label: "Workout Review"
        icon: "table"
        modules: [exercise_browse, exercise_visualizations, exercise_about]
        tab_labels: {exercise_browse: "Browse Data", exercise_visualizations: "Visualizations", exercise_about: "About"}

  - id: events_scheduling
    label: "Events Scheduling"
    icon: "calendar-alt"
    expanded: false
    modules: [scan_events, zoom_schedule, bulk_import_events, browse_events, visualizations_events, events_to_calendar, events_about]
    sections:
      - id: sec_ev_find
        label: "Find & Save Events"
        icon: "magnifying-glass"
        modules: [scan_events, bulk_import_events]
        tab_labels: {scan_events: "Scan Events", bulk_import_events: "Bulk Import"}
      - id: sec_ev_calendar
        label: "Calendar & Invites"
        icon: "calendar-alt"
        modules: [events_to_calendar, zoom_schedule]
        tab_labels: {events_to_calendar: "Events to Calendar", zoom_schedule: "Zoom Schedule"}
      - id: sec_ev_review
        label: "Review"
        icon: "table"
        modules: [browse_events, visualizations_events, events_about]
        tab_labels: {browse_events: "Browse Events", visualizations_events: "Visualizations", events_about: "About"}

  - id: funding_programmes
    label: "Funding Programmes"
    icon: "hand-holding-usd"
    expanded: false
    modules: [generate_programme, funding_bulk_import, funding_add_single, funding_browse, funding_visualizations, funding_about]
    sections:
      - id: sec_fund_find
        label: "Find & Add"
        icon: "hand-holding-usd"
        modules: [generate_programme, funding_bulk_import, funding_add_single]
        tab_labels: {generate_programme: "Find Programmes", funding_bulk_import: "Bulk Import", funding_add_single: "Add Entry"}
      - id: sec_fund_review
        label: "Review"
        icon: "table"
        modules: [funding_browse, funding_visualizations, funding_about]
        tab_labels: {funding_browse: "Browse Data", funding_visualizations: "Visualizations", funding_about: "About"}

  - id: gantt_tickets
    label: "Gantt to Tickets"
    icon: "tasks"
    expanded: false
    modules: [gantt_api_config, gantt_email_config, gantt_upload, gantt_review_edit, gantt_submit_boards, gantt_email_send, gantt_manage_contacts, gantt_email_contacts]
    sections:
      - id: sec_gantt_tasks
        label: "Tasks"
        icon: "tasks"
        modules: [gantt_upload, gantt_review_edit, gantt_submit_boards]
        tab_labels: {gantt_upload: "Upload Gantt", gantt_review_edit: "Review & Edit", gantt_submit_boards: "Submit to Boards"}
      - id: sec_gantt_people
        label: "Contacts & Email"
        icon: "envelope"
        modules: [gantt_manage_contacts, gantt_email_send, gantt_email_contacts]
        tab_labels: {gantt_manage_contacts: "Manage Contacts", gantt_email_send: "Email Notifications", gantt_email_contacts: "Bulk Email"}
      - id: sec_gantt_settings
        label: "Settings"
        icon: "gear"
        modules: [gantt_api_config, gantt_email_config]
        tab_labels: {gantt_api_config: "Trello & Jira", gantt_email_config: "Email (SMTP)"}

  - id: contact_manager
    label: "Contact Manager"
    icon: "address-book"
    expanded: false
    modules: [contacts_api_config, contacts_process, contacts_explore, contacts_customise_communication, contacts_send_email]
    sections:
      - id: sec_ct_contacts
        label: "Contacts"
        icon: "address-book"
        modules: [contacts_process, contacts_explore, contacts_api_config]
        tab_labels: {contacts_process: "Process Contact", contacts_explore: "Explore Contacts", contacts_api_config: "OpenAI Config"}
      - id: sec_ct_outreach
        label: "Outreach"
        icon: "paper-plane"
        modules: [contacts_customise_communication, contacts_send_email]
        tab_labels: {contacts_customise_communication: "Customise Message", contacts_send_email: "Send Email"}

  - id: travel_planning
    label: "Travel Planning"
    icon: "globe"
    expanded: true
    modules: [travel_itinerary_planner]

  - id: online_collaboration
    label: "Online Collaboration"
    icon: "comments"
    expanded: false
    modules: [slack_connection, slack_channels]
    sections:
      - id: sec_collab
        label: "Online Collaboration"
        icon: "comments"
        modules: [slack_connection, slack_channels]
        tab_labels: {slack_connection: "Slack Connection", slack_channels: "Channels"}

modules:
  # ---- API Configuration (shared by all three suites) ----
  bigquery_auth:
    enabled: true
    priority: 1
    description: "BigQuery authentication - one connection, three tables"

  claude_api_config:
    enabled: true
    priority: 2
    description: "Claude API credentials management, shared by all suites"

  debug_console:
    enabled: true
    priority: 90
    description: "Live mirror of the R console, copy-friendly for mobile browsers"

  # ---- Day Planner ----
  generate_schedule:
    enabled: true
    priority: 3
    description: "AI-powered day/trip schedule generation"

  schedule_generate_prep:
    enabled: true
    priority: 70
    description: "AI-generated night-before preparation checklist for a planned day"

  schedule_prep_checklist:
    enabled: true
    priority: 71
    description: "Interactive checklist to track completion of a day's preparation steps"

  schedule_bulk_import:
    enabled: true
    priority: 4
    description: "Parse and upload schedules in bulk"

  schedule_add_single:
    enabled: true
    priority: 5
    description: "Add an individual schedule row entry"

  schedule_browse:
    enabled: true
    priority: 6
    description: "Browse and download all planned schedules"

  schedule_visualizations:
    enabled: true
    priority: 7
    description: "Itinerary timeline visualization with time-allocation chart"

  schedule_commitment_config:
    enabled: true
    priority: 72
    description: "Trello API credentials for pushing commitments to a board, local to this feature"

  schedule_add_commitment:
    enabled: true
    priority: 73
    description: "Log a new monthly commitment, with optional push to Trello"

  schedule_commitments_browse:
    enabled: true
    priority: 74
    description: "Browse, filter, and update the status of monthly commitments; load one into Generate Schedule"

  schedule_about:
    enabled: true
    priority: 8
    description: "Day Planner schema documentation"

  # ---- Diet Planner ----
  generate_diet:
    enabled: true
    priority: 9
    description: "AI-generated daily meal plan"

  diet_bulk_import:
    enabled: true
    priority: 10
    description: "Parse and upload a day's diet log in bulk"

  diet_add_single:
    enabled: true
    priority: 11
    description: "Log a single meal entry"

  diet_browse:
    enabled: true
    priority: 12
    description: "Browse and download all logged diet days"

  diet_visualizations:
    enabled: true
    priority: 13
    description: "Daily nutrition timeline and macro chart"

  diet_about:
    enabled: true
    priority: 14
    description: "Diet Planner schema documentation"

  # ---- Exercise Tracker ----
  generate_workout:
    enabled: true
    priority: 15
    description: "AI-generated workout plan"

  muscle_programme:
    enabled: true
    priority: 15.1
    description: "Weekly muscle-building split; three options per day (gym / no equipment / home kit); Claude plans, app drives progression"

  muscle_log:
    enabled: true
    priority: 15.2
    description: "Log sets, loads, reps and RIR for a planned muscle workout"

  muscle_map:
    enabled: true
    priority: 15.3
    description: "Interactive anatomy diagram with weekly set gaps per muscle"

  muscle_progress:
    enabled: true
    priority: 15.4
    description: "Week-over-week volume, load progression and editable weekly set targets"

  exercise_bulk_import:
    enabled: true
    priority: 16
    description: "Parse and upload a workout session in bulk"

  exercise_add_single:
    enabled: true
    priority: 17
    description: "Log a single exercise/activity entry"

  exercise_browse:
    enabled: true
    priority: 18
    description: "Browse and download all logged workouts"

  exercise_visualizations:
    enabled: true
    priority: 19
    description: "Workout timeline and volume/calories chart"

  exercise_about:
    enabled: true
    priority: 20
    description: "Exercise Tracker schema documentation"

  # ---- Events Scheduling ----
  scan_events:
    enabled: true
    priority: 30
    description: "AI-powered city event scanning via Claude web search"

  zoom_schedule:
    enabled: true
    priority: 30.5
    description: "Read a Zoom invite screenshot with Claude and hand it to Events to Calendar"

  bulk_import_events:
    enabled: true
    priority: 31
    description: "Parse and bulk-upload events text"

  add_single_event:
    enabled: false
    priority: 32
    description: "Manually add a single event"

  browse_events:
    enabled: true
    priority: 33
    description: "Browse and download all events"

  visualizations_events:
    enabled: true
    priority: 34
    description: "Event details, calendar, and chart visualizations"

  events_about:
    enabled: true
    priority: 35
    description: "Events Scheduling schema documentation"

  titan_auth:
    enabled: true
    priority: 3
    description: "Sign in to the Titan calendar from an authenticateT.R file"

  events_to_calendar:
    enabled: true
    priority: 37
    description: "Create events, import .ics files and save them to the Titan calendar"

  # ---- Funding Programmes ----
  generate_programme:
    enabled: true
    priority: 40
    description: "AI-assisted grant/incubator/competition discovery"

  funding_bulk_import:
    enabled: true
    priority: 41
    description: "Parse and upload programmes in bulk"

  funding_add_single:
    enabled: true
    priority: 42
    description: "Add a single programme entry manually"

  funding_browse:
    enabled: true
    priority: 43
    description: "Browse and download all saved programmes"

  funding_visualizations:
    enabled: true
    priority: 44
    description: "Filterable programme visualizations with date-range filters"

  funding_about:
    enabled: true
    priority: 45
    description: "Funding Programmes schema documentation"

  # ---- Gantt to Tickets (Trello/Jira/SMTP local to this group) ----
  gantt_api_config:
    enabled: true
    priority: 50
    description: "Trello and Jira API credentials, local to this suite"

  gantt_email_config:
    enabled: true
    priority: 51
    description: "SMTP email configuration for task notifications, local to this suite"

  gantt_upload:
    enabled: true
    priority: 52
    description: "Upload a Gantt chart Excel file"

  gantt_review_edit:
    enabled: true
    priority: 53
    description: "Review and edit imported tasks"

  gantt_submit_boards:
    enabled: true
    priority: 54
    description: "Submit tasks to Trello boards or Jira projects"

  gantt_email_send:
    enabled: true
    priority: 55
    description: "Send email notifications to task assignees"

  gantt_manage_contacts:
    enabled: true
    priority: 56
    description: "Manage the assignee contact list for this suite"

  gantt_email_contacts:
    enabled: true
    priority: 57
    description: "Bulk email contacts with filtering"

  # ---- Contact Manager (OpenAI + its own SMTP local to this group;
  #      BigQuery uses the shared connection/pattern) ----
  contacts_api_config:
    enabled: true
    priority: 60
    description: "OpenAI API credentials, local to this suite"

  contacts_smtp_config:
    enabled: false
    priority: 61
    description: "SMTP email configuration, local to this suite"

  contacts_process:
    enabled: true
    priority: 62
    description: "Extract contact information from documents with an LLM"

  contacts_explore:
    enabled: true
    priority: 63
    description: "Browse, filter, and manage contacts"

  contacts_customise_communication:
    enabled: true
    priority: 64
    description: "Generate personalized outreach messages with an LLM"

  contacts_send_email:
    enabled: true
    priority: 65
    description: "Compose and send emails with attachments"

  # ---- Travel Planning ----
  # ---- Online Collaboration (Slack) ----
  slack_connection:
    enabled: true
    priority: 80
    description: "Connect to the company's internal Slack app with a bot token"

  slack_channels:
    enabled: true
    priority: 81
    description: "Browse Slack channels, read messages and threads, post updates"

  travel_itinerary_planner:
    enabled: true
    priority: 80
    description: "AI-powered travel itinerary planner with Claude - discover attractions, select favorites, generate optimized multi-day plans"

settings:
  auto_install: false
  check_versions: true
  verbose: true
  dev_mode: false

app:
  name: "Business Operations Suite: Travel + Day Planner + Diet + Exercise + Events + Funding + Gantt + Contacts"
  version: "2.0.0"
  description: "Eight AI-powered suites in one app: AI travel itinerary planning (with HTML/PDF/calendar export), day/trip scheduling with prep checklists and monthly commitments, daily diet planning, exercise tracking, city event discovery, funding programme discovery, Gantt-to-tickets conversion, and AI contact management. Diet, Exercise, Events, Funding, and Gantt task browsing support calendar (.ics) export for Outlook and Android Calendar. Shares one Claude connection and one BigQuery connection, with app-specific APIs (Trello x2 separate connections, Jira, OpenAI, SMTP x2 separate connections) kept local to their own suites."
  author: "Your Team"
