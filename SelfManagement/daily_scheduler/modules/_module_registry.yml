# modules/_module_registry.yml
# Central Module Registry - THE CONTROL CENTER
# Change 'enabled: false' to disable any module
# =============================================

modules:
  # API Authentication Modules (Load First)
  bigquery_auth:
    enabled: true
    priority: 1
    description: "BigQuery authentication and configuration"

  claude_api_config:
    enabled: true
    priority: 2
    description: "Claude API credentials management"

  # Core Feature Modules
  generate_schedule:
    enabled: true
    priority: 10
    description: "AI-powered day schedule generation"

  bulk_import:
    enabled: true
    priority: 11
    description: "Parse and upload schedules in bulk"

  add_single:
    enabled: true
    priority: 12
    description: "Add individual schedule row entries"

  browse_data:
    enabled: true
    priority: 13
    description: "Browse and download all planned schedules"

  visualizations:
    enabled: true
    priority: 14
    description: "Rich itinerary timeline visualizations"

  about:
    enabled: true
    priority: 99
    description: "Application information and schema"

# Global Settings
settings:
  auto_install: false              # Don't auto-install packages
  check_versions: true
  verbose: true                    # Show loading messages
  dev_mode: false

# Application Metadata
app:
  name: "Daily Scheduler Suite"
  version: "1.0.0"
  description: "AI-powered day/trip scheduling with cloud database storage"
  author: "Your Team"
  table: "atera-2.business_strategy.day_scheduler"
